<div class="login-wrapper">
  <div class="card login-card">
    <h1 class="sr-only">Iniciar sesión en Nestra</h1>
    <img src="assets/nestra_logo.png?v=2" alt="Nestra — Finanzas en pareja" class="login-logo brand-logo--light" />
    <img src="assets/nestra_logo_dark.png?v=2" alt="Nestra — Finanzas en pareja" class="login-logo brand-logo--dark" />
    <p class="card-subtitle login-subtitle">Inicia sesión en tu cuenta</p>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required placeholder="tu@email.com" autocomplete="email" />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required placeholder="••••••••" autocomplete="current-password" />
      </div>

      <div id="loginError" class="alert error login-error" role="alert" aria-live="assertive" style="display: none;"></div>

      <button type="submit" class="btn btn-primary btn-block">
        <span id="loginButtonText">Ingresar</span>
        <span id="loginSpinner" class="spinner" role="status" aria-label="Iniciando sesión" style="display: none;"></span>
      </button>
    </form>

    <div class="login-divider"><span>o</span></div>

    <button type="button" id="googleSignIn" class="btn btn-secondary btn-block">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="vertical-align:-3px;margin-right:8px;">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1Z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.15-4.53H2.18v2.84A11 11 0 0 0 12 23Z"/>
        <path fill="#FBBC05" d="M5.85 14.1a6.6 6.6 0 0 1 0-4.2V7.06H2.18a11 11 0 0 0 0 9.88l3.67-2.84Z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1A11 11 0 0 0 2.18 7.06l3.67 2.84C6.71 7.31 9.14 5.38 12 5.38Z"/>
      </svg>
      Continuar con Google
    </button>
  </div>
</div>

<style>
  /* Login view — layout only (components/tokens carry the styling) */
  .login-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: var(--space-lg);
  }

  .login-card {
    max-width: 400px;
    width: 100%;
  }

  .login-card:hover {
    transform: none;
    box-shadow: var(--shadow-md);
  }

  .login-logo {
    display: block;
    width: 180px;
    max-width: 100%;
    height: auto;
    margin: 0 auto var(--space-sm);
  }

  .login-logo.brand-logo--dark { display: none !important; }
  html.dark .login-logo.brand-logo--light { display: none !important; }
  html.dark .login-logo.brand-logo--dark  { display: block !important; }
  @media (prefers-color-scheme: dark) {
    html:not(.light) .login-logo.brand-logo--light { display: none !important; }
    html:not(.light) .login-logo.brand-logo--dark  { display: block !important; }
  }

  .login-subtitle {
    text-align: center;
    margin-bottom: var(--space-lg);
  }

  .login-error {
    margin-bottom: var(--space-md);
  }

  .login-divider {
    display: flex;
    align-items: center;
    text-align: center;
    margin: var(--space-md) 0;
    color: var(--text-muted, #888);
    font-size: 0.85rem;
  }
  .login-divider::before,
  .login-divider::after {
    content: "";
    flex: 1;
    border-bottom: 1px solid var(--border-color, #ddd);
  }
  .login-divider span { padding: 0 var(--space-sm); }
</style>

<script>
  document.getElementById('loginForm').addEventListener('submit', async function (e) {
    e.preventDefault();

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const loginError = document.getElementById('loginError');
    const loginButtonText = document.getElementById('loginButtonText');
    const loginSpinner = document.getElementById('loginSpinner');
    const loginButton = this.querySelector('button[type="submit"]');

    // Hide error initially
    loginError.style.display = 'none';
    loginError.textContent = '';

    // Show spinner, hide text, disable button
    loginSpinner.style.display = 'inline-block';
    loginButtonText.style.display = 'none';
    loginButton.disabled = true;
    loginButton.setAttribute('aria-busy', 'true');

    try {
      const user = await login(email, password);
      if (user) {
        // Navigate to dashboard (correct hash format)
        window.location.hash = '#dashboard';
      }
    } catch (error) {
      // Show error message
      loginError.textContent = error.message || 'Error al ingresar. Intenta de nuevo.';
      loginError.style.display = 'flex';

      // Restore button state
      loginSpinner.style.display = 'none';
      loginButtonText.style.display = 'inline';
      loginButton.disabled = false;
      loginButton.removeAttribute('aria-busy');
    }
  });

  document.getElementById('googleSignIn').addEventListener('click', async function () {
    var loginError = document.getElementById('loginError');
    loginError.style.display = 'none';
    this.disabled = true;
    try {
      await signInWithGoogle(); // redirects away on success
    } catch (error) {
      loginError.textContent = error.message || 'No se pudo iniciar con Google.';
      loginError.style.display = 'flex';
      this.disabled = false;
    }
  });
</script>
