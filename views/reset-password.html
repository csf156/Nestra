<div class="login-wrapper">
  <div class="card login-card">
    <img src="assets/nestra_logo.png?v=2" alt="Nestra" class="login-logo brand-logo--light" />
    <img src="assets/nestra_logo_dark.png?v=2" alt="Nestra" class="login-logo brand-logo--dark" />
    <p class="card-subtitle login-subtitle">Nueva contraseña</p>

    <form id="resetForm">
      <div class="form-group">
        <label for="newPassword">Nueva contraseña</label>
        <input type="password" id="newPassword" name="newPassword" required
               placeholder="••••••••" autocomplete="new-password" minlength="8" />
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirmar contraseña</label>
        <input type="password" id="confirmPassword" name="confirmPassword" required
               placeholder="••••••••" autocomplete="new-password" minlength="8" />
      </div>

      <div id="resetError" class="alert error" role="alert" aria-live="assertive" style="display:none;"></div>
      <div id="resetSuccess" class="alert alert-success" role="status" aria-live="polite" style="display:none;"></div>

      <button type="submit" id="resetBtn" class="btn btn-primary btn-block">
        <span id="resetBtnText">Actualizar contraseña</span>
        <span id="resetSpinner" class="spinner" role="status" aria-label="Guardando" style="display:none;"></span>
      </button>
    </form>
  </div>
</div>

<style>
  .login-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: var(--space-lg);
  }
  .login-card {
    max-width: 400px;
    width: 100%;
    background-color: var(--bg-light-secondary);
  }
  .login-card:hover {
    transform: none;
    box-shadow: var(--shadow-md);
  }
  .login-logo {
    display: block;
    width: 180px;
    max-width: 100%;
    height: auto;
    margin: 0 auto var(--space-sm);
  }

  .login-logo.brand-logo--dark { display: none !important; }
  html.dark .login-logo.brand-logo--light { display: none !important; }
  html.dark .login-logo.brand-logo--dark  { display: block !important; }
  @media (prefers-color-scheme: dark) {
    html:not(.light) .login-logo.brand-logo--light { display: none !important; }
    html:not(.light) .login-logo.brand-logo--dark  { display: block !important; }
  }

  .login-subtitle {
    text-align: center;
    margin-bottom: var(--space-lg);
    font-family: var(--font-display);
    font-weight: 400;
    letter-spacing: -0.01em;
    color: var(--text-dark);
  }
</style>

<script>
  (function () {
    document.getElementById('resetForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      var newPwd  = document.getElementById('newPassword').value;
      var confirm = document.getElementById('confirmPassword').value;
      var errEl   = document.getElementById('resetError');
      var okEl    = document.getElementById('resetSuccess');
      var btn     = document.getElementById('resetBtn');
      var btnTxt  = document.getElementById('resetBtnText');
      var spinner = document.getElementById('resetSpinner');

      errEl.style.display = 'none';
      okEl.style.display  = 'none';

      if (newPwd !== confirm) {
        errEl.textContent  = 'Las contraseñas no coinciden.';
        errEl.style.display = 'flex';
        return;
      }
      if (newPwd.length < 8) {
        errEl.textContent  = 'Mínimo 8 caracteres.';
        errEl.style.display = 'flex';
        return;
      }

      btn.disabled        = true;
      btnTxt.style.display = 'none';
      spinner.style.display = 'inline-block';

      try {
        var result = await supabase.auth.updateUser({ password: newPwd });
        if (result.error) throw result.error;

        okEl.textContent  = 'Contraseña actualizada. Redirigiendo…';
        okEl.style.display = 'flex';
        setTimeout(function () { window.location.hash = '#dashboard'; }, 1800);
      } catch (err) {
        errEl.textContent  = err.message || 'Error al actualizar. Intenta de nuevo.';
        errEl.style.display = 'flex';
        btn.disabled        = false;
        btnTxt.style.display = 'inline';
        spinner.style.display = 'none';
      }
    });
  })();
</script>
