<style>
  .rev {
    max-width: 640px;
    margin: 0 auto;
    padding: var(--space-md);
    padding-bottom: calc(var(--space-xl) + 72px); /* hueco para el FAB global */
  }
  @media (min-width: 600px) {
    .rev { padding: var(--space-lg); padding-bottom: calc(var(--space-xl) + 72px); }
  }
  .rev-header { margin-bottom: var(--space-lg); }
  .rev-title { font-family: var(--font-display); font-size: var(--font-size-2xl); font-weight: var(--font-weight-bold); }
  .rev-sub { color: var(--text-secondary); font-size: var(--font-size-sm); margin-top: 2px; }
  .rev-lista { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: var(--space-md); }
  /* La card ya trae bg (--bg-light-secondary), borde y radio de .card; aquí solo
     ajustamos padding compacto y recorte del swipe. */
  .rev-card { padding: 0; position: relative; overflow: hidden; }
  /* Misma superficie que .card (—bg-light) para que el rectángulo del swipe no
     se vea más claro que el resto de cards de la app. */
  .rev-swipe-surface { position: relative; z-index: 1; background: var(--bg-light);
    padding: var(--space-md); transition: transform .15s ease; touch-action: pan-y; }
  .rev-compact { display: flex; flex-direction: column; gap: 6px; cursor: pointer; }
  /* Estado confirmado: sólido y neutro — es un dato ya resuelto. */
  .rev-chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 12px;
    border-radius: var(--radius-pill, 999px); border: 1px solid var(--border-light);
    background: color-mix(in srgb, var(--text-secondary) 12%, transparent);
    color: var(--text-dark); font-size: var(--font-size-sm); cursor: pointer;
    transition: background .15s ease, border-color .15s ease; }
  .rev-chip:hover { background: color-mix(in srgb, var(--text-secondary) 20%, transparent); }

  /* Estado sugerido: es una propuesta de la app, no una decisión tuya. Se marca
     en el color de acento (oro) además del borde punteado — el dashed solo no
     se distingue en pantalla de teléfono.
     Sin tinte de fondo a propósito: color-primary sobre bg-light tintado al 10%
     da 4.08:1 en tema claro (falla AA 4.5:1); sin tinte, sobre bg-light plano,
     da 4.61:1 (pasa). Verificado con la fórmula de luminancia relativa WCAG. */
  .rev-chip--sugerida { border-style: dashed; border-color: var(--color-primary);
    color: var(--color-primary); background: transparent; }
  .rev-chip--sugerida:hover { border-color: var(--accent-hover); }

  /* Estado sin categoría: nada se decidió ni se sugirió — se lee como "falta
     esto", primo del --sugerida (mismo patrón borde punteado + texto en color,
     sin tinte de fondo) pero en warning en vez de primary para no confundirse
     con "hay una propuesta". Mismo criterio de verificación que arriba (fórmula
     de luminancia relativa WCAG, contraste = (L1+0.05)/(L2+0.05)):
     color-warning sobre bg-light plano da 5.98:1 en tema claro y 10.90:1 en
     oscuro — pasa AA (4.5:1) con margen en ambos. */
  .rev-chip--sin-cat { border-style: dashed; border-color: var(--color-warning);
    color: var(--color-warning); background: transparent; }
  .rev-chip--sin-cat:hover { border-color: var(--color-warning); }
  .rev-expandido { display: none; margin-top: var(--space-md); }
  .rev-card.is-expanded .rev-expandido { display: block; }
  .rev-swipe-hint { position: absolute; top: 0; bottom: 0; display: flex; align-items: center;
    padding: 0 var(--space-lg); font-weight: var(--font-weight-semibold); color: #fff; opacity: 0; }
  .rev-swipe-hint--confirm { left: 0; background: var(--color-success); }
  .rev-swipe-hint--descartar { right: 0; margin-left: auto; background: var(--color-danger); }
  /* Affordance: el swipe existe pero es invisible hasta que ya lo estás
     haciendo. Una sola vez por carga, la PRIMERA card se desplaza y vuelve,
     revelando un instante el borde de "Confirmar". Sin texto permanente:
     ocuparía sitio fijo para enseñar algo que se aprende una vez. */
  .rev-card.is-demo .rev-swipe-surface { animation: revDemoSurface 1.1s ease .45s 1 both; }
  .rev-card.is-demo .rev-swipe-hint--confirm { animation: revDemoHint 1.1s ease .45s 1 both; }
  @keyframes revDemoSurface {
    0%, 100% { transform: translateX(0); }
    35%, 55% { transform: translateX(14px); }
  }
  @keyframes revDemoHint {
    0%, 100% { opacity: 0; }
    35%, 55% { opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .rev-card.is-demo .rev-swipe-surface,
    .rev-card.is-demo .rev-swipe-hint--confirm { animation: none; }
  }
  /* z-index 110 > nav (100, css/layout.css) a propósito: la nav es fixed-bottom
     en móvil (mobile-first, cambia a sidebar izquierdo recién a min-width:768px)
     y sin este offset el toast quedaba SOLAPADO bajo ella — no solo tapado:
     el botón "Deshacer" recibía los clicks de un nav-link de abajo en vez de
     los suyos. Verificado con elementFromPoint, no solo con clases CSS. */
  .rev-undo-toast { position: fixed; left: 50%; bottom: calc(var(--space-lg) + env(safe-area-inset-bottom, 0));
    transform: translateX(-50%) translateY(200%); z-index: 110;
    background: var(--bg-light-secondary); color: var(--text-dark);
    border: 1px solid var(--border-light);
    padding: var(--space-sm) var(--space-md); border-radius: var(--radius-pill, 999px);
    display: flex; align-items: center; gap: var(--space-md);
    visibility: hidden;
    transition: transform .2s ease, visibility 0s linear .2s; box-shadow: var(--shadow-lg); }
  @media (max-width: 767px) {
    .rev-undo-toast { bottom: calc(60px + env(safe-area-inset-bottom, 0) + var(--space-md)); }
  }
  .rev-undo-toast.is-open { transform: translateX(-50%) translateY(0);
    visibility: visible; transition: transform .2s ease, visibility 0s; }
  .rev-undo-btn { background: none; border: none; color: var(--color-primary); font-weight: var(--font-weight-bold); cursor: pointer; }
  .rev-lote-bar { position: sticky; bottom: 0; z-index: 5;
    display: flex; gap: .5rem; align-items: center; justify-content: space-between;
    padding: .75rem 1rem; background: var(--bg-light-secondary);
    border-top: 1px solid var(--border-light); }
  .rev-lote-bar[hidden] { display: none; }
  /* Popover de categoría: único para toda la vista, fuera de las cards.
     El <select> de la fila vive dentro de .rev-expandido (display:none), así
     que el componente no puede montarse ahí — ver revisión del plan. */
  .rev-catpop {
    position: fixed; z-index: 50; width: min(20rem, calc(100vw - 2rem));
    padding: var(--space-sm);
    background: var(--bg-light-secondary);
    border: 1px solid var(--border-light);
    border-radius: 10px;
    box-shadow: 0 8px 28px rgba(0,0,0,0.35);
  }
  .rev-catpop[hidden] { display: none; }
  .rev-lote-resumen { font-size: .9rem; }
  /* Checkbox de selección: se conserva el input real (foco por teclado y
     :checked, del que depende indicesSeleccionados) y solo se le quita la
     apariencia nativa. La paleta sale de los tokens de la app.
     Selector reforzado a [data-rev-check] (no solo .rev-check): css/components.css
     trae `input[type="checkbox"] { width: auto; display: inline; }` con más
     especificidad que una sola clase — sin este refuerzo, width/display de
     acá pierden la cascada y el checkbox queda invisible (2px de ancho). */
  .rev-check[data-rev-check] {
    appearance: none; -webkit-appearance: none;
    width: 1.15rem; height: 1.15rem; flex: 0 0 auto;
    margin: 0 .5rem 0 0;
    border: 1.5px solid var(--border-light);
    border-radius: 5px;
    background: var(--bg-light-secondary);
    cursor: pointer;
    display: inline-grid; place-content: center;
    transition: background-color .12s ease, border-color .12s ease;
  }
  .rev-check::before {
    content: ''; width: .6rem; height: .6rem;
    transform: scale(0); transition: transform .12s ease;
    box-shadow: inset 1rem 1rem var(--bg-light-secondary);
    clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
  }
  .rev-check:checked { background: var(--color-primary); border-color: var(--color-primary); }
  .rev-check:checked::before { transform: scale(1); }
  .rev-check:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }
  /* Cabecera tipo recibo: banco y fecha son metadatos, no estados. Por eso el
     banco dejó de ser .badge — en el resto de la app .badge significa estado. */
  .rev-meta { display: flex; align-items: center; gap: var(--space-sm);
    font-size: var(--font-size-xs); color: var(--text-secondary); }
  .rev-banco { text-transform: uppercase; letter-spacing: 0.08em; }
  .rev-fecha-correo { color: var(--text-secondary); font-size: var(--font-size-xs); }
  .rev-meta .badge { margin-left: auto; }

  /* El ancla visual de la card. tabular-nums para que los montos de la lista
     alineen en columna, como en dashboard e historial. */
  .rev-monto { margin: 2px 0 0; text-align: right;
    font-family: var(--font-display); font-size: var(--font-size-2xl);
    font-weight: var(--font-weight-normal); color: var(--text-dark); font-variant-numeric: tabular-nums; }

  .rev-compact-foot { display: flex; align-items: center; gap: var(--space-sm); }
  .rev-comercio { font-weight: var(--font-weight-semibold); margin-bottom: 2px; overflow-wrap: anywhere; }
  .rev-original { color: var(--text-secondary); font-size: var(--font-size-xs); margin-bottom: var(--space-sm); }
  .rev-original.rev-original-warn { color: var(--color-warning); }
  .rev-raw { color: var(--text-secondary); font-size: var(--font-size-xs); margin-bottom: var(--space-sm); overflow-wrap: anywhere; }
  .rev-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-sm); margin-bottom: var(--space-sm); }
  .rev-grid .rev-field-full { grid-column: 1 / -1; }
  .rev-field label { display: block; font-size: var(--font-size-xs); color: var(--text-secondary); margin-bottom: 2px; }
  .rev-field input, .rev-field select { width: 100%; }
  .rev-acciones { display: flex; gap: var(--space-sm); margin-top: var(--space-sm); }
  .rev-acciones .btn-primary { flex: 1; min-height: 44px; }
  /* Descartar es destructivo pero de-enfatizado: ghost + tinte danger tenue en
     vez de btn-secondary (mismo peso visual que Confirmar era justo el problema
     — mis-tap fácil hacia una acción irreversible). Reusa .btn-ghost (ya en
     css/components.css) como base y solo tiñe el texto; no ocupa todo el ancho. */
  .rev-acciones .btn-ghost-danger { flex: 0 0 auto; min-height: 44px; color: var(--color-danger); }
  .rev-acciones .btn-ghost-danger:hover:not(:disabled) {
    background: color-mix(in srgb, var(--color-danger) 10%, transparent); color: var(--color-danger); }
  .rev-error { color: var(--color-danger); font-size: var(--font-size-sm); margin-top: var(--space-sm); display: none; }
  .rev-loading { display: flex; flex-direction: column; gap: var(--space-md); }
  .rev-partes { border: 1px solid var(--border-light); border-radius: var(--radius-md); padding: var(--space-sm) var(--space-md); margin-bottom: var(--space-sm); }
  .rev-partes-fila { display: flex; align-items: center; gap: var(--space-sm); margin-bottom: 6px; }
  .rev-partes-fila label { flex: 1 1 auto; font-size: var(--font-size-sm); }
  .rev-partes-fila input { width: 110px; }
  .rev-partes-restante { margin: 4px 0 0; font-weight: var(--font-weight-semibold); font-size: var(--font-size-sm); }
  .rev-partes-restante--falta { color: var(--color-warning); }
  .rev-partes-restante--sobra { color: var(--color-danger); }
  .rev-partes-restante--completo { color: var(--color-success); }
</style>

<div class="rev">
  <header class="rev-header">
    <h1 class="rev-title">Revisar movimientos</h1>
    <p class="rev-sub">Detectados en tus correos del banco. Confirma, corrige o descarta — nada se registra sin tu OK.</p>
  </header>

  <div id="revLoading" class="rev-loading" role="status" aria-label="Cargando">
    <div class="skeleton skeleton-card" style="height:180px"></div>
    <div class="skeleton skeleton-card" style="height:180px"></div>
  </div>

  <ul class="rev-lista" id="revLista" role="list" style="display:none;"></ul>
  <div class="rev-lote-bar" id="revLoteBar" hidden>
    <span class="rev-lote-resumen" id="revLoteResumen">0 seleccionadas</span>
    <span>
      <button type="button" class="btn btn-ghost" id="revLoteTodas">Marcar sugeridas</button>
      <button type="button" class="btn btn-primary" id="revLoteConfirmar" disabled>Confirmar</button>
    </span>
  </div>
  <div class="rev-catpop" id="revCatPop" hidden role="dialog" aria-label="Elegir categoría">
    <select id="revCatPopSel"></select>
  </div>
  <div id="revVacio" style="display:none;"></div>
  <p class="rev-error" id="revErrorGlobal"></p>
  <div class="rev-undo-toast" id="revUndoToast" role="status">
    <span class="rev-undo-msg"></span>
    <button type="button" class="rev-undo-btn" id="revUndoBtn">Deshacer</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  // Guard de versión: si el SW sirve JS viejo sin estos globales mientras la
  // vista es nueva, avisar en vez de morir en silencio (patrón de transaccion.html).
  var faltan = ['getIngestPendientes', 'confirmarIngestPendiente', 'descartarIngestPendiente',
                'revertirIngestPendiente', 'deleteTransaccion',
                'insertTransaccion', 'getCategorias', 'registrarGastoHogar',
                'validarPartesGastoHogar', 'confirmarLoteIngest', 'loteable',
                'resumenLote', 'notaDePendiente', 'getMapaComercioCategoria',
                'mergeLearned'].filter(function (f) {
    return typeof window[f] !== 'function';
  });

  var loadingEl = document.getElementById('revLoading');
  var listaEl = document.getElementById('revLista');
  var vacioEl = document.getElementById('revVacio');
  var errGlobal = document.getElementById('revErrorGlobal');

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
  function fmt(n) {
    return (typeof formatMonto === 'function') ? formatMonto(Number(n)) : 'S/ ' + Number(n).toFixed(2);
  }
  // js/format.js trae formatFecha()/formatFechaCorta(), pero ambas dan DD/MM —
  // acá queremos "20 jul 2026" (fecha de un correo, no de un campo de form),
  // así que no reusamos ese helper y formateamos inline con Intl.
  function fmtFechaCorreo(iso) {
    if (!iso) return '';
    try {
      return new Intl.DateTimeFormat('es-PE', { day: 'numeric', month: 'short', year: 'numeric' }).format(new Date(iso));
    } catch (e) {
      return String(iso).slice(0, 10);
    }
  }

  if (faltan.length) {
    loadingEl.style.display = 'none';
    errGlobal.textContent = 'Hay una versión nueva de la app. Ciérrala por completo y vuelve a abrirla.';
    errGlobal.style.display = 'block';
    return;
  }

  var BANCO_LABEL = { bbva: 'BBVA', bcp: 'BCP', yape: 'Yape' };
  var _cats = { gasto: null, ingreso: null };   // cache de categorías por tipo
  var _learned = {};

  async function catsPara(tipo) {
    var t = (tipo === 'ingreso') ? 'ingreso' : 'gasto'; // ahorro no lleva categoría
    if (!_cats[t]) {
      var cats = await getCategorias(t);
      _cats[t] = (cats || []).map(function (c) { return { id: c.id, nombre: c.nombre }; });
    }
    return _cats[t];
  }

  // Sugerencia de categoría: mismo motor que el quick-add (autocat.js).
  // El Worker no la infiere a propósito — el mapa aprendido vive en IndexedDB.
  async function sugerirCategoria(texto, tipo) {
    if (!texto || typeof matchCategoria !== 'function' || typeof tokenize !== 'function') return null;
    var cats = await catsPara(tipo);
    var ctx = { learned: _learned, categorias: cats, seed: window.NESTRA_SEED || {} };
    return matchCategoria(tokenize(texto), ctx);
  }

  function opcionesCategoria(cats, seleccionada) {
    var html = '<option value="">Sin categoría</option>';
    cats.forEach(function (c) {
      html += '<option value="' + esc(c.id) + '"' + (c.id === seleccionada ? ' selected' : '') + '>' + esc(c.nombre) + '</option>';
    });
    return html;
  }

  function renderVacio() {
    listaEl.style.display = 'none';
    vacioEl.style.display = 'block';
    vacioEl.innerHTML = (typeof renderEmptyState === 'function')
      ? renderEmptyState({
          icon: 'inbox',
          title: 'Nada por revisar',
          desc: 'Cuando llegue un correo de tu banco con un consumo o transferencia, aparecerá aquí para que lo confirmes.',
        })
      : '<p>Nada por revisar.</p>';
  }

  var hayHogar = (typeof tieneHogar === 'function') && tieneHogar();

  async function cardHTML(p, i) {
    var manual = p.estado === 'revisar-manual';
    var tipo = p.tipo || 'gasto';
    var texto = p.comercio || p.contraparte || '';
    var sugerida = manual ? null : await sugerirCategoria(texto, tipo);
    var cats = await catsPara(tipo);

    var original = '';
    if (p.moneda_original) {
      original = p.tasa_cambio
        ? '<p class="rev-original">' + esc(p.moneda_original) + ' ' + esc(p.monto_original) + ' @ ' + esc(p.tasa_cambio) + ' — conversión aproximada, corrige si difiere del cargo real</p>'
        : '<p class="rev-original rev-original-warn">' + esc(p.moneda_original) + ' ' + esc(p.monto_original) + ' — la conversión falló: el monto está en ' + esc(p.moneda_original) + ', corrígelo a tu moneda</p>';
    }

    var sinCat = !sugerida;
    var checkHTML = manual ? '' :
      '<input type="checkbox" class="rev-check" data-rev-check="' + i + '" ' +
      'aria-label="Seleccionar para confirmar en lote">';

    return '<li class="card rev-card" id="revCard' + i + '" data-idx="' + i + '">' +
      '<div class="rev-swipe-hint rev-swipe-hint--confirm">Confirmar</div>' +
      '<div class="rev-swipe-hint rev-swipe-hint--descartar">Descartar</div>' +
      '<div class="rev-swipe-surface">' +
        '<div class="rev-compact" data-rev-expandir="' + i + '" role="button" tabindex="0" aria-expanded="false">' +
          '<div class="rev-meta">' +
            checkHTML +
            '<span class="rev-banco">' + esc(BANCO_LABEL[p.banco] || p.banco) + '</span>' +
            '<span class="rev-fecha-correo">' + esc(fmtFechaCorreo(p.created_at)) + '</span>' +
            (manual ? '<span class="badge badge-warning">Formato no reconocido</span>' : '') +
          '</div>' +
          (texto ? '<p class="rev-comercio">' + esc(texto) + '</p>' : '') +
          '<p class="rev-monto">' + (p.monto != null ? fmt(p.monto) : '—') + '</p>' +
          '<div class="rev-compact-foot">' +
            '<button type="button" class="rev-chip' + (sugerida ? ' rev-chip--sugerida' : '') + (sinCat ? ' rev-chip--sin-cat' : '') + '" data-rev-chip="' + i + '" id="revChip' + i + '">' +
              esc(nombreCat(cats, sugerida) || 'Sin categoría') +
            '</button>' +
          '</div>' +
        '</div>' +
        '<div class="rev-expandido">' +
          original +
          (manual && p.raw_subject ? '<p class="rev-raw">Asunto: ' + esc(p.raw_subject) + '</p>' : '') +
          '<div class="rev-grid">' +
            '<div class="rev-field"><label for="revMonto' + i + '">Monto</label>' +
              '<input type="number" inputmode="decimal" step="0.01" min="0.01" id="revMonto' + i + '" value="' + (p.monto != null ? esc(p.monto) : '') + '"></div>' +
            '<div class="rev-field"><label for="revFecha' + i + '">Fecha</label>' +
              '<input type="date" id="revFecha' + i + '" value="' + esc(p.fecha || '') + '"></div>' +
            '<div class="rev-field"><label for="revTipo' + i + '">Tipo</label>' +
              '<select id="revTipo' + i + '">' +
                '<option value="gasto"' + (tipo === 'gasto' ? ' selected' : '') + '>Gasto</option>' +
                '<option value="ingreso"' + (tipo === 'ingreso' ? ' selected' : '') + '>Ingreso</option>' +
                '<option value="ahorro"' + (tipo === 'ahorro' ? ' selected' : '') + '>Ahorro</option>' +
              '</select></div>' +
            '<div class="rev-field"><label for="revAmbito' + i + '">Ámbito</label>' +
              '<select id="revAmbito' + i + '">' +
                '<option value="personal" selected>Personal</option>' +
                (hayHogar ? '<option value="hogar">Hogar</option>' : '') +
              '</select></div>' +
            '<div class="rev-field rev-field-full" id="revCatWrap' + i + '"><label for="revCat' + i + '">Categoría</label>' +
              '<select id="revCat' + i + '">' + opcionesCategoria(cats, sugerida) + '</select></div>' +
            '<div class="rev-field rev-field-full"><label for="revNota' + i + '">Nota <span class="label-opcional">(opcional)</span></label>' +
              '<textarea id="revNota' + i + '" rows="2" placeholder="Descripción libre..."></textarea></div>' +
          '</div>' +
          (hayHogar ? (
          '<div id="revPartesGroup' + i + '" class="rev-partes" style="display:none">' +
            '<p class="rev-original" style="margin:0 0 6px">¿Quién puso cuánto?</p>' +
            '<div id="revPartesFilas' + i + '"></div>' +
            '<p id="revPartesRestante' + i + '" class="rev-partes-restante"></p>' +
            '<p class="rev-error" id="revPartesErr' + i + '"></p>' +
          '</div>') : '') +
          '<div class="rev-acciones">' +
            '<button type="button" class="btn btn-ghost-danger" data-rev-descartar="' + i + '">Descartar</button>' +
            '<button type="button" class="btn btn-primary" data-rev-confirmar="' + i + '">Confirmar</button>' +
          '</div>' +
          '<p class="rev-error" id="revErr' + i + '"></p>' +
        '</div>' +
      '</div>' +
    '</li>';
  }

  function nombreCat(cats, id) {
    if (!id) return null;
    var c = (cats || []).find(function (x) { return x.id === id; });
    return c ? c.nombre : null;
  }

  // Refresca texto + clases del chip de categoría a partir del <select> real —
  // la única fuente de verdad ahora que no hay bottom-sheet. sugerida=true solo
  // cuando el llamador sabe que el valor actual vino de la sugerencia
  // automática (no de una elección manual); si no se pasa, se infiere "sin
  // categoría" a partir de si el select tiene algo elegido.
  function refrescarChip(i, sugerida) {
    var sel = document.getElementById('revCat' + i);
    var chip = document.getElementById('revChip' + i);
    if (!chip) return;
    var seleccionada = sel && sel.selectedIndex >= 0 ? sel.options[sel.selectedIndex].textContent : null;
    var sinCat = !(sel && sel.value);
    chip.textContent = (sel && sel.value) ? seleccionada : 'Sin categoría';
    chip.classList.toggle('rev-chip--sugerida', !!sugerida);
    chip.classList.toggle('rev-chip--sin-cat', sinCat);
  }

  var _filas = [];

  function mostrarError(i, msg) {
    var el = document.getElementById('revErr' + i);
    if (el) { el.textContent = msg; el.style.display = 'block'; }
  }

  async function onTipoChange(i) {
    var tipo = document.getElementById('revTipo' + i).value;
    var wrap = document.getElementById('revCatWrap' + i);
    if (tipo === 'ahorro') { wrap.style.display = 'none'; onAmbitoChange(i); return; }
    wrap.style.display = '';
    var p = _filas[i];
    var texto = p.comercio || p.contraparte || '';
    var sugerida = await sugerirCategoria(texto, tipo);
    document.getElementById('revCat' + i).innerHTML = opcionesCategoria(await catsPara(tipo), sugerida);
    refrescarChip(i, !!sugerida);
    onAmbitoChange(i);
  }

  // ── Partes del gasto compartido al aprobar (mismo patrón que #transaccion) ──
  function miembrosHogar() {
    var st = window.hogarState || {};
    return (st.miembros || []).map(function (m) {
      return {
        user_id: m.user_id,
        nombre: (window.currentUser && m.user_id === window.currentUser.id) ? 'Tú' : 'Pareja',
      };
    });
  }
  function renderPartesFilas(i) {
    var miembros = miembrosHogar();
    var filasEl = document.getElementById('revPartesFilas' + i);
    if (!filasEl || miembros.length < 2) { if (filasEl) filasEl.innerHTML = ''; return; }
    var total = parseFloat(document.getElementById('revMonto' + i).value) || 0;
    var uid = window.currentUser && window.currentUser.id;
    filasEl.innerHTML = miembros.map(function (m) {
      var prefill = m.user_id === uid ? total : 0;
      return '<div class="rev-partes-fila" data-uid="' + esc(m.user_id) + '">' +
        '<label>' + esc(m.nombre) + '</label>' +
        '<input type="number" inputmode="decimal" min="0" step="0.01" class="rev-partes-monto" value="' + prefill + '">' +
        '</div>';
    }).join('');
  }
  function leerPartes(i) {
    var filasEl = document.getElementById('revPartesFilas' + i);
    if (!filasEl) return [];
    return Array.prototype.map.call(filasEl.querySelectorAll('.rev-partes-fila'), function (row) {
      return {
        user_id: row.getAttribute('data-uid'),
        monto: parseFloat(row.querySelector('.rev-partes-monto').value) || 0,
      };
    });
  }
  // Indicador en vivo de cuánto falta (o sobra) por asignar del total.
  function actualizarRestante(i) {
    var el = document.getElementById('revPartesRestante' + i);
    var grupo = document.getElementById('revPartesGroup' + i);
    if (!el || !grupo) return;
    if (grupo.style.display === 'none') { el.textContent = ''; return; }
    var total = parseFloat(document.getElementById('revMonto' + i).value) || 0;
    var restante = restanteGastoHogar(total, leerPartes(i));
    el.classList.remove('rev-partes-restante--falta', 'rev-partes-restante--sobra', 'rev-partes-restante--completo');
    if (Math.abs(restante) < 0.005) {
      el.textContent = 'Repartido completo.';
      el.classList.add('rev-partes-restante--completo');
    } else if (restante > 0) {
      el.textContent = 'Faltan asignar ' + fmt(restante) + '.';
      el.classList.add('rev-partes-restante--falta');
    } else {
      el.textContent = 'Sobran ' + fmt(-restante) + ' asignados de más.';
      el.classList.add('rev-partes-restante--sobra');
    }
  }
  // El hogar solo registra gasto y ahorro: un ingreso es siempre personal
  // (CHECK transacciones_hogar_sin_ingreso). Sin este gate se podía elegir
  // Ingreso+Hogar y el confirmar moría contra la base con "No se pudo guardar.
  // Reintenta." para siempre — el pendiente nunca se iba de la cola. Es
  // alcanzable de verdad: el parser de BCP produce tipo=ingreso ("Recibiste un
  // yapeo"). El ámbito gana, igual que en el form.
  // Devuelve true si tuvo que corregir el tipo, para que el llamador recargue
  // las categorías: quedarse con las de 'ingreso' bajo un tipo 'gasto' violaría
  // el CHECK transacciones_categoria_por_tipo — cambiar un bug por otro.
  function gateTipoPorAmbito(i) {
    var selTipo = document.getElementById('revTipo' + i);
    var selAmbito = document.getElementById('revAmbito' + i);
    if (!selTipo || !selAmbito) return false;
    var esHogar = selAmbito.value === 'hogar';
    var optIngreso = selTipo.querySelector('option[value="ingreso"]');
    if (optIngreso) { optIngreso.disabled = esHogar; optIngreso.hidden = esHogar; }
    if (esHogar && selTipo.value === 'ingreso') { selTipo.value = 'gasto'; return true; }
    return false;
  }

  function onAmbitoChange(i) {
    // Si el gate corrigió el tipo, onTipoChange recarga las categorías y vuelve
    // a entrar acá. No recursa: en la segunda pasada el tipo ya es 'gasto', el
    // gate devuelve false y sigue de largo.
    if (gateTipoPorAmbito(i)) { onTipoChange(i); return; }
    var tipo = document.getElementById('revTipo' + i).value;
    var ambito = document.getElementById('revAmbito' + i).value;
    var grupo = document.getElementById('revPartesGroup' + i);
    if (!grupo) return;
    var mostrar = tipo === 'gasto' && ambito === 'hogar' && miembrosHogar().length >= 2;
    grupo.style.display = mostrar ? 'block' : 'none';
    // Solo prefillea en el primer render: si el usuario ya tecleó un split a
    // mano, un cambio de monto/tipo no debe pisarlo (mismo bug que se corrigió
    // en #transaccion — ver Task 11 de la Fase 6.3).
    var filasEl = document.getElementById('revPartesFilas' + i);
    if (mostrar && filasEl && !filasEl.children.length) renderPartesFilas(i);
    actualizarRestante(i);
  }

  async function confirmar(i, btn) {
    var errEl = document.getElementById('revErr' + i);
    if (errEl) errEl.style.display = 'none';
    var partesErrEl = document.getElementById('revPartesErr' + i);
    if (partesErrEl) { partesErrEl.style.display = 'none'; partesErrEl.textContent = ''; }
    var p = _filas[i];
    var monto = parseFloat(document.getElementById('revMonto' + i).value);
    var fecha = document.getElementById('revFecha' + i).value;
    var tipo = document.getElementById('revTipo' + i).value;
    var ambito = document.getElementById('revAmbito' + i).value;
    var catId = document.getElementById('revCat' + i).value || null;

    if (!(monto > 0)) { mostrarError(i, 'Ingresa un monto mayor a 0.'); return; }
    if (!fecha) { mostrarError(i, 'Ingresa la fecha.'); return; }
    if (tipo !== 'ahorro' && !catId) { mostrarError(i, 'Elige una categoría.'); return; }

    // Gasto compartido con partes: si el bloque de partes está visible
    // (ambito=hogar, tipo=gasto, hay 2 miembros), valida y decide la vía.
    var grupo = document.getElementById('revPartesGroup' + i);
    var conPartes = tipo === 'gasto' && ambito === 'hogar' && grupo && grupo.style.display !== 'none';
    var partes = null;
    if (conPartes) {
      partes = leerPartes(i).filter(function (x) { return x.monto > 0; });
      var check = validarPartesGastoHogar(monto, partes);
      if (!check.ok) {
        if (partesErrEl) { partesErrEl.textContent = check.error; partesErrEl.style.display = 'block'; }
        return;
      }
    }

    var base = notaDePendiente(p, BANCO_LABEL);
    var userNotaEl = document.getElementById('revNota' + i);
    var userNota = userNotaEl ? userNotaEl.value.trim() : '';
    var nota = userNota ? base + ' — ' + userNota : base;
    btn.disabled = true;
    try {
      var txIds;
      if (conPartes && partes.length > 1) {
        // 2+ pagadores → registrar_gasto_hogar (RPC); todas las filas creadas se
        // guardan para poder revertirlas si el usuario deshace.
        var filas = await registrarGastoHogar(fecha, catId, nota, partes);
        txIds = (filas || []).filter(Boolean).map(function (f) { return f.id; });
      } else {
        // Un solo pagador (o ambito personal/ahorro) → transacción normal,
        // igual que antes. insertTransaccion ya aprende comercio→categoría
        // (autocatLearnTokens sobre la nota) — la próxima sugerencia mejora sola.
        var tx = await insertTransaccion({
          tipo: tipo, ambito: ambito,
          categoria_id: tipo === 'ahorro' ? null : catId,
          monto: monto, fecha: fecha,
          nota: nota,
        });
        txIds = [tx.id];
      }
      await confirmarIngestPendiente(p.id, (txIds.length === 1 ? txIds[0] : null), { tipo: tipo, monto: monto, fecha: fecha });
      quitarCardsConUndo([i], {
        accion: 'confirmar',
        pendientes: [{ pendienteId: p.id, estadoOriginal: p.estado }],
        txIds: txIds,
      });
    } catch (e) {
      console.error('confirmar pendiente falló:', e);
      btn.disabled = false;
      mostrarError(i, 'No se pudo guardar. Reintenta.');
    }
  }

  async function descartar(i, btn) {
    btn.disabled = true;
    try {
      await descartarIngestPendiente(_filas[i].id);
      quitarCardsConUndo([i], {
        accion: 'descartar',
        pendientes: [{ pendienteId: _filas[i].id, estadoOriginal: _filas[i].estado }],
        txIds: [],
      });
    } catch (e) {
      console.error('descartar pendiente falló:', e);
      btn.disabled = false;
      mostrarError(i, 'No se pudo descartar. Reintenta.');
    }
  }

  function quitarCard(i) {
    var card = document.getElementById('revCard' + i);
    if (card) card.remove();
    _filas[i] = null;
    if (!_filas.some(Boolean)) renderVacio();
    if (typeof actualizarIngestBadge === 'function') actualizarIngestBadge();
  }

  // ── Modo lote: seleccionar varias filas y confirmarlas de una pasada ──
  // Categoría resuelta de la fila i: la que el usuario dejó en el select
  // (que ya viene prefilleado con la sugerencia de autocat).
  function catDeFila(i) {
    var el = document.getElementById('revCat' + i);
    return el ? (el.value || null) : null;
  }

  var _catPopIdx = null;

  // abrirBuscadorCategoria(i, anchorEl) — popover de categorías para la fila i.
  // Una sola instancia de searchableSelect para toda la vista: el <select> de
  // la card no sirve como anfitrión porque vive en un contenedor oculto.
  async function abrirBuscadorCategoria(i, anchorEl) {
    var pop = document.getElementById('revCatPop');
    var sel = document.getElementById('revCatPopSel');
    var fila = _filas[i];
    if (!pop || !sel || !fila) return;
    _catPopIdx = i;

    var tipo = document.getElementById('revTipo' + i);
    var cats = await catsPara(tipo ? tipo.value : (fila.tipo || 'gasto'));
    sel.innerHTML = opcionesCategoria(cats, catDeFila(i));

    if (typeof searchableSelect === 'function') {
      searchableSelect(sel, { placeholder: 'Buscar categoría…' });  // idempotente
      if (sel._ssSync) sel._ssSync();
    }

    // Posicionar bajo el chip, sin salirse de la pantalla.
    var r = anchorEl.getBoundingClientRect();
    pop.hidden = false;
    var ancho = pop.offsetWidth;
    var left = Math.min(Math.max(8, r.left), window.innerWidth - ancho - 8);
    pop.style.left = left + 'px';
    pop.style.top = Math.min(r.bottom + 6, window.innerHeight - 80) + 'px';

    var input = pop.querySelector('.ss-input');
    if (input) input.focus();   // el 'focus' del componente abre la lista
  }

  function cerrarBuscadorCategoria() {
    var pop = document.getElementById('revCatPop');
    if (pop) pop.hidden = true;
    _catPopIdx = null;
  }

  function indicesSeleccionados() {
    var out = [];
    Array.prototype.forEach.call(
      document.querySelectorAll('[data-rev-check]:checked'),
      function (el) { out.push(Number(el.getAttribute('data-rev-check'))); });
    return out;
  }

  // La barra se muestra si hay al menos una card seleccionable. Sin esto el
  // botón "Marcar sugeridas" quedaría dentro de un contenedor oculto y sería
  // inalcanzable: el usuario no tendría cómo hacer la primera selección.
  function pintarBarraLote() {
    var bar = document.getElementById('revLoteBar');
    if (!bar) return;
    if (!document.querySelector('[data-rev-check]')) { bar.hidden = true; return; }
    var idx = indicesSeleccionados();
    var filas = idx.map(function (i) { return _filas[i]; }).filter(Boolean);
    var r = resumenLote(filas);
    document.getElementById('revLoteResumen').textContent =
      r.n === 0 ? '0 seleccionadas' : (r.n + ' seleccionadas · ' + fmt(r.total));
    document.getElementById('revLoteConfirmar').disabled = r.n === 0;
    bar.hidden = false;
  }

  // "Marcar sugeridas": marca todas las filas que loteable() acepta con la
  // categoría que hoy tiene su select.
  function marcarSugeridas() {
    Array.prototype.forEach.call(
      document.querySelectorAll('[data-rev-check]'),
      function (el) {
        var i = Number(el.getAttribute('data-rev-check'));
        el.checked = loteable(_filas[i], catDeFila(i));
      });
    pintarBarraLote();
  }

  async function confirmarLote(btn) {
    var idx = indicesSeleccionados();
    var items = [];
    idx.forEach(function (i) {
      var f = _filas[i];
      var cat = catDeFila(i);
      if (!loteable(f, cat)) return;   // defensa: no confiar solo en el checkbox
      items.push({ fila: f, categoria_id: cat, nota: notaDePendiente(f, BANCO_LABEL) });
    });
    if (!items.length) return;
    btn.disabled = true;
    try {
      var res = await confirmarLoteIngest(items);
      var okIds = {}, txIds = [], pendientes = [], indices = [];
      res.forEach(function (r) {
        if (!r.ok) return;
        okIds[r.id] = true;
        if (r.transaccionId) txIds.push(r.transaccionId);
      });
      for (var i = 0; i < _filas.length; i++) {
        if (_filas[i] && okIds[_filas[i].id]) {
          indices.push(i);
          pendientes.push({ pendienteId: _filas[i].id, estadoOriginal: _filas[i].estado });
        }
      }
      var fallidas = res.length - indices.length;
      if (indices.length) {
        quitarCardsConUndo(indices, { accion: 'confirmar', pendientes: pendientes, txIds: txIds });
      }
      pintarBarraLote();
      if (fallidas) mostrarToastLote(indices.length, fallidas);
    } finally {
      btn.disabled = false;
    }
  }

  function mostrarToastLote(ok, fallidas) {
    var el = document.getElementById('revLoteResumen');
    if (!el) return;
    el.textContent = fallidas
      ? (ok + ' confirmadas · ' + fallidas + ' fallaron, reintenta')
      : (ok + ' confirmadas');
  }

  // ── Undo: cada card se oculta (no se borra) y entra a una cola LIFO; cada
  // item tiene su propio timer de 7s independiente. El toast es una sola
  // superficie visual pero ya no representa un solo item — representa la cola.
  var _undoQueue = []; // [{ is: [i...], ctx, timerId }], más reciente al final

  // quitarCardsConUndo(indices, ctx) — oculta N cards y encola UN solo item de
  // undo para todas. El camino de a una pasa un array de largo 1: así hay una
  // sola ruta de código y el lote no puede divergir del gesto individual.
  // ctx: { accion, pendientes: [{ pendienteId, estadoOriginal }], txIds: [] }
  function quitarCardsConUndo(indices, ctx) {
    indices.forEach(function (i) {
      var card = document.getElementById('revCard' + i);
      if (card) card.style.display = 'none';
    });
    if (typeof actualizarIngestBadge === 'function') actualizarIngestBadge();
    var item = { is: indices.slice(), ctx: ctx, timerId: null };
    item.timerId = setTimeout(function () { finalizarItem(item); }, 7000); // 7s: leer + ubicar + tocar en móvil
    _undoQueue.push(item);
    renderToast();
  }
  // Redibuja el toast según cuántos items quedan en la cola. 1 item: mismo
  // copy que antes ("Confirmado"/"Descartado"), o el conteo si ese item es un
  // lote de N>1; 2+ items en cola: conteo agregado de items (no de filas).
  function renderToast() {
    var t = document.getElementById('revUndoToast');
    var n = _undoQueue.length;
    if (n === 0) { t.classList.remove('is-open'); return; }
    var msg = t.querySelector('.rev-undo-msg');
    if (n === 1) {
      var c = _undoQueue[0];
      var cuantos = c.is.length;
      msg.textContent = cuantos > 1
        ? (cuantos + ' confirmadas')
        : (c.ctx.accion === 'confirmar' ? 'Confirmado' : 'Descartado');
    } else {
      msg.textContent = n + ' movimientos revisados';
    }
    t.classList.add('is-open');
  }
  // Se dispara cuando el timer PROPIO de `item` vence. No toca los demás items
  // de la cola — cada uno vive y muere en su propio momento.
  function finalizarItem(item) {
    var idx = _undoQueue.indexOf(item);
    if (idx !== -1) _undoQueue.splice(idx, 1);
    item.is.forEach(function (i) {
      var card = document.getElementById('revCard' + i);
      if (card) card.remove();
      _filas[i] = null;
    });
    if (!_filas.some(Boolean)) renderVacio();
    pintarBarraLote();
    renderToast();
    if (typeof actualizarIngestBadge === 'function') actualizarIngestBadge();
  }
  // "Deshacer" siempre opera sobre el ÚLTIMO item en entrar (LIFO): es el que
  // el usuario acaba de tocar, no necesariamente el que está por vencer.
  async function deshacer() {
    var item = _undoQueue.pop();
    if (!item) return;
    clearTimeout(item.timerId);
    var ctx = item.ctx;
    try {
      if (ctx.accion === 'confirmar') {
        for (var k = 0; k < (ctx.txIds || []).length; k++) {
          if (ctx.txIds[k]) await deleteTransaccion(ctx.txIds[k]);
        }
      }
      for (var j = 0; j < ctx.pendientes.length; j++) {
        await revertirIngestPendiente(ctx.pendientes[j].pendienteId, ctx.pendientes[j].estadoOriginal);
      }
      item.is.forEach(function (i) {
        var card = document.getElementById('revCard' + i);
        if (card) card.style.display = '';
      });
      if (typeof actualizarIngestBadge === 'function') actualizarIngestBadge();
      pintarBarraLote();
      renderToast(); // sigue abierto con el conteo nuevo, o cierra si quedó en 0
    } catch (e) {
      // El item ya salió de la cola (pop) y su timer ya está cancelado, así que
      // no se autofinalizará. A propósito NO lo regresamos a la cola ni
      // restauramos la card: es el mismo comportamiento simple de antes (mostrar
      // el error y que el usuario revise #historial), solo que ahora un fallo
      // en un item no afecta a los demás items que sigan en la cola.
      console.error('deshacer falló:', e);
      errGlobal.textContent = 'No se pudo deshacer. Revisa #historial.';
      errGlobal.style.display = 'block';
    }
  }

  // ── Swipe: confirmar (derecha) / descartar (izquierda) con gate ──
  // Gate de completitud: swipe-confirmar solo dispara si la fila ya tiene todo
  // lo que confirmar() exige; si falta algo, abre la card y enfoca el campo.
  function pendienteCompleto(i) {
    var monto = parseFloat(document.getElementById('revMonto' + i).value);
    var fecha = document.getElementById('revFecha' + i).value;
    var tipo = document.getElementById('revTipo' + i).value;
    var catId = document.getElementById('revCat' + i).value;
    if (!(monto > 0) || !fecha || !tipo) return false;
    if (tipo !== 'ahorro' && !catId) return false;
    // Conversión de divisa fallida: el monto quedó en la moneda original, no en
    // PEN — exige que el usuario lo corrija antes de confirmar (nunca one-swipe).
    var p = _filas[i];
    if (p && p.moneda_original && p.tasa_cambio == null) return false;
    var grupo = document.getElementById('revPartesGroup' + i);
    if (grupo && grupo.style.display !== 'none') {
      var partes = leerPartes(i).filter(function (x) { return x.monto > 0; });
      if (!validarPartesGastoHogar(monto, partes).ok) return false;
    }
    return true;
  }

  var _sw = null;
  function swipeStart(ev) {
    if (ev.target.closest('input, select, textarea, button, .rev-expandido')) return;
    var card = ev.target.closest('.rev-card');
    if (!card || card.style.display === 'none') return;
    // Un gesto real siempre gana sobre la demo.
    card.classList.remove('is-demo');
    var surface = card.querySelector('.rev-swipe-surface');
    _sw = { i: Number(card.getAttribute('data-idx')), startX: ev.clientX, dx: 0, surface: surface, card: card };
    if (surface.setPointerCapture) surface.setPointerCapture(ev.pointerId);
  }
  function swipeMove(ev) {
    if (!_sw) return;
    _sw.dx = ev.clientX - _sw.startX;
    _sw.surface.style.transform = 'translateX(' + _sw.dx + 'px)';
    var w = _sw.card.offsetWidth || 320;
    var conf = _sw.card.querySelector('.rev-swipe-hint--confirm');
    var desc = _sw.card.querySelector('.rev-swipe-hint--descartar');
    if (conf) conf.style.opacity = _sw.dx > 0 ? Math.min(1, _sw.dx / (w * 0.4)) : 0;
    if (desc) desc.style.opacity = _sw.dx < 0 ? Math.min(1, -_sw.dx / (w * 0.4)) : 0;
  }
  function swipeEnd() {
    if (!_sw) return;
    var s = _sw; _sw = null;
    var w = s.card.offsetWidth || 320;
    var umbral = w * 0.4;
    s.surface.style.transform = '';
    Array.prototype.forEach.call(s.card.querySelectorAll('.rev-swipe-hint'), function (h) { h.style.opacity = 0; });
    if (s.dx > umbral) {
      if (pendienteCompleto(s.i)) { confirmar(s.i, s.card.querySelector('[data-rev-confirmar]')); }
      else { s.card.classList.add('is-expanded'); enfocarFaltante(s.i); }
    } else if (s.dx < -umbral) {
      descartar(s.i, s.card.querySelector('[data-rev-descartar]'));
    }
  }
  function enfocarFaltante(i) {
    var monto = document.getElementById('revMonto' + i);
    if (!(parseFloat(monto.value) > 0)) { monto.focus(); return; }
    var fecha = document.getElementById('revFecha' + i);
    if (!fecha.value) { fecha.focus(); return; }
    var cat = document.getElementById('revCat' + i);
    if (document.getElementById('revTipo' + i).value !== 'ahorro' && !cat.value) { cat.focus(); return; }
    var grupo = document.getElementById('revPartesGroup' + i);
    if (grupo && grupo.style.display !== 'none') { var f = grupo.querySelector('.rev-partes-monto'); if (f) f.focus(); }
  }

  async function init() {
    try {
      if (typeof autocatLearned === 'function') _learned = await autocatLearned();
      // El mapa local es por navegador y por origen: en un dispositivo nuevo
      // está vacío. Se completa con lo reconstruido desde el servidor, con
      // peso 1 para que NUNCA le gane a lo aprendido acá (autocatLearnTokens
      // acumula de a 1 por confirmación, así que un comercio confirmado dos
      // veces en este navegador pesa más que el eco del servidor).
      if (typeof getMapaComercioCategoria === 'function' && typeof mergeLearned === 'function') {
        try {
          var delServidor = await getMapaComercioCategoria();
          _learned = mergeLearned(_learned, delServidor.map(function (e) {
            return { texto: e.texto, categoria_id: e.categoria_id, peso: 1 };
          }));
        } catch (e) { console.error('mapa de servidor:', e); }
      }
      _filas = await getIngestPendientes();
      loadingEl.style.display = 'none';
      if (!_filas.length) { renderVacio(); return; }

      var html = '';
      for (var i = 0; i < _filas.length; i++) html += await cardHTML(_filas[i], i);
      listaEl.innerHTML = html;
      listaEl.style.display = '';
      pintarBarraLote();

      // Demo de swipe: solo en la primera card elegible, y solo en esta carga
      // de la vista. Una fila 'revisar-manual' no puede completarse con un
      // solo gesto (pendienteCompleto la bloquea por falta de categoría/fecha),
      // así que enseñar el swipe ahí sería engañoso — se busca la primera
      // fila de _filas que no sea de ese estado. Si ninguna califica, no se
      // muestra demo en nadie (no se fuerza sobre una manual).
      var idxDemo = -1;
      for (var di = 0; di < _filas.length; di++) {
        if (_filas[di] && _filas[di].estado !== 'revisar-manual') { idxDemo = di; break; }
      }
      var primera = idxDemo >= 0 ? document.getElementById('revCard' + idxDemo) : null;
      if (primera) {
        primera.classList.add('is-demo');
        primera.addEventListener('animationend', function quitar() {
          primera.classList.remove('is-demo');
          primera.removeEventListener('animationend', quitar);
        });
      }

      listaEl.addEventListener('click', function (ev) {
        var chk = ev.target.closest('[data-rev-check]');
        if (chk) {
          // Marcar no debe expandir la card: .rev-meta vive dentro del
          // [data-rev-expandir], así que hay que cortar acá.
          ev.stopPropagation();
          pintarBarraLote();
          return;
        }
        var chipBtn = ev.target.closest('[data-rev-chip]');
        if (chipBtn) {
          ev.stopPropagation();
          abrirBuscadorCategoria(Number(chipBtn.getAttribute('data-rev-chip')), chipBtn);
          return;
        }
        var expandir = ev.target.closest('[data-rev-expandir]');
        if (expandir) {
          var c = expandir.closest('.rev-card');
          var abierta = c.classList.toggle('is-expanded');
          expandir.setAttribute('aria-expanded', abierta ? 'true' : 'false');
          return;
        }
        var b = ev.target.closest('[data-rev-confirmar]');
        if (b) { confirmar(Number(b.getAttribute('data-rev-confirmar')), b); return; }
        var d = ev.target.closest('[data-rev-descartar]');
        if (d) { descartar(Number(d.getAttribute('data-rev-descartar')), d); }
      });
      // role="button" no trae activación por teclado: hay que darla a mano.
      listaEl.addEventListener('keydown', function (ev) {
        if (ev.key !== 'Enter' && ev.key !== ' ') return;
        var expandir = ev.target.closest('[data-rev-expandir]');
        if (!expandir || ev.target.closest('[data-rev-chip]')) return;
        ev.preventDefault();   // Espacio scrollearía la página
        expandir.click();
      });
      document.getElementById('revUndoBtn').addEventListener('click', deshacer);
      // La barra de lote NO está dentro de #revLista: sus clicks nunca llegarían
      // al delegado de la lista, así que necesita listeners propios.
      document.getElementById('revLoteTodas').addEventListener('click', marcarSugeridas);
      document.getElementById('revLoteConfirmar').addEventListener('click', function (ev) {
        confirmarLote(ev.currentTarget);
      });
      // Al elegir en el popover, el valor se escribe en el select de la fila y
      // se dispara su 'change': así el repintado del chip y el estado
      // --sugerida siguen pasando por el mismo camino de siempre.
      document.getElementById('revCatPopSel').addEventListener('change', function (ev) {
        if (_catPopIdx == null) return;
        var destino = document.getElementById('revCat' + _catPopIdx);
        if (destino) {
          destino.value = ev.target.value;
          destino.dispatchEvent(new Event('change', { bubbles: true }));
        }
        cerrarBuscadorCategoria();
        pintarBarraLote();
      });
      // Cerrar al tocar fuera o con Escape. El componente ya cierra su propia
      // lista al clic exterior; esto cierra además el popover que la contiene.
      // router.js re-ejecuta el <script> de la vista en cada navegación
      // (executeScripts). Sin esta guarda, cada visita a #revisar deja dos
      // listeners más colgados de document, y cada closure retiene el _filas
      // de esa visita (~92 filas con la cola real).
      if (!window._revCatPopBound) {
        window._revCatPopBound = true;
        document.addEventListener('click', function (ev) {
          var pop = document.getElementById('revCatPop');
          if (!pop || pop.hidden) return;
          if (pop.contains(ev.target) || ev.target.closest('[data-rev-chip]')) return;
          cerrarBuscadorCategoria();
        });
        document.addEventListener('keydown', function (ev) {
          if (ev.key === 'Escape') cerrarBuscadorCategoria();
        });
      }

      listaEl.addEventListener('pointerdown', swipeStart);
      listaEl.addEventListener('pointermove', swipeMove);
      listaEl.addEventListener('pointerup', swipeEnd);
      listaEl.addEventListener('pointercancel', function () { if (_sw) { _sw.surface.style.transform = ''; _sw = null; } });
      listaEl.addEventListener('change', function (ev) {
        var mTipo = ev.target.id && ev.target.id.match(/^revTipo(\d+)$/);
        if (mTipo) { onTipoChange(Number(mTipo[1])); return; }
        var mAmbito = ev.target.id && ev.target.id.match(/^revAmbito(\d+)$/);
        if (mAmbito) { onAmbitoChange(Number(mAmbito[1])); return; }
        // El usuario eligió categoría a mano en el select — ya no viene de la
        // sugerencia automática, así que el chip pierde el estado --sugerida.
        var mCat = ev.target.id && ev.target.id.match(/^revCat(\d+)$/);
        if (mCat) refrescarChip(Number(mCat[1]), false);
      });
      listaEl.addEventListener('input', function (ev) {
        var mMonto = ev.target.id && ev.target.id.match(/^revMonto(\d+)$/);
        if (mMonto) { onAmbitoChange(Number(mMonto[1])); return; }
        if (ev.target.classList.contains('rev-partes-monto')) {
          var grupo = ev.target.closest('[id^="revPartesGroup"]');
          var mIdx = grupo && grupo.id.match(/^revPartesGroup(\d+)$/);
          if (mIdx) actualizarRestante(Number(mIdx[1]));
        }
      });
    } catch (e) {
      console.error('revisar init falló:', e);
      loadingEl.style.display = 'none';
      errGlobal.textContent = 'No se pudieron cargar los pendientes. Revisa tu conexión y reintenta.';
      errGlobal.style.display = 'block';
    }
  }

  init();
})();
</script>
