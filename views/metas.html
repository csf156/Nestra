<div class="metas">
  <header class="metas-header">
    <div>
      <h1 class="metas-title">Metas</h1>
      <p class="metas-sub">Tu progreso hacia cada objetivo</p>
    </div>
  </header>

  <section class="metas-activas" id="metasActivas" aria-live="polite"></section>

  <details class="metas-completadas" id="metasCompletadas">
    <summary class="metas-comp-sum">Metas completadas (<span id="metasCompCount">0</span>)</summary>
    <ul class="metas-comp-lista" id="metasCompLista"></ul>
  </details>

  <!-- Modal de alta -->
  <div class="metas-modal-overlay" id="metaModal" role="dialog" aria-modal="true" aria-labelledby="metaModalTitle" hidden>
    <div class="metas-modal">
      <h2 class="metas-modal-title" id="metaModalTitle">Nueva meta</h2>
      <form id="metaForm" class="metas-form">
        <label class="metas-flabel">Nombre
          <input class="metas-input" id="mNombre" type="text" required />
        </label>
        <label class="metas-flabel">Categoría para este ahorro
          <select class="metas-input" id="mCategoria" required>
            <option value="">Cargando categorías...</option>
          </select>
        </label>
        <label class="metas-flabel">Horizonte
          <select class="metas-input" id="mHorizonte">
            <option value="corto">Corto plazo</option>
            <option value="mediano">Mediano plazo</option>
            <option value="largo">Largo plazo</option>
          </select>
        </label>
        <div class="metas-flabel">Ámbito
          <div class="metas-toggle" role="group" aria-label="Ámbito">
            <button type="button" class="metas-seg metas-seg--active" data-ambito="hogar" aria-pressed="true">Hogar</button>
            <button type="button" class="metas-seg" data-ambito="personal" aria-pressed="false">Personal</button>
          </div>
        </div>
        <label class="metas-flabel">Monto objetivo
          <div class="metas-monto"><span aria-hidden="true">S/</span>
            <input class="metas-input" id="mObjetivo" type="text" inputmode="decimal" placeholder="0.00" />
          </div>
        </label>
        <label class="metas-flabel">Fecha de inicio
          <input class="metas-input" id="mInicio" type="date" />
        </label>
        <label class="metas-flabel">Fecha límite
          <input class="metas-input" id="mLimite" type="date" />
        </label>
        <label class="metas-flabel">Nota (opcional)
          <textarea class="metas-input" id="mNota" rows="2"></textarea>
        </label>
        <p class="metas-form-error" id="metaError" role="alert" hidden></p>
        <div class="metas-modal-actions">
          <button type="button" class="btn btn-secondary" id="metaCancelar">Cancelar</button>
          <button type="submit" class="btn btn-primary">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast -->
  <div class="metas-toast" id="metasToast" role="status" aria-live="polite" hidden>
    <span id="metasToastMsg"></span>
    <button type="button" id="metasToastAccion" class="metas-toast-btn" hidden></button>
  </div>

  <!-- Mini-modal: aporte directo a meta -->
  <div class="metas-modal-overlay" id="aporteModal" role="dialog" aria-modal="true" aria-labelledby="aporteModalTitle" hidden>
    <div class="metas-modal">
      <h2 class="metas-modal-title" id="aporteModalTitle">Registrar aporte</h2>
      <p class="metas-aporte-meta" id="aporteMetaNombre"></p>
      <form id="aporteForm" class="metas-form">
        <label class="metas-flabel">Monto
          <div class="metas-monto"><span aria-hidden="true">S/</span>
            <input class="metas-input" id="aMonto" type="text" inputmode="decimal" placeholder="0.00" />
          </div>
        </label>
        <label class="metas-flabel">Fecha
          <input class="metas-input" id="aFecha" type="date" />
        </label>
        <label class="metas-flabel">Nota (opcional)
          <textarea class="metas-input" id="aNota" rows="2"></textarea>
        </label>
        <p class="metas-form-error" id="aporteError" role="alert" hidden></p>
        <div class="metas-modal-actions">
          <button type="button" class="btn btn-secondary" id="aporteCancelar">Cancelar</button>
          <button type="submit" class="btn btn-primary">Aportar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: confirmar borrado de meta -->
  <div class="metas-modal-overlay" id="delMetaModal" role="dialog" aria-modal="true" aria-labelledby="delMetaTitle" hidden>
    <div class="metas-modal metas-modal--confirm">
      <h2 class="metas-modal-title" id="delMetaTitle">Eliminar meta</h2>
      <p class="metas-confirm-body" id="delMetaBody"></p>
      <div class="metas-modal-actions">
        <button type="button" class="btn btn-secondary" id="delMetaCancelar">Cancelar</button>
        <button type="button" class="btn btn-danger" id="delMetaConfirmar">Eliminar</button>
      </div>
    </div>
  </div>
</div>

<style>
  .metas { max-width: 720px; margin: 0 auto; padding: var(--space-lg) var(--space-md) calc(var(--space-xl) + 72px); }
  .metas-header { margin-bottom: var(--space-lg); }
  .metas-title { font-size: var(--font-size-2xl); font-weight: var(--font-weight-bold); color: var(--text-dark); margin: 0; }
  .metas-sub { color: var(--text-secondary); font-size: var(--font-size-sm); margin: 2px 0 0; }

  .metas-activas { display: flex; flex-direction: column; gap: var(--space-md); }
  .metas-vacio { color: var(--text-secondary); text-align: center; padding: var(--space-xl) var(--space-md); }

  .meta-card { background: var(--bg-light); border: 1px solid var(--border-light); border-left: 4px solid var(--color-primary); border-radius: var(--radius-lg); padding: var(--space-lg); box-shadow: var(--shadow-sm); }
  .meta-card[data-estado="urgente"] { border-left-color: var(--color-warning); background: color-mix(in srgb, var(--color-warning) 6%, transparent); }
  .meta-card[data-estado="vencida"] { border-left-color: var(--color-danger); background: color-mix(in srgb, var(--color-danger) 6%, transparent); }
  .meta-nombre { font-size: var(--font-size-lg); font-weight: var(--font-weight-semibold); color: var(--text-dark); margin: 0 0 var(--space-sm); }
  .meta-categoria { margin-bottom: var(--space-sm); }
  .meta-cat-content { display: inline-flex; align-items: center; gap: 6px; font-size: var(--font-size-sm); color: var(--text-secondary); }
  .meta-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: var(--space-md); }
  .meta-badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--bg-light-secondary); color: var(--text-secondary); }
  .meta-badge--ambito { background: var(--color-primary); color: #0a0a0a; font-weight: var(--font-weight-semibold); }

  .meta-barra { height: 2px; border-radius: 9999px; background: var(--border-light); overflow: hidden; }
  .meta-barra-fill { height: 100%; background: var(--progress-color, var(--color-primary)); border-radius: 9999px; transition: width 0.3s; }
  .meta-card[data-estado="vencida"] .meta-barra-fill { --progress-color: var(--color-danger); }
  .meta-cifras { display: flex; justify-content: space-between; align-items: baseline; margin-top: var(--space-sm); color: var(--text-dark); }
  .meta-cifras .signature-num { font-size: var(--font-size-xl); }
  .meta-pct { font-weight: var(--font-weight-semibold); font-size: var(--font-size-sm); color: var(--text-secondary); }
  .meta-plazo { margin-top: var(--space-sm); font-size: var(--font-size-sm); color: var(--text-secondary); }
  .meta-plazo--urgente { color: var(--color-warning); font-weight: var(--font-weight-medium); }
  .meta-plazo--vencida { color: var(--color-danger); font-weight: var(--font-weight-medium); }

  .meta-acciones { display: flex; flex-wrap: wrap; gap: var(--space-sm); margin-top: var(--space-md); }
  .meta-acciones .btn-small { min-height: 40px; padding: 0 var(--space-md); border-radius: var(--radius-md); font-size: var(--font-size-sm); cursor: pointer; border: 1px solid var(--border-light); background: var(--bg-light); color: var(--text-dark); }
  .meta-acciones .btn-small--primary { background: var(--color-primary); color: #0a0a0a; border-color: var(--color-primary); }
  .meta-acciones .btn-small--danger { color: var(--color-danger); }
  .meta-nota-info { margin-top: var(--space-sm); font-size: var(--font-size-xs); color: var(--text-secondary); }

  .metas-completadas { margin-top: var(--space-xl); border-top: 1px solid var(--border-light); padding-top: var(--space-md); }
  .metas-comp-sum { cursor: pointer; color: var(--text-secondary); font-size: var(--font-size-sm); }
  .metas-comp-lista { list-style: none; margin: var(--space-md) 0 0; padding: 0; display: flex; flex-direction: column; gap: var(--space-sm); }
  .metas-comp-lista li { display: flex; justify-content: space-between; gap: var(--space-sm); font-size: var(--font-size-sm); color: var(--text-secondary); }
  .metas-comp-lista li > span:first-child { display: inline-flex; align-items: center; gap: 6px; }

  /* Modal: z-index por encima del nav (100), centrado en todas las pantallas */
  .metas-modal-overlay { position: fixed; inset: 0; background: color-mix(in srgb, #000 45%, transparent); display: flex; align-items: center; justify-content: center; z-index: 200; padding: var(--space-md); }
  .metas-modal-overlay[hidden] { display: none; }
  .metas-modal { background: var(--bg-light); width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; border-radius: var(--radius-lg); padding: var(--space-lg); }
  .metas-modal-title { font-size: var(--font-size-xl); font-weight: var(--font-weight-bold); color: var(--text-dark); margin: 0 0 var(--space-md); }
  .metas-form { display: flex; flex-direction: column; gap: var(--space-md); }
  .metas-flabel { display: flex; flex-direction: column; gap: 4px; font-size: var(--font-size-sm); font-weight: var(--font-weight-medium); color: var(--text-dark); }
  .metas-input { width: 100%; box-sizing: border-box; min-height: 44px; padding: 8px var(--space-md); border: 1px solid var(--border-light); border-radius: var(--radius-md); background: var(--bg-light); color: var(--text-dark); font-size: var(--font-size-base); }
  textarea.metas-input { min-height: 60px; }
  .metas-monto { display: flex; align-items: center; gap: var(--space-sm); }
  .metas-monto span { color: var(--text-secondary); }
  .metas-monto .metas-input { flex: 1; }
  .metas-toggle { display: flex; gap: 4px; background: var(--bg-light-secondary); padding: 4px; border-radius: var(--radius-md); margin-top: 4px; }
  .metas-seg { flex: 1; min-height: 44px; border: none; background: transparent; border-radius: var(--radius-sm); color: var(--text-secondary); font-weight: var(--font-weight-semibold); cursor: pointer; }
  .metas-seg--active { background: var(--color-primary); color: #0a0a0a; }
  .metas-form-error { color: var(--color-danger); font-size: var(--font-size-sm); margin: 0; }
  .metas-modal-actions { display: flex; gap: var(--space-sm); justify-content: flex-end; margin-top: var(--space-sm); }

  .metas-toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--space-lg) + 72px); background: var(--text-dark); color: var(--bg-light); padding: 12px var(--space-lg); border-radius: var(--radius-md); display: flex; align-items: center; gap: var(--space-md); z-index: 50; box-shadow: var(--shadow-lg); font-size: var(--font-size-sm); }
  .metas-toast[hidden] { display: none; }
  .metas-toast-btn { background: transparent; border: none; color: var(--color-success); font-weight: var(--font-weight-semibold); cursor: pointer; }

  .metas-aporte-meta { color: var(--text-secondary); font-size: var(--font-size-sm); margin: 0 0 var(--space-md); }
  .metas-modal--confirm { max-width: 420px; }
  .metas-confirm-body { color: var(--text-dark); font-size: var(--font-size-base); margin: 0 0 var(--space-lg); }

  .meta-card--lograda { border-left-color: var(--color-success); background: color-mix(in srgb, var(--color-success) 6%, transparent); }
  .meta-felicita { display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--space-sm); padding: var(--space-md) 0; }
  .meta-felicita-icono { font-size: 2.5rem; line-height: 1; }
  .meta-felicita-titulo { font-size: var(--font-size-xl); font-weight: var(--font-weight-bold); color: var(--color-success); margin: 0; }
  .meta-felicita-nombre { font-size: var(--font-size-lg); font-weight: var(--font-weight-semibold); color: var(--text-dark); margin: 0; }
  .meta-felicita-monto { color: var(--text-dark); font-size: var(--font-size-2xl); margin: 0 0 var(--space-sm); }
  .meta-felicita .btn { min-width: 160px; }

  @media (prefers-reduced-motion: reduce) { .meta-barra-fill { transition: none; } }
</style>

<script>
  (function () {
    'use strict';
    function $(id) { return document.getElementById(id); }
    function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    var estadoForm = { ambito: 'hogar' };

    // ── Toast local (mensaje + acción opcional con timeout) ───
    var toastTimer = null;
    function mostrarToast(msg, accionLabel, onAccion, ms) {
      var t = $('metasToast'), btn = $('metasToastAccion');
      $('metasToastMsg').textContent = msg;
      if (accionLabel) { btn.textContent = accionLabel; btn.hidden = false; btn.onclick = function () { onAccion && onAccion(); ocultarToast(); }; }
      else { btn.hidden = true; btn.onclick = null; }
      t.hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(ocultarToast, ms || 3000);
    }
    function ocultarToast() { clearTimeout(toastTimer); $('metasToast').hidden = true; }

    // ── Carga (render real en Tasks 2-3) ─────────────────────
    var _metas = [];
    async function cargar() {
      var metas = await getMetas();
      _metas = metas || [];
      var activas = _metas.filter(function (m) { return m.estado === 'en_curso' || m.estado === 'vencida'; });
      var completadas = _metas.filter(function (m) { return m.estado === 'lograda'; });
      renderActivas(activas);
      renderCompletadas(completadas);
    }
    function _metaPorId(id) { return _metas.filter(function (m) { return String(m.id) === String(id); })[0]; }
    var TIPO_LBL = { ahorro: 'Ahorro', reduccion_gasto: 'Reducción', aporte_hogar: 'Aporte hogar' };
    var HOR_LBL = { corto: 'Corto plazo', mediano: 'Mediano plazo', largo: 'Largo plazo' };
    var AMB_LBL = { personal: 'Personal', hogar: 'Hogar' };

    function diasRestantes(fechaLimite) {
      if (!fechaLimite) return null;
      var hoy = new Date(); hoy.setHours(0, 0, 0, 0);
      var lim = new Date(fechaLimite + 'T00:00:00');
      return Math.round((lim - hoy) / 86400000);
    }
    function textoPlazo(dias) {
      if (dias == null) return 'Sin fecha límite';
      if (dias > 1) return 'Faltan ' + dias + ' días';
      if (dias === 1) return 'Falta 1 día';
      if (dias === 0) return 'Vence hoy';
      if (dias === -1) return 'Vencida hace 1 día';
      return 'Vencida hace ' + Math.abs(dias) + ' días';
    }
    function estadoVisual(meta, dias) {
      var completa = Number(meta.monto_actual) >= Number(meta.monto_objetivo);
      if (meta.estado === 'vencida' || (dias != null && dias < 0 && !completa)) return 'vencida';
      if (dias != null && dias < 7 && dias >= 0) return 'urgente';
      return 'normal';
    }

    function metaAlcanzada(m) {
      var obj = Number(m.monto_objetivo) || 0;
      return m.estado === 'en_curso' && obj > 0 && Number(m.monto_actual) >= obj;
    }

    var _categoriasCache = null;
    async function _getCategoriasCached() {
      if (!_categoriasCache) {
        _categoriasCache = await getCategorias('gasto');
      }
      return _categoriasCache;
    }

    async function _renderCategoriaMeta(m) {
      if (!m.categoria_id) return;
      try {
        var cats = await _getCategoriasCached();
        var cat = cats.find(function (c) { return c.id === m.categoria_id; });
        if (cat) {
          var catEl = document.getElementById('meta-cat-' + m.id);
          if (catEl) {
            var icono = (typeof iconoCategoria === 'function') ? iconoCategoria(cat.icono) : '';
            var chipColor = /^#[0-9a-fA-F]{3,8}$/.test(cat.color) ? cat.color : '#c9a84c';
            catEl.innerHTML = '<span class="cat-chip" style="--chip-color:' + chipColor + '" aria-hidden="true">' + icono + '</span>' +
              '<span class="meta-cat-nombre">' + esc(cat.nombre) + '</span>';
          }
        }
      } catch (err) {
        console.error('Error cargando categoría para meta:', err);
      }
    }

    function renderActivas(activas) {
      var cont = $('metasActivas');
      if (!activas.length) {
        cont.innerHTML = '<div class="empty-state">' +
          '<svg class="empty-state-icon" aria-hidden="true"><use href="assets/tabler-sprite.svg#tabler-target"></use></svg>' +
          '<p class="empty-state-title">Sin metas aún</p>' +
          '<p class="empty-state-desc">Crea tu primera meta de ahorro y haz seguimiento de tu progreso.</p>' +
          '<button type="button" class="btn btn-primary btn-sm empty-state-cta" id="metasEmptyNueva">Crear meta</button></div>';
        var bn = $('metasEmptyNueva');
        if (bn) bn.addEventListener('click', function () { if (window._abrirNuevaMeta) window._abrirNuevaMeta(); });
        return;
      }
      cont.innerHTML = activas.map(function (m) {
        if (metaAlcanzada(m)) {
          return '<article class="meta-card meta-card--lograda" data-id="' + m.id + '">' +
            '<div class="meta-felicita">' +
              '<div class="meta-felicita-icono" aria-hidden="true"><svg class="cat-icono"><use href="assets/tabler-sprite.svg#tabler-confetti"></use></svg></div>' +
              '<h2 class="meta-felicita-titulo">¡Meta cumplida!</h2>' +
              '<p class="meta-felicita-nombre">' + esc(m.nombre) + '</p>' +
              '<p class="meta-felicita-monto signature-num">' + formatMonto(Number(m.monto_actual) || 0) + '</p>' +
              '<button type="button" class="btn btn-primary" data-act="confirmar" data-id="' + m.id + '">Confirmar</button>' +
            '</div></article>';
        }
        var dias = diasRestantes(m.fecha_limite);
        var vis = estadoVisual(m, dias);
        var obj = Number(m.monto_objetivo) || 0;
        var act = Number(m.monto_actual) || 0;
        var pct = obj > 0 ? Math.min(100, Math.round(act / obj * 100)) : 0;
        var plazoCls = vis === 'vencida' ? ' meta-plazo--vencida' : (vis === 'urgente' ? ' meta-plazo--urgente' : '');
        var aporte = m.tipo === 'ahorro'
          ? '<button type="button" class="btn-small btn-small--primary" data-act="aporte" data-id="' + m.id + '">Registrar aporte</button>'
          : '<span class="meta-nota-info">El progreso se actualiza con tus movimientos.</span>';
        return '<article class="meta-card" data-estado="' + vis + '" data-id="' + m.id + '">' +
          '<h2 class="meta-nombre">' + esc(m.nombre) + '</h2>' +
          '<div class="meta-categoria">' +
            '<span id="meta-cat-' + esc(m.id) + '" class="meta-cat-content">' +
              '<!-- icono + nombre se renderizará vía JS -->' +
            '</span>' +
          '</div>' +
          '<div class="meta-badges">' +
            '<span class="meta-badge meta-badge--ambito">' + AMB_LBL[m.ambito] + '</span>' +
            '<span class="meta-badge">' + (TIPO_LBL[m.tipo] || m.tipo) + '</span>' +
            (m.horizonte ? '<span class="meta-badge">' + (HOR_LBL[m.horizonte] || m.horizonte) + '</span>' : '') +
          '</div>' +
          '<div class="meta-barra" role="progressbar" aria-valuenow="' + pct + '" aria-valuemin="0" aria-valuemax="100">' +
            '<div class="meta-barra-fill" style="width:' + pct + '%"></div></div>' +
          (obj > 0
            ? '<div class="meta-cifras"><span class="signature-num">' + formatMonto(act) + ' / ' + formatMonto(obj) + '</span><span class="meta-pct">' + pct + '%</span></div>'
            : '<div class="meta-cifras"><span class="signature-num">' + formatMonto(act) + '</span><span class="meta-pct">acumulado · Sin objetivo</span></div>') +
          '<p class="meta-plazo' + plazoCls + '">' + textoPlazo(dias) + (m.fecha_limite ? ' · ' + m.fecha_limite : '') + '</p>' +
          '<div class="meta-acciones">' + aporte +
            (m.es_fondo_emergencia ? '' :
              '<button type="button" class="btn-small btn-small--danger" data-act="eliminar" data-id="' + m.id + '">Eliminar</button>') +
          '</div></article>';
      }).join('');
      // Renderizar categoría para cada meta (async, sin bloquear)
      activas.forEach(function (m) {
        _renderCategoriaMeta(m);
      });
    }

    function renderCompletadas(comp) {
      $('metasCompCount').textContent = comp.length;
      $('metasCompLista').innerHTML = comp.map(function (m) {
        return '<li><span><svg class="cat-icono" style="color:var(--color-success)" aria-hidden="true"><use href="assets/tabler-sprite.svg#tabler-circle-check"></use></svg> ' + esc(m.nombre) + '</span><span>' + (m.fecha_limite || '—') + ' · ' + formatMonto(Number(m.monto_actual) || 0) + '</span></li>';
      }).join('');
    }

    // ── Delegación de acciones en las tarjetas ────────────────
    $('metasActivas').addEventListener('click', function (e) {
      var btn = e.target.closest('[data-act]');
      if (!btn) return;
      var id = btn.getAttribute('data-id');
      var act = btn.getAttribute('data-act');
      if (act === 'aporte') registrarAporte(id);
      else if (act === 'confirmar') confirmarLograda(id);
      else if (act === 'eliminar') eliminarMeta(id);
    });

    var aportePendiente = null;
    function registrarAporte(id) {
      var m = _metaPorId(id);
      if (!m) return;
      aportePendiente = id;
      $('aporteMetaNombre').textContent = 'Aporte a: ' + m.nombre;
      $('aporteError').hidden = true;
      $('aMonto').value = '';
      $('aNota').value = '';
      $('aFecha').value = _hoyISO();
      $('aporteModal').hidden = false;
      setTimeout(function () { $('aMonto').focus(); }, 50);
    }

    async function confirmarLograda(id) {
      try {
        await updateMeta(id, { estado: 'lograda' });
        mostrarToast('¡Meta guardada en cumplidas!', null, null, 3000);
        cargar();
      } catch (err) {
        mostrarToast('No se pudo actualizar. Reintenta.', null, null, 4000);
      }
    }

    var delMetaPendiente = null;
    function eliminarMeta(id) {
      var m = _metaPorId(id);
      delMetaPendiente = id;
      $('delMetaBody').textContent = '¿Seguro que quieres eliminar «' + (m ? m.nombre : 'esta meta') + '»? Esta acción no se puede deshacer.';
      $('delMetaModal').hidden = false;
      setTimeout(function () { $('delMetaCancelar').focus(); }, 50);
    }

    // ── FAB + modal (alta real en Task 4) ─────────────────────
    function _hoyISO() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
    async function cargarCategoriasMeta() {
      var catEl = $('mCategoria');
      catEl.disabled = true;
      catEl.innerHTML = '<option value="">Cargando...</option>';
      try {
        var cats = await getCategorias('gasto');
        if (!cats.length) {
          catEl.innerHTML = '<option value="">Sin categorías</option>';
          return;
        }
        catEl.innerHTML = '<option value="">Selecciona una categoría</option>' +
          cats.map(function (c) { return '<option value="' + esc(c.id) + '">' + esc(c.nombre) + '</option>'; }).join('') +
          '<option value="__nueva__">+ Nueva categoría</option>';
      } catch (err) {
        console.error('Error cargando categorías:', err);
        catEl.innerHTML = '<option value="">Error al cargar</option>';
      } finally {
        catEl.disabled = false;
      }
    }
    function abrirModal() { $('metaError').hidden = true; $('mInicio').value = _hoyISO(); $('metaModal').hidden = false; cargarCategoriasMeta(); }
    window._abrirNuevaMeta = abrirModal;
    $('metaCancelar').addEventListener('click', function () { $('metaModal').hidden = true; $('mCategoria').value = ''; });
    $('aporteCancelar').addEventListener('click', function () { $('aporteModal').hidden = true; aportePendiente = null; });
    $('aporteModal').addEventListener('click', function (e) { if (e.target === e.currentTarget) { $('aporteModal').hidden = true; aportePendiente = null; } });
    $('aporteForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      var err = $('aporteError');
      function _err(msg) { err.textContent = msg; err.hidden = false; }
      if (!aportePendiente) return;
      var monto = parseFloat(String($('aMonto').value).replace(',', '.'));
      if (!(monto > 0)) { return _err('El monto debe ser mayor que 0.'); }
      var fecha = $('aFecha').value || _hoyISO();
      var nota = $('aNota').value.trim() || null;
      try {
        await insertAporteDirecto(aportePendiente, monto, fecha, nota);
        $('aporteModal').hidden = true;
        aportePendiente = null;
        mostrarToast('Aporte registrado', null, null, 3000);
        cargar();
      } catch (e2) {
        _err('No se pudo registrar el aporte. Reintenta.');
      }
    });
    $('delMetaCancelar').addEventListener('click', function () { $('delMetaModal').hidden = true; delMetaPendiente = null; });
    $('delMetaModal').addEventListener('click', function (e) { if (e.target === e.currentTarget) { $('delMetaModal').hidden = true; delMetaPendiente = null; } });
    $('delMetaModal').addEventListener('keydown', function (e) { if (e.key === 'Escape') { $('delMetaModal').hidden = true; delMetaPendiente = null; } });
    $('delMetaConfirmar').addEventListener('click', async function () {
      if (!delMetaPendiente) return;
      var id = delMetaPendiente;
      try {
        await deleteMeta(id);
        $('delMetaModal').hidden = true;
        delMetaPendiente = null;
        mostrarToast('Meta eliminada', null, null, 3000);
        cargar();
      } catch (err) {
        $('delMetaModal').hidden = true;
        delMetaPendiente = null;
        mostrarToast('No se pudo eliminar. Reintenta.', null, null, 4000);
      }
    });
    Array.prototype.forEach.call(document.querySelectorAll('.metas-seg'), function (b) {
      b.addEventListener('click', function () {
        estadoForm.ambito = b.getAttribute('data-ambito');
        Array.prototype.forEach.call(document.querySelectorAll('.metas-seg'), function (x) {
          var on = x === b; x.classList.toggle('metas-seg--active', on); x.setAttribute('aria-pressed', on ? 'true' : 'false');
        });
      });
    });
    $('metaForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      var err = $('metaError');
      function _formError(msg) { err.textContent = msg; err.hidden = false; }
      var nombre = $('mNombre').value.trim();
      var objetivo = parseFloat(String($('mObjetivo').value).replace(',', '.'));
      var inicio = $('mInicio').value;
      var limite = $('mLimite').value;

      if (!nombre) { return _formError('Ponle un nombre a la meta.'); }
      if (!(objetivo > 0)) { return _formError('El monto objetivo debe ser mayor que 0.'); }
      if (!limite) { return _formError('Indica una fecha límite.'); }
      if (inicio && limite <= inicio) { return _formError('La fecha límite debe ser posterior a la de inicio.'); }

      var datos = {
        nombre: nombre,
        tipo: 'ahorro',
        categoria_id: $('mCategoria').value || null,
        horizonte: $('mHorizonte').value,
        ambito: estadoForm.ambito,
        monto_objetivo: objetivo,
        fecha_inicio: inicio || _hoyISO(),
        fecha_limite: limite,
        nota: $('mNota').value.trim() || null,
      };
      try {
        await insertMeta(datos);
        $('metaModal').hidden = true;
        $('metaForm').reset();
        $('mCategoria').value = '';
        mostrarToast('Meta creada', null, null, 3000);
        cargar();
        if (typeof pushOfrecerContextual === 'function') {
          pushOfrecerContextual('meta',
            '¿Quieres que te recuerde aportar a tus metas cada mes?');
        }
      } catch (e2) {
        _formError('No se pudo guardar: ' + (e2.message || 'error'));
      }
    });

    // Exponer helpers a tareas siguientes vía closure (no global).
    window.__metasCargar = cargar; // usado solo por el harness de verificación

    cargar();
  })();
</script>
