<div class="dash">

  <!-- ── SECCIÓN 1 — Saludo ───────────────────────────────────── -->
  <header class="dash-hero">
    <div class="dash-hero-text">
      <p class="dash-eyebrow" id="dashMesActual">—</p>
      <h1 class="dash-saludo" id="dashSaludo">Hola</h1>
    </div>
  </header>

  <!-- ── SECCIÓN 1.5 — Safe-to-spend (hero) ───────────────────── -->
  <section id="dashSafeToSpend" class="dash-s2s" aria-live="polite"></section>
  <div id="brujulaMicroahorro" class="dash-microahorro" hidden></div>

  <!-- Error global de conexión -->
  <div id="dashConnError" class="alert error" role="alert" aria-live="assertive" style="display:none;">
    No se pudo conectar con el servidor. Revisa tu conexión y recarga la página.
  </div>

  <!-- ── SECCIONES 2 y 3 — Balances ───────────────────────────── -->
  <div class="dash-balances">

    <!-- Balance del hogar -->
    <section class="card dash-balance-card" id="dashHogarCard" aria-labelledby="hogarTitle" style="display:none">
      <h2 class="dash-card-title" id="hogarTitle">
        <svg class="cat-icono" aria-hidden="true"><use href="assets/tabler-sprite.svg#tabler-home"></use></svg> Hogar
        <span class="dash-card-periodo" id="hogarPeriodo"></span>
      </h2>
      <div id="hogarBody" class="dash-balance-body" aria-busy="true">
        <div class="dash-skeleton-rows" aria-hidden="true">
          <span class="sk"></span><span class="sk"></span><span class="sk"></span>
        </div>
      </div>
    </section>

    <!-- Balance personal -->
    <section class="card dash-balance-card" aria-labelledby="personalTitle">
      <h2 class="dash-card-title" id="personalTitle">
        <svg class="cat-icono" aria-hidden="true"><use href="assets/tabler-sprite.svg#tabler-user"></use></svg> Tu balance
        <span class="dash-card-periodo" id="personalPeriodo"></span>
      </h2>
      <div id="personalBody" class="dash-balance-body" aria-busy="true">
        <div class="dash-skeleton-rows" aria-hidden="true">
          <span class="sk"></span><span class="sk"></span><span class="sk"></span><span class="sk"></span>
        </div>
      </div>
    </section>
  </div>

  <!-- ── Fase 6 — Quién debe qué (solo si hay hogar compartido) ── -->
  <section class="card dash-balance-card" id="dashDeudaCard" aria-labelledby="deudaTitle" style="display:none">
    <h2 class="dash-card-title" id="deudaTitle">
      <svg class="cat-icono" aria-hidden="true"><use href="assets/tabler-sprite.svg#tabler-users"></use></svg> Desequilibrio de aportes
      <a href="#hogar" class="dash-card-periodo" style="text-decoration:none">Ver hogar →</a>
    </h2>
    <div id="dashDeudaBody" class="dash-balance-body"></div>
  </section>

  <!-- ── SECCIÓN 3.5 — Insights ───────────────────────────────── -->
  <section id="dashInsights" class="dash-insights" aria-label="Insights" aria-live="polite"></section>

  <!-- ── SECCIÓN 4 — Alertas ──────────────────────────────────── -->
  <section id="dashAlertas" class="dash-alertas" aria-live="polite" aria-label="Alertas activas"></section>

  <!-- ── SECCIÓN 4.5 — Presupuestos del mes ───────────────────────── -->
  <section class="card dash-presup-card" id="dashPresupCard" aria-labelledby="presupTitle" style="display:none">
    <div class="dash-presup-head-row">
      <h2 class="dash-card-title" id="presupTitle">Presupuestos del mes</h2>
      <!-- Mismo patrón que hist-sort (historial.html:68). A diferencia de allá,
           acá se muestra también en desktop: la card no tiene encabezados de
           columna que puedan ordenar. -->
      <div class="dash-presup-sort" role="group" aria-label="Ordenar presupuestos">
        <label for="presupSortCampo">Ordenar</label>
        <select id="presupSortCampo">
          <option value="limite">Cerca del límite</option>
          <option value="gasto">Más gasto</option>
        </select>
        <button type="button" class="dash-presup-sort-dir" id="presupSortDir"
                aria-label="Cambiar dirección">▼</button>
      </div>
    </div>
    <div id="dashPresupBody" aria-live="polite"></div>
  </section>

  <!-- ── SECCIÓN 5 — Últimas transacciones ────────────────────── -->
  <section class="card dash-tx-card" aria-labelledby="txTitle">
    <h2 class="dash-card-title" id="txTitle">Últimas transacciones</h2>
    <div id="dashTxBody" aria-busy="true" aria-live="polite">
      <div class="dash-skeleton-list" aria-hidden="true">
        <span class="sk sk-line"></span><span class="sk sk-line"></span><span class="sk sk-line"></span>
      </div>
    </div>
  </section>

  <!-- ── SECCIÓN 6 — Metas activas ────────────────────────────── -->
  <section class="card dash-metas-card" aria-labelledby="metasTitle">
    <div class="dash-card-head">
      <h2 class="dash-card-title" id="metasTitle">Metas activas</h2>
      <a href="#metas" class="dash-link">Ver todas →</a>
    </div>
    <div id="dashMetasBody" aria-busy="true" aria-live="polite">
      <div class="dash-skeleton-list" aria-hidden="true">
        <span class="sk sk-line"></span><span class="sk sk-line"></span>
      </div>
    </div>
  </section>

</div>

<style>
  .dash {
    max-width: 720px;
    margin: 0 auto;
    padding: var(--space-md);
    padding-bottom: calc(var(--space-xl) + 72px); /* espacio para el FAB */
  }
  @media (min-width: 600px) {
    .dash { padding: var(--space-lg); padding-bottom: calc(var(--space-xl) + 72px); }
  }

  /* ── Saludo ─────────────────────────────────────────────── */
  .dash-hero { margin-bottom: var(--space-lg); }
  .dash-eyebrow {
    margin: 0 0 var(--space-xs);
    font-size: var(--font-size-xs);
    font-weight: var(--font-weight-semibold);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--color-primary);
  }
  .dash-saludo {
    margin: 0;
    font-family: var(--font-display);
    font-size: var(--font-size-2xl);
    font-weight: var(--font-weight-bold);
    color: var(--text-dark);
    line-height: 1.15;
  }

  /* ── Safe-to-spend (hero) ───────────────────────────────── */
  .dash-s2s:not(:empty) { margin-bottom: var(--space-lg); }
  .dash-s2s-card {
    padding: var(--space-lg);
    border-radius: var(--radius-md);
    background: linear-gradient(135deg, var(--s2s-from), var(--s2s-to));
    color: #fff;
    box-shadow: var(--shadow-md);
  }
  /* base.css define `p { color: var(--text-secondary) }`, y esa regla le gana
     por especificidad al color heredado de la card: sin esto los tres <p> del
     hero salen plomo sobre el gradiente (1.11:1, ilegible). */
  .dash-s2s-card p { color: inherit; }
  .dash-s2s-card--excedido {
    background: linear-gradient(135deg, var(--s2s-exc-from), var(--s2s-exc-to));
  }
  .dash-s2s-label {
    margin: 0;
    font-size: var(--font-size-xs);
    font-weight: var(--font-weight-semibold);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    opacity: 0.9;
  }
  .dash-s2s-monto {
    margin: var(--space-xs) 0 0;
    font-family: var(--font-display);
    font-size: 2.6rem;
    font-weight: var(--font-weight-bold);
    line-height: 1.05;
    font-variant-numeric: tabular-nums;
  }
  .dash-s2s-sub {
    margin: var(--space-xs) 0 0;
    font-size: var(--font-size-sm);
    opacity: 0.92;
  }

  .dash-microahorro { margin: var(--space-md) 0; padding: var(--space-md); border-radius: var(--radius-lg); border: 1px solid var(--border-light); background: color-mix(in srgb, var(--color-success) 8%, transparent); display:flex; flex-direction:column; gap: var(--space-sm); }
  .dash-microahorro[hidden] { display:none; }
  .dash-microahorro-txt { font-size: var(--font-size-base); color: var(--text-dark); }
  .dash-microahorro .dash-offline { color: var(--text-secondary); font-size: var(--font-size-sm); }

  /* ── Cards base ─────────────────────────────────────────── */
  .dash .card { margin-bottom: var(--space-md); }
  .dash .card:hover { transform: none; box-shadow: var(--shadow-md); }

  .dash-card-title {
    display: flex;
    align-items: center;
    gap: var(--space-sm);
    margin: 0 0 var(--space-md);
    font-size: var(--font-size-lg);
    font-weight: var(--font-weight-bold);
    color: var(--text-dark);
  }
  .dash-card-periodo {
    margin-left: auto;
    font-size: var(--font-size-xs);
    font-weight: var(--font-weight-medium);
    color: var(--text-secondary);
    text-transform: capitalize;
  }
  .dash-card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-md);
    margin-bottom: var(--space-md);
  }
  .dash-card-head .dash-card-title { margin: 0; }
  .dash-link {
    font-size: var(--font-size-sm);
    font-weight: var(--font-weight-semibold);
    color: var(--color-primary);
    text-decoration: none;
    white-space: nowrap;
  }
  .dash-link:hover { text-decoration: underline; }

  /* ── Balances grid ──────────────────────────────────────── */
  .dash-balances {
    display: grid;
    grid-template-columns: 1fr;
    gap: var(--space-md);
  }
  @media (min-width: 600px) {
    .dash-balances { grid-template-columns: 1fr 1fr; }
    .dash-balances .card { margin-bottom: 0; }
    .dash-balances { margin-bottom: var(--space-md); }
  }

  /* Filas ingreso/gasto/aporte */
  .dash-line {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: var(--space-sm) 0;
    font-size: var(--font-size-sm);
  }
  .dash-line + .dash-line { border-top: 1px solid var(--border-light); }
  .dash-line-label { color: var(--text-secondary); display: flex; align-items: center; gap: var(--space-xs); }
  .dash-line-value { font-weight: var(--font-weight-semibold); color: var(--text-dark); font-variant-numeric: tabular-nums; }

  /* Balance neto destacado */
  .dash-neto {
    margin-top: var(--space-sm);
    padding-top: var(--space-md);
    border-top: 2px solid var(--border-light);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: var(--space-sm);
  }
  /* El lado de la etiqueta puede encogerse; el monto nunca se parte en 2 líneas. */
  .dash-neto > div { min-width: 0; }
  .dash-neto-label {
    font-size: var(--font-size-sm);
    font-weight: var(--font-weight-semibold);
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .dash-neto-value {
    font-family: var(--font-display);
    font-size: 2rem;
    font-weight: 400;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    flex-shrink: 0;
  }
  /* Signo no solo por color (WCAG 1.4.1): glifo ▲/▼ */
  .dash-neto-value--pos { color: var(--color-success); }
  .dash-neto-value--neg { color: var(--color-danger); }
  .dash-neto-value--pos::before { content: "▲ "; font-size: 0.7em; }
  .dash-neto-value--neg::before { content: "▼ "; font-size: 0.7em; }

  .dash-line-value--ingreso { color: var(--color-success); }
  .dash-line-value--gasto   { color: var(--color-danger); }
  .dash-line-value--ahorro  { color: var(--color-info); }
  .dash-line--aporte { font-size: var(--font-size-xs); }
  .dash-line--aporte .dash-line-label { font-style: italic; }

  .dash-neto-sublabel {
    display: block;
    font-size: var(--font-size-xs);
    color: var(--text-secondary);
    margin-top: 2px;
    font-weight: var(--font-weight-normal);
  }
  .dash-delta--pos { color: var(--color-success); font-weight: var(--font-weight-semibold); }
  .dash-delta--neg { color: var(--color-danger);  font-weight: var(--font-weight-semibold); }

  /* ── Insights (carrusel mobile-first) ──────────────────── */
  .dash-insights:not(:empty) { margin-bottom: var(--space-md); }
  .dash-insights-track {
    display: flex;
    gap: var(--space-sm);
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    /* sangra a los bordes de pantalla en móvil → swipe edge-to-edge */
    margin-inline: calc(-1 * var(--space-md));
    padding-inline: var(--space-md);
    padding-bottom: var(--space-xs);
    scrollbar-width: thin;
  }
  .insight-card {
    flex: 0 0 auto;
    width: min(85%, 300px);
    scroll-snap-align: start;
    display: flex;
    flex-direction: column;
    gap: var(--space-xs);
    padding: var(--space-md);
    border-radius: var(--radius-md);
    border-left: 2px solid var(--insight-color, var(--border-light));
    background: color-mix(in srgb, var(--insight-color, var(--color-primary)) 4%, var(--bg-light-secondary));
    box-shadow: none;
  }
  .insight-card--warn  { --insight-color: var(--color-warning); }
  .insight-card--good  { --insight-color: var(--color-success); }
  .insight-card--alert { --insight-color: var(--color-danger);  }
  .insight-card--info  { --insight-color: var(--color-primary); }
  .insight-icono .cat-icono { width: 24px; height: 24px; }
  .insight-titulo {
    margin: 0;
    font-size: var(--font-size-sm);
    font-weight: var(--font-weight-bold);
    color: var(--text-dark);
    line-height: 1.25;
  }
  .insight-subtexto {
    margin: 0;
    font-size: var(--font-size-xs);
    color: var(--text-secondary);
    line-height: 1.35;
  }
  .insight-accion {
    margin-top: auto;
    padding-top: var(--space-xs);
    min-height: 44px;            /* target táctil */
    display: inline-flex;
    align-items: center;
    font-size: var(--font-size-sm);
    font-weight: var(--font-weight-semibold);
    color: var(--color-primary);
    text-decoration: none;
  }
  .insight-accion:hover { text-decoration: underline; }
  @media (min-width: 600px) {
    .insight-card { width: 280px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .dash-insights-track { scroll-behavior: auto; }
  }

  /* ── Alertas ────────────────────────────────────────────── */
  .dash-alertas:not(:empty) { margin-bottom: var(--space-md); display: grid; gap: var(--space-sm); }
  .alert-item {
    display: flex;
    align-items: flex-start;
    gap: var(--space-sm);
    padding: var(--space-md);
    border-radius: var(--radius-md);
    border-left: 4px solid var(--border-light);
    background: var(--bg-light-secondary);
    color: var(--text-dark);
    font-size: var(--font-size-sm);
    box-shadow: var(--shadow-sm);
  }
  .alert-item--critica  { border-left-color: var(--color-danger); }
  .alert-item--suave    { border-left-color: var(--color-warning); }
  .alert-item--positiva { border-left-color: var(--color-success); }
  .alert-icon { flex-shrink: 0; font-size: 1.1em; line-height: 1.3; }

  /* ── Transacciones ──────────────────────────────────────── */
  .dash-tx {
    display: flex;
    align-items: center;
    gap: var(--space-md);
    padding: var(--space-sm) 0;
  }
  .dash-tx + .dash-tx { border-top: 1px solid var(--border-light); }
  .dash-tx-main { flex: 1; min-width: 0; }
  .dash-tx-cat {
    display: block;
    font-weight: var(--font-weight-semibold);
    color: var(--text-dark);
    font-size: var(--font-size-sm);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .dash-tx-meta {
    display: flex; align-items: center; gap: var(--space-sm);
    margin-top: 2px;
    font-size: var(--font-size-xs);
    color: var(--text-secondary);
  }
  .dash-badge {
    display: inline-block;
    padding: 1px var(--space-sm);
    border-radius: var(--radius-sm);
    font-size: 0.68rem;
    font-weight: var(--font-weight-semibold);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .dash-badge--hogar    { background: color-mix(in srgb, var(--color-primary) 12%, transparent);   color: var(--color-primary); }
  .dash-badge--personal { background: color-mix(in srgb, var(--text-secondary) 15%, transparent); color: var(--text-secondary); }
  .dash-tx-monto {
    font-weight: var(--font-weight-bold);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .dash-tx-monto--ingreso { color: var(--color-success); }
  .dash-tx-monto--gasto   { color: var(--color-danger); }

  /* ── Metas ──────────────────────────────────────────────── */
  .dash-meta { padding: var(--space-sm) 0; }
  .dash-meta + .dash-meta { border-top: 1px solid var(--border-light); }
  .dash-meta-head {
    display: flex; justify-content: space-between; gap: var(--space-sm);
    margin-bottom: var(--space-xs);
  }
  .dash-meta-nombre { font-weight: var(--font-weight-semibold); color: var(--text-dark); font-size: var(--font-size-sm); }
  .dash-meta-cifras { color: var(--text-secondary); font-size: var(--font-size-xs); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .dash-meta-bar {
    height: 8px; background: var(--border-light);
    border-radius: var(--radius-sm); overflow: hidden;
  }
  .dash-meta-bar-fill {
    height: 100%; background: var(--color-primary);
    border-radius: var(--radius-sm); transition: width 0.4s ease-out;
  }
  .dash-meta-bar-fill--lograda { background: var(--color-success); }
  .dash-meta-foot {
    display: flex; align-items: center; justify-content: space-between;
    gap: var(--space-sm); margin-top: var(--space-sm);
  }
  .dash-meta-pct { font-size: var(--font-size-xs); color: var(--text-secondary); font-weight: var(--font-weight-semibold); }
  /* El progreso se actualiza solo (sin aporte manual). */
  .dash-metas-auto {
    font-size: var(--font-size-xs); color: var(--text-secondary);
    margin: var(--space-sm) 0 0; font-style: italic;
  }

  /* ── Presupuestos ───────────────────────────────────────── */
  .dash-presup-head-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: var(--space-sm); flex-wrap: wrap;
  }
  .dash-presup-sort { display: flex; align-items: center; gap: var(--space-xs); }
  .dash-presup-sort label {
    font-size: var(--font-size-xs); color: var(--text-secondary);
  }
  .dash-presup-sort select {
    min-height: 44px; background: var(--bg-light-secondary); color: var(--text-dark);
    border: 1px solid var(--border-light); border-radius: var(--radius-sm);
    font-size: var(--font-size-sm); padding: 0 var(--space-xs);
  }
  .dash-presup-sort-dir {
    min-width: 44px; min-height: 44px; background: transparent;
    border: 1px solid var(--border-light); border-radius: var(--radius-sm);
    color: var(--text-secondary); cursor: pointer;
  }
  .dash-presup-sort-dir:focus-visible, .dash-presup-sort select:focus-visible {
    outline: 2px solid var(--color-primary); outline-offset: 2px;
  }
  .dash-presup {
    display: flex;
    align-items: center;
    gap: var(--space-md);
    padding: var(--space-sm) 0;
  }
  .dash-presup + .dash-presup { border-top: 1px solid var(--border-light); }
  .dash-presup-main { flex: 1; min-width: 0; }
  /* Fila 1: nombre (trunca) + badge protegido a su derecha.
     Las cifras van en su propia línea (.dash-presup-cifras) para que el
     nombre nunca se recorte por completo en pantallas estrechas. */
  .dash-presup-head {
    display: flex; align-items: baseline;
    gap: var(--space-sm); margin-bottom: 2px;
  }
  .dash-presup-nombre {
    flex: 1 1 auto; min-width: 0;
    font-weight: var(--font-weight-semibold);
    color: var(--text-dark);
    font-size: var(--font-size-sm);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .dash-presup-cifras {
    display: block; text-align: right;
    margin-bottom: 6px;
    color: var(--text-secondary);
    font-size: var(--font-size-xs);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .dash-presup-bar {
    height: 2px;
    background: var(--border-light);
    border-radius: 9999px;
    overflow: hidden;
  }
  .dash-presup-bar-fill {
    height: 100%;
    border-radius: 9999px;
    transition: width 0.4s ease-out;
  }
  .dash-presup-bar-fill--verde { background: var(--color-success); }
  .dash-presup-bar-fill--ambar { background: var(--color-warning); }
  .dash-presup-bar-fill--rojo  { background: var(--color-danger); }
  .dash-presup-badge {
    display: inline-block;
    flex-shrink: 0;
    padding: 1px var(--space-sm);
    border-radius: var(--radius-sm);
    font-size: 0.62rem;
    font-weight: var(--font-weight-bold);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--color-danger);
    background: color-mix(in srgb, var(--color-danger) 14%, transparent);
    vertical-align: middle;
  }
  @media (prefers-reduced-motion: reduce) {
    .dash-presup-bar-fill { transition: none; }
  }

  /* Fondos de emergencia — tiles compactos, predominantes, sin barra.
     mobile-first: 1 columna; ≥480px en 2 columnas para ahorrar alto. */
  .dash-fondos {
    display: grid;
    grid-template-columns: 1fr;
    gap: var(--space-sm);
    margin-bottom: var(--space-md);
  }
  @media (min-width: 480px) {
    .dash-fondos { grid-template-columns: 1fr 1fr; }
  }
  .dash-fondo {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: baseline;
    column-gap: var(--space-sm);
    background: linear-gradient(135deg, var(--color-primary), var(--color-success));
    color: #fff;
    border-radius: var(--radius-md);
    padding: var(--space-sm) var(--space-md);
    box-shadow: var(--shadow-sm);
  }
  .dash-fondo-label {
    grid-column: 1 / -1;
    display: flex; align-items: center; gap: var(--space-xs);
    font-size: var(--font-size-xs); font-weight: var(--font-weight-semibold);
    text-transform: uppercase; letter-spacing: 0.04em;
    opacity: 0.9;
  }
  .dash-fondo-monto {
    font-size: var(--font-size-xl);
    font-weight: var(--font-weight-bold);
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
  }
  .dash-fondo-var {
    justify-self: end;
    font-size: var(--font-size-xs);
    font-weight: var(--font-weight-semibold);
    white-space: nowrap;
    opacity: 0.95;
  }

  .dash-empty { color: var(--text-secondary); text-align: center; padding: var(--space-md) 0; font-size: var(--font-size-sm); }

  /* ── Skeletons de carga ─────────────────────────────────── */
  .sk {
    display: block; height: 14px; border-radius: var(--radius-sm);
    background: linear-gradient(90deg, var(--border-light) 25%, var(--bg-light-secondary) 50%, var(--border-light) 75%);
    background-size: 200% 100%;
    animation: skShimmer 1.3s infinite;
    margin-bottom: var(--space-sm);
  }
  .sk-line { height: 28px; }
  .dash-skeleton-rows .sk:nth-child(2) { width: 80%; }
  .dash-skeleton-rows .sk:nth-child(3) { width: 60%; }
  @keyframes skShimmer {
    from { background-position: 200% 0; }
    to   { background-position: -200% 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .sk { animation: none; }
    .dash-meta-bar-fill { transition: none; }
  }

</style>

<script>
  (function () {
    // ── Helpers ───────────────────────────────────────────────
    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function $(id) { return document.getElementById(id); }
    function netoClass(v) { return v > 0 ? 'dash-neto-value--pos' : (v < 0 ? 'dash-neto-value--neg' : ''); }
    function deltaMesHtml(delta) {
      if (delta === 0) return 'Este mes: sin cambios';
      var cls = delta > 0 ? 'dash-delta--pos' : 'dash-delta--neg';
      var signo = delta > 0 ? '+' : '−';
      return 'Este mes: <span class="' + cls + '">' + signo + ' ' + esc(formatMonto(Math.abs(delta))) + '</span>';
    }

    const { mes, anio } = mesActual();
    const periodo = nombreMes(mes, anio); // "Junio 2026"

    // ── SECCIÓN 1 — Saludo ────────────────────────────────────
    try {
      const profile = getCurrentProfile();
      const user = getCurrentUser();
      const nombre = (profile && profile.nombre)
        || (user && user.email ? user.email.split('@')[0] : '');
      $('dashSaludo').textContent = nombre ? `Hola, ${nombre}` : 'Hola';
      $('dashMesActual').textContent = periodo;
    } catch (err) {
      console.error('Error saludo:', err);
    }
    $('hogarPeriodo').textContent = periodo;
    $('personalPeriodo').textContent = periodo;

    // ── Render: ahorro del hogar (gastosMes, ahorroMes, ahorroAcumulado) ──
    function renderHogar(gastosMes, ahorroMes, ahorroAcumulado) {
      const body = $('hogarBody');
      body.setAttribute('aria-busy', 'false');
      body.innerHTML = `
        <div class="dash-line">
          <span class="dash-line-label">Gastos compartidos</span>
          <span class="dash-line-value dash-line-value--gasto">${esc(formatMonto(gastosMes))}</span>
        </div>
        <div class="dash-line">
          <span class="dash-line-label">Ahorro aportado</span>
          <span class="dash-line-value dash-line-value--ahorro">${esc(formatMonto(ahorroMes))}</span>
        </div>
        <div class="dash-neto">
          <div>
            <span class="dash-neto-label">Ahorro del hogar</span>
          </div>
          <span class="dash-neto-value ${netoClass(ahorroAcumulado)}">${esc(formatMonto(ahorroAcumulado))}</span>
        </div>`;
    }

    // ── Render: balance personal (incluye aporte al hogar) ────
    function renderPersonal(b, acum, ahorros) {
      const body = $('personalBody');
      body.setAttribute('aria-busy', 'false');
      body.innerHTML = `
        <div class="dash-line">
          <span class="dash-line-label">Ingresos</span>
          <span class="dash-line-value dash-line-value--ingreso">${esc(formatMonto(b.ingresos))}</span>
        </div>
        <div class="dash-line">
          <span class="dash-line-label">Gastos</span>
          <span class="dash-line-value dash-line-value--gasto">${esc(formatMonto(b.gastos))}</span>
        </div>
        <div class="dash-line">
          <span class="dash-line-label">Ahorros</span>
          <span class="dash-line-value dash-line-value--ahorro">${esc(formatMonto(ahorros))}</span>
        </div>
        ${(typeof tieneHogar === 'function' && tieneHogar()) ? `
        <div class="dash-line dash-line--aporte">
          <span class="dash-line-label">↳ de eso, aporte al hogar</span>
          <span class="dash-line-value">${esc(formatMonto(b.aporte_realizado))}</span>
        </div>` : ''}
        <div class="dash-neto">
          <div>
            <span class="dash-neto-label">Balance acumulado</span>
            <span class="dash-neto-sublabel">${deltaMesHtml(b.balance - ahorros)}</span>
          </div>
          <span class="dash-neto-value ${netoClass(acum.balance)}">${esc(formatMonto(acum.balance))}</span>
        </div>`;
    }

    // ── Render: alertas ───────────────────────────────────────
    function renderAlertas(alertas) {
      const panel = $('dashAlertas');
      if (!alertas || !alertas.length) { panel.innerHTML = ''; return; }
      panel.innerHTML = alertas.map((a) => `
        <div class="alert-item alert-item--${esc(a.nivel)}" role="status">
          <span class="alert-icon" aria-hidden="true">${a.icono}</span>
          <span>${esc(a.mensaje)}</span>
        </div>`).join('');
    }

    // ── Render: insights (carrusel horizontal) ────────────────
    function renderInsights(insights) {
      const cont = $('dashInsights');
      if (!cont) return;
      if (!insights || !insights.length) { cont.innerHTML = ''; return; }
      const cards = insights.map((i) => {
        const icon = (typeof iconoCategoria === 'function') ? iconoCategoria(i.icono) : '';
        const accion = i.accion
          ? `<a class="insight-accion" href="${esc(i.accion.href)}">${esc(i.accion.label)} →</a>`
          : '';
        return `<article class="insight-card insight-card--${esc(i.tipo)}">
          <div class="insight-icono" aria-hidden="true">${icon}</div>
          <h3 class="insight-titulo">${esc(i.titulo)}</h3>
          <p class="insight-subtexto">${esc(i.subtexto)}</p>
          ${accion}
        </article>`;
      }).join('');
      cont.innerHTML = `<div class="dash-insights-track">${cards}</div>`;
    }

    // ── Render: safe-to-spend (hero) ──────────────────────────
    function renderSafeToSpend(res) {
      const cont = $('dashSafeToSpend');
      if (!cont) return;
      if (!res) { cont.innerHTML = ''; return; }
      if (res.estado === 'excedido') {
        cont.innerHTML = `
          <div class="dash-s2s-card dash-s2s-card--excedido">
            <p class="dash-s2s-label">Este mes</p>
            <p class="dash-s2s-monto">${esc(formatMonto(res.exceso))}</p>
            <p class="dash-s2s-sub">Te pasaste de lo disponible. Cuida los próximos ${res.diasRestantes} días.</p>
          </div>`;
        return;
      }
      cont.innerHTML = `
        <div class="dash-s2s-card">
          <p class="dash-s2s-label">Puedes gastar hoy</p>
          <p class="dash-s2s-monto">${esc(formatMonto(res.diario))}</p>
          <p class="dash-s2s-sub">Te quedan ${esc(formatMonto(res.restanteMes))} para ${res.diasRestantes} día${res.diasRestantes === 1 ? '' : 's'}.</p>
        </div>`;
    }

    // ── Render: presupuestos del mes ──────────────────────────
    // Cada presupuesto: chip tintado con el color de la categoría, nombre,
    // gastado/límite, barra 2px coloreada por umbral y badge si está superado.
    function renderPresupuestos(categorias, gastoPorCat, gastoHogarPorCat) {
      _presupUltimo = [categorias, gastoPorCat, gastoHogarPorCat];
      const card = $('dashPresupCard');
      const body = $('dashPresupBody');
      if (!card || !body) return;
      // Personal: categorias.limite_mensual. Hogar (solo con hogar): limite_mensual_hogar.
      const lista = (categorias || []).filter((c) => Number(c.limite_mensual) > 0);
      const hay = (typeof tieneHogar === 'function') && tieneHogar();
      const listaHogar = hay ? (categorias || []).filter((c) => Number(c.limite_mensual_hogar) > 0) : [];
      if (!lista.length && !listaHogar.length) { card.style.display = 'none'; return; }

      function fila(cat, limite, gastado, esHogar) {
        const est = (typeof estadoPresupuesto === 'function') ? estadoPresupuesto(gastado, limite) : null;
        if (!est) return '';
        // Validar el color como hex antes de interpolarlo en un style inline
        // (defensa: categorias.color es escribible vía API). Si no, champagne.
        const color = /^#[0-9a-fA-F]{3,8}$/.test(cat.color) ? cat.color : '#c9a84c';
        const icon = (typeof iconoCategoria === 'function') ? iconoCategoria(cat.icono) : '';
        const badge = est.superado ? '<span class="dash-presup-badge">superado</span>' : '';
        const tagHogar = esHogar ? '<span class="dash-badge dash-badge--hogar">Hogar</span>' : '';
        return `<div class="dash-presup">
          <span class="cat-chip" style="--chip-color:${color}" aria-hidden="true">${icon}</span>
          <div class="dash-presup-main">
            <div class="dash-presup-head">
              <span class="dash-presup-nombre">${esc(cat.nombre || 'Categoría')}</span>
              ${tagHogar}${badge}
            </div>
            <span class="dash-presup-cifras">${esc(formatMonto(gastado))} / ${esc(formatMonto(limite))}</span>
            <div class="dash-presup-bar" role="progressbar"
                 aria-valuenow="${est.ancho}" aria-valuemin="0" aria-valuemax="100"
                 aria-label="Presupuesto de ${esc(cat.nombre || 'categoría')}: ${est.pctReal}%">
              <div class="dash-presup-bar-fill dash-presup-bar-fill--${est.color}" style="width:${est.ancho}%;"></div>
            </div>
          </div>
        </div>`;
      }

      // Se normaliza a una sola lista para que el orden elegido mande sobre el
      // agrupado personal-primero. La fila de hogar ya se distingue por su badge.
      const todas = [
        ...lista.map((cat) => ({
          cat, limite: Number(cat.limite_mensual) || 0,
          gastado: Number((gastoPorCat || {})[cat.id] || 0), esHogar: false,
        })),
        ...listaHogar.map((cat) => ({
          cat, limite: Number(cat.limite_mensual_hogar) || 0,
          gastado: Number((gastoHogarPorCat || {})[cat.id] || 0), esHogar: true,
        })),
      ];
      const ordenadas = (typeof ordenarPresupuestos === 'function')
        ? ordenarPresupuestos(todas, _presupOrden.criterio, _presupOrden.direccion)
        : todas;

      body.innerHTML = ordenadas
        .map((f) => fila(f.cat, f.limite, f.gastado, f.esHogar)).join('');
      card.style.display = 'block';
    }

    // Estado del orden de la card. No se persiste entre sesiones a propósito
    // (YAGNI): es un dashboard que se mira de pasada, no una tabla de trabajo.
    var _presupOrden = { criterio: 'limite', direccion: 'desc' };
    var _presupUltimo = null; // últimos args de renderPresupuestos, para re-render

    (function initPresupOrden() {
      var sel = document.getElementById('presupSortCampo');
      var dir = document.getElementById('presupSortDir');
      if (!sel || !dir) return;
      function rerender() {
        if (!_presupUltimo) return;
        renderPresupuestos.apply(null, _presupUltimo);
      }
      sel.addEventListener('change', function () {
        _presupOrden.criterio = sel.value;
        rerender();
      });
      dir.addEventListener('click', function () {
        _presupOrden.direccion = (_presupOrden.direccion === 'desc') ? 'asc' : 'desc';
        dir.textContent = (_presupOrden.direccion === 'desc') ? '▼' : '▲';
        dir.setAttribute('aria-label',
          _presupOrden.direccion === 'desc' ? 'Orden descendente, cambiar a ascendente'
                                            : 'Orden ascendente, cambiar a descendente');
        rerender();
      });
    })();

    // ── Render: últimas transacciones ─────────────────────────
    function renderTransacciones(txs) {
      const body = $('dashTxBody');
      body.setAttribute('aria-busy', 'false');
      if (!txs || !txs.length) {
        body.innerHTML = (typeof renderEmptyState === 'function')
          ? renderEmptyState({
              icon: 'receipt-off',
              title: 'Aún no hay transacciones',
              desc: 'Registra tu primer gasto o ingreso para verlo aquí.',
              ctaLabel: 'Registrar', ctaHref: '#transaccion'
            })
          : '<p class="dash-empty">Aún no hay transacciones.</p>';
        return;
      }
      body.innerHTML = txs.map((t) => {
        const cat = t.categorias ? t.categorias.nombre : 'Sin categoría';
        const esIngreso = t.tipo === 'ingreso';
        const signo = esIngreso ? '+' : '−';
        const cls = esIngreso ? 'dash-tx-monto--ingreso' : 'dash-tx-monto--gasto';
        const mostrarBadge = (typeof tieneHogar === 'function') && tieneHogar();
        const badge = t.ambito === 'hogar' ? 'hogar' : 'personal';
        const badgeTxt = t.ambito === 'hogar' ? 'Hogar' : 'Personal';
        return `<div class="dash-tx">
          <div class="dash-tx-main">
            <span class="dash-tx-cat">${(typeof iconoCategoria === 'function') ? iconoCategoria(t.categorias ? t.categorias.icono : null) + ' ' : ''}${esc(cat)}</span>
            <span class="dash-tx-meta">
              ${mostrarBadge ? `<span class="dash-badge dash-badge--${badge}">${esc(badgeTxt)}</span>` : ''}
              ${esc(formatFecha(t.fecha))}
            </span>
          </div>
          <span class="dash-tx-monto ${cls}">${signo} ${esc(formatMonto(t.monto))}</span>
        </div>`;
      }).join('');
    }

    // ── Render: metas ─────────────────────────────────────────
    // El fondo de emergencia (es_fondo_emergencia) se muestra predominante,
    // sin barra (no tiene objetivo): solo el monto acumulado y su variación
    // porcentual del mes. Las metas normales (máx 3 en curso) llevan barra.
    // El progreso se actualiza solo (aportes/ahorros) — sin aporte manual.
    function renderMicroahorro(balancePersonal, metas) {
      var cont = $('brujulaMicroahorro');
      if (!cont || typeof sugerirMicroahorro !== 'function') return;
      var liquidez = Math.max(0, Number(balancePersonal.ingresos) - Number(balancePersonal.gastos));
      var s = sugerirMicroahorro(metas || [], liquidez, new Date());
      if (!s) { cont.hidden = true; return; }
      var offline = !navigator.onLine;
      cont.innerHTML = '<div class="dash-microahorro-txt">' + s.texto + '</div>' +
        '<button type="button" class="btn btn-primary" id="microApartar"' + (offline ? ' disabled' : '') + '>Apartar ' + formatMonto(s.sugerido) + '</button>' +
        (offline ? '<span class="dash-offline">Necesitas conexión para esto.</span>' : '');
      cont.hidden = false;
      var b = $('microApartar');
      if (b) b.addEventListener('click', async function () {
        b.disabled = true;
        try {
          await insertAporteDirecto(s.meta_id, s.sugerido);
          cont.innerHTML = '<div class="dash-microahorro-txt">Aporte de ' + formatMonto(s.sugerido) + ' registrado en ' + s.meta + '.</div>';
        } catch (err) { console.error('microahorro aporte:', err); b.disabled = false; }
      });
    }

    async function renderMetas(metas) {
      const body = $('dashMetasBody');
      body.setAttribute('aria-busy', 'false');
      const todas = metas || [];
      const fondos = todas.filter((m) => m.es_fondo_emergencia);
      const normales = todas
        .filter((m) => !m.es_fondo_emergencia && m.estado === 'en_curso')
        .slice(0, 3);

      if (!fondos.length && !normales.length) {
        body.innerHTML = '<p class="dash-empty">No tienes metas activas.</p>';
        return;
      }

      const fondosTiles = fondos.map((f) => {
        const total = Number(f.monto_actual) || 0;
        const ambito = f.ambito === 'hogar' ? 'Hogar' : 'Personal';
        const icono = (typeof iconoCategoria === 'function') ? iconoCategoria(f.ambito === 'hogar' ? 'home' : 'user') : '';
        return `<div class="dash-fondo">
          <span class="dash-fondo-label">${icono} Fondo · ${esc(ambito)}</span>
          <span class="dash-fondo-monto">${esc(formatMonto(total))}</span>
          <span class="dash-fondo-var" id="fondoVar-${esc(f.id)}"></span>
        </div>`;
      }).join('');
      const fondosHtml = fondos.length ? `<div class="dash-fondos">${fondosTiles}</div>` : '';

      const normalesHtml = normales.map((m) => {
        const obj = Number(m.monto_objetivo) || 0;
        const act = Number(m.monto_actual) || 0;
        const pct = obj > 0 ? Math.min(100, Math.round((act / obj) * 100)) : 0;
        const lograda = pct >= 100 ? ' dash-meta-bar-fill--lograda' : '';
        return `<div class="dash-meta">
          <div class="dash-meta-head">
            <span class="dash-meta-nombre">${esc(m.nombre)}</span>
            <span class="dash-meta-cifras">${esc(formatMonto(act))} / ${esc(formatMonto(obj))}</span>
          </div>
          <div class="dash-meta-bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="Progreso de ${esc(m.nombre)}">
            <div class="dash-meta-bar-fill${lograda}" style="width:${pct}%;"></div>
          </div>
          <div class="dash-meta-foot">
            <span class="dash-meta-pct">${pct}% completado</span>
          </div>
        </div>`;
      }).join('');

      body.innerHTML = fondosHtml + normalesHtml +
        (normales.length ? '<p class="dash-metas-auto">El progreso se actualiza solo con tus ahorros y aportes.</p>' : '');

      // Variación mensual de cada fondo (async, no bloquea el render).
      const { mes, anio } = mesActual();
      fondos.forEach(async (f) => {
        const el = document.getElementById('fondoVar-' + f.id);
        if (!el) return;
        try {
          const total = Number(f.monto_actual) || 0;
          const aporteMes = await getAporteMetaMes(f.id, mes, anio);
          const previo = total - aporteMes;
          if (aporteMes <= 0) {
            el.textContent = '0% mes';
            el.title = 'Sin movimientos este mes';
          } else if (previo <= 0) {
            el.textContent = '▲ nuevo';
            el.title = `+${formatMonto(aporteMes)} este mes`;
          } else {
            const pct = Math.max(1, Math.round((aporteMes / previo) * 100));
            el.textContent = `▲ +${pct}% mes`;
            el.title = `+${formatMonto(aporteMes)} este mes`;
          }
        } catch (err) {
          el.textContent = '';
        }
      });
    }

    // FAB global (index.html) ya maneja abrirModalTransaccion — no se registra aquí

    // ── Carga en paralelo (Promise.allSettled: una falla no tumba el resto) ──
    (async function cargar() {
      const [gastosHogar, personal, alertas, txs, metas, ahorroHogarAcum, acumPersonal, ahorrosHogar, ahorrosPersonal, insights, categoriasGasto, gastosCat, safeToSpend, gastosCatHogar] = await Promise.allSettled([
        getGastosHogar(mes, anio),
        getBalancePersonal(mes, anio),
        evaluarAlertas(mes, anio),
        getUltimasTransacciones(5),
        getMetas(),
        getAhorroHogarAcumulado(),
        getSaldoAcumuladoPersonal(),
        getAhorrosHogar(mes, anio),
        getAhorrosPersonal(mes, anio),
        cargarInsights(),
        getCategorias('gasto'),
        getGastosPorCategoriaMes(mes, anio),
        cargarSafeToSpend(),
        getGastoHogarPorCategoria(mes, anio),
      ]);

      const acumP = acumPersonal.status === 'fulfilled' ? acumPersonal.value : (personal.status === 'fulfilled' ? personal.value : { balance: 0 });
      const ahorHAcum = ahorroHogarAcum.status === 'fulfilled' ? ahorroHogarAcum.value : 0;
      const ahorH = ahorrosHogar.status === 'fulfilled' ? ahorrosHogar.value : 0;
      const ahorP = ahorrosPersonal.status === 'fulfilled' ? ahorrosPersonal.value : 0;

      if (gastosHogar.status === 'fulfilled') renderHogar(gastosHogar.value, ahorH, ahorHAcum);
      if (personal.status === 'fulfilled') renderPersonal(personal.value, acumP, ahorP);
      if (alertas.status === 'fulfilled')  renderAlertas(alertas.value);
      if (insights.status === 'fulfilled') renderInsights(insights.value);
      if (safeToSpend.status === 'fulfilled') renderSafeToSpend(safeToSpend.value);
      if (categoriasGasto.status === 'fulfilled') {
        const gMap  = gastosCat.status === 'fulfilled' ? gastosCat.value : {};
        const gMapH = gastosCatHogar.status === 'fulfilled' ? gastosCatHogar.value : {};
        renderPresupuestos(categoriasGasto.value, gMap, gMapH);
      }
      if (txs.status === 'fulfilled')      renderTransacciones(txs.value);
      if (metas.status === 'fulfilled')    renderMetas(metas.value);
      if (personal.status === 'fulfilled' && metas.status === 'fulfilled') {
        renderMicroahorro(personal.value, metas.value);
      }

      // Si TODO falló, es problema de conexión: avisar.
      const todoFallo = [gastosHogar, personal, alertas, txs, metas]
        .every((r) => r.status === 'rejected');
      if (todoFallo) $('dashConnError').style.display = 'flex';
    })();

    // Gating Fase 6.1: la card "Balance del hogar" solo si el usuario tiene hogar.
    (function aplicarGatingHogar() {
      function aplicar() {
        var card = document.getElementById('dashHogarCard');
        var hay = (typeof tieneHogar === 'function') && tieneHogar();
        if (card) card.style.display = hay ? '' : 'none';
      }
      aplicar();
      window.addEventListener('hogar:changed', aplicar);
    })();

    // ── Fase 6.3 — Desequilibrio de aportes (card solo si hay hogar) ──
    // Carga aparte: es opcional y no debe tumbar el resto del dashboard.
    async function cargarDesequilibrioHogar() {
      try {
        if (typeof tieneHogar === 'function' && !tieneHogar()) return;
        if (typeof getEstadoHogar !== 'function') return;
        const estado = await getEstadoHogar();
        if (!estado || !estado.hogar) return;
        const uid  = (window.currentUser && window.currentUser.id) || null;
        const miembros = estado.miembros || [];
        const creadorId = (miembros.find((m) => m.rol === 'creador') || {}).user_id || uid;
        const otro = (miembros.find((m) => m.user_id !== creadorId) || {}).user_id || null;
        if (!otro || typeof calcularDesequilibrioHogar !== 'function') return;
        const [txs, liqs] = await Promise.all([getTransacciones({}), getLiquidacionesHogar()]);
        const modo = (estado.hogar && estado.hogar.reparto) || '50_50';
        const objetivo = { modo };
        if (modo === 'proporcional') {
          const mA = miembros.find((m) => m.user_id === creadorId) || {};
          const mB = miembros.find((m) => m.user_id === otro) || {};
          objetivo.esperadoA = mA.aporte_esperado; objetivo.esperadoB = mB.aporte_esperado;
        }
        const deseq = calcularDesequilibrioHogar(txs, liqs, creadorId, otro, objetivo);
        const card = $('dashDeudaCard');
        const body = $('dashDeudaBody');
        if (!card || !body) return;
        if (deseq.brecha === 0) {
          body.innerHTML = '<p class="dash-neto-label">Van igual</p>';
        } else {
          const yoDeboMas = deseq.debeAportarMas === uid;
          body.innerHTML =
            '<div class="dash-neto"><div><span class="dash-neto-label">' +
              (yoDeboMas ? 'Deberías aportar más' : 'Tu pareja debería aportar más') + '</span></div>' +
            '<span class="dash-neto-value ' + netoClass(yoDeboMas ? -deseq.brecha : deseq.brecha) + '">' +
              esc(formatMonto(deseq.brecha)) + '</span></div>';
        }
        card.style.display = '';
      } catch (e) {
        // Hogar no disponible → no mostrar la card.
      }
    }
    cargarDesequilibrioHogar();
    // Sin esto la card dependía de una carrera: primeHogarState() dispara la
    // carga de hogarState sin await, y si su fetch no llegaba antes de que
    // corriera este script, tieneHogar() daba false y la card no se mostraba
    // hasta cambiar de sección y volver. Con el listener el orden deja de
    // importar. Idempotente: re-render con los mismos datos.
    //
    // El handler se guarda en window y se quita el de la visita anterior: el
    // router re-ejecuta este script en cada visita, y sin esto cada una dejaría
    // un listener extra vivo sobre window (que sobrevive al cambio de vista),
    // multiplicando las queries de este handler por cada visita. Misma fuga que
    // tenía subscribeHogar con su canal realtime.
    if (window._dashDeseqHandler) {
      window.removeEventListener('hogar:changed', window._dashDeseqHandler);
    }
    window._dashDeseqHandler = cargarDesequilibrioHogar;
    window.addEventListener('hogar:changed', window._dashDeseqHandler);
  })();
</script>
