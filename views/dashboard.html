<div class="container dashboard-container">
  <div class="header">
    <h1>Dashboard</h1>
    <p id="userGreeting">Bienvenido</p>
  </div>

  <!-- Balance Cards Grid -->
  <div class="cards-grid">
    <!-- Card 1: Balance del Hogar -->
    <div class="card">
      <h2>Balance del Hogar</h2>
      <div class="balance-row">
        <div class="balance-item">
          <label>Ingresos</label>
          <p class="balance-value">
            <span id="householdIncome">$0.00</span>
            <span id="householdIncomeSpinner" class="spinner" style="display: none;"></span>
          </p>
        </div>
        <div class="balance-item">
          <label>Gastos</label>
          <p class="balance-value">
            <span id="householdExpenses">$0.00</span>
            <span id="householdExpensesSpinner" class="spinner" style="display: none;"></span>
          </p>
        </div>
        <div class="balance-item">
          <label>Balance</label>
          <p class="balance-value balance-positive">
            <span id="householdBalance">$0.00</span>
            <span id="householdBalanceSpinner" class="spinner" style="display: none;"></span>
          </p>
        </div>
      </div>
    </div>

    <!-- Card 2: Tu Balance -->
    <div class="card">
      <h2>Tu Balance</h2>
      <div class="balance-row">
        <div class="balance-item">
          <label>Ingresos</label>
          <p class="balance-value">
            <span id="personalIncome">$0.00</span>
            <span id="personalIncomeSpinner" class="spinner" style="display: none;"></span>
          </p>
        </div>
        <div class="balance-item">
          <label>Gastos</label>
          <p class="balance-value">
            <span id="personalExpenses">$0.00</span>
            <span id="personalExpensesSpinner" class="spinner" style="display: none;"></span>
          </p>
        </div>
        <div class="balance-item">
          <label>Balance</label>
          <p class="balance-value balance-positive">
            <span id="personalBalance">$0.00</span>
            <span id="personalBalanceSpinner" class="spinner" style="display: none;"></span>
          </p>
        </div>
      </div>
    </div>
  </div>

  <!-- Add Transaction Button -->
  <button class="btn btn-primary btn-block" id="addTransactionBtn">+ Agregar Transacción</button>

  <!-- Latest Transactions -->
  <div class="card">
    <h2>Últimas Transacciones</h2>
    <div class="table-responsive">
      <table class="transactions-table">
        <thead>
          <tr>
            <th>Fecha</th>
            <th>Descripción</th>
            <th>Categoría</th>
            <th>Monto</th>
          </tr>
        </thead>
        <tbody id="transactionsBody">
          <tr>
            <td colspan="4" class="text-center">
              <span class="spinner"></span>
              <p>Cargando transacciones...</p>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Goals in Progress -->
  <div class="card">
    <h2>Metas en Progreso</h2>
    <div id="metasContainer">
      <div class="text-center">
        <span class="spinner"></span>
        <p>Cargando metas...</p>
      </div>
    </div>
  </div>

  <!-- Alerts Panel -->
  <div id="alertsPanel" class="alerts-panel"></div>
</div>

<style>
  .dashboard-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
  }

  .header {
    margin-bottom: 30px;
  }

  .header h1 {
    margin: 0 0 10px 0;
    font-size: 32px;
    color: #333;
  }

  .header p {
    margin: 0;
    color: #666;
    font-size: 16px;
  }

  .cards-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
    margin-bottom: 20px;
  }

  @media (min-width: 768px) {
    .cards-grid {
      grid-template-columns: 1fr 1fr;
    }
  }

  .card {
    background: white;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    padding: 20px;
  }

  .card h2 {
    margin: 0 0 20px 0;
    font-size: 18px;
    color: #333;
    border-bottom: 1px solid #eee;
    padding-bottom: 10px;
  }

  .balance-row {
    display: flex;
    justify-content: space-between;
    gap: 15px;
  }

  .balance-item {
    flex: 1;
    text-align: center;
  }

  .balance-item label {
    display: block;
    font-size: 12px;
    color: #999;
    margin-bottom: 8px;
    text-transform: uppercase;
    font-weight: 600;
  }

  .balance-value {
    margin: 0;
    font-size: 20px;
    font-weight: bold;
    color: #333;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .balance-positive {
    color: #28a745;
  }

  .btn {
    padding: 10px 20px;
    border: none;
    border-radius: 4px;
    font-size: 16px;
    cursor: pointer;
    transition: background-color 0.2s;
  }

  .btn-primary {

  }

  .btn-primary:disabled {

    cursor: not-allowed;
    opacity: 0.65;
  }

  .btn-block {
    width: 100%;
    display: block;
    margin-bottom: 20px;
  }

  .spinner {
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 2px solid rgba(0, 0, 0, 0.1);
    border-top-color: #007bff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }

  .table-responsive {
    overflow-x: auto;
  }

  .transactions-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
  }

  .transactions-table thead {
    background-color: #f8f9fa;
  }

  .transactions-table th {
    padding: 12px;
    text-align: left;
    font-weight: 600;
    color: #333;
    font-size: 13px;
    border-bottom: 1px solid #ddd;
  }

  .transactions-table td {
    padding: 12px;
    border-bottom: 1px solid #eee;
    font-size: 14px;
  }

  .transactions-table tbody tr:hover {
    background-color: #f8f9fa;
  }

  .text-center {
    text-align: center;
    color: #666;
  }

  .text-center p {
    margin: 10px 0 0 0;
  }

  .alerts-panel {
    margin-top: 20px;
  }

  .alert {
    padding: 12px;
    border-radius: 4px;
    margin-bottom: 10px;
    font-size: 14px;
  }

  .alert-info {
    background-color: #d1ecf1;
    color: #0c5460;
    border: 1px solid #bee5eb;
  }

  .alert-warning {
    background-color: #fff3cd;
    color: #856404;
    border: 1px solid #ffeaa7;
  }

  .alert-error {
    background-color: #f8d7da;
    color: #721c24;
    border: 1px solid #f5c6cb;
  }

  .alert-success {
    background-color: #d4edda;
    color: #155724;
    border: 1px solid #c3e6cb;
  }
</style>

<script>
  document.addEventListener('DOMContentLoaded', async function () {
    try {
      // Get user profile and set greeting
      const profile = await getProfile();
      if (profile && profile.email) {
        const greeting = document.getElementById('userGreeting');
        const firstName = profile.email.split('@')[0];
        greeting.textContent = `Bienvenido, ${firstName}`;
      }
    } catch (error) {
      console.error('Error loading profile:', error);
    }

    // Aquí irá la lógica de carga de datos en Fase 2

    // - Cargar metas en progreso

  });
</script>
