<div class="container dashboard-container">
  <div class="header">
    <h1>Dashboard</h1>
    <p id="userGreeting">Bienvenido</p>
  </div>

  <!-- Balance Cards Grid -->
  <div class="cards-grid">
    <!-- Card 1: Balance del Hogar -->
    <div class="card">
      <h2>Balance del Hogar</h2>
      <div class="balance-row">
        <div class="balance-item">
          <label>Ingresos</label>
          <p class="balance-value">
            <span id="householdIncome">$0.00</span>
            <span id="householdIncomeSpinner" class="spinner" style="display: none;" aria-hidden="true"></span>
          </p>
        </div>
        <div class="balance-item">
          <label>Gastos</label>
          <p class="balance-value">
            <span id="householdExpenses">$0.00</span>
            <span id="householdExpensesSpinner" class="spinner" style="display: none;" aria-hidden="true"></span>
          </p>
        </div>
        <div class="balance-item">
          <label>Balance</label>
          <p class="balance-value" id="householdBalance" data-balance>
            <span class="balance-amount">$0.00</span>
            <span id="householdBalanceSpinner" class="spinner" style="display: none;" aria-hidden="true"></span>
          </p>
        </div>
      </div>
    </div>

    <!-- Card 2: Tu Balance -->
    <div class="card">
      <h2>Tu Balance</h2>
      <div class="balance-row">
        <div class="balance-item">
          <label>Ingresos</label>
          <p class="balance-value">
            <span id="personalIncome">$0.00</span>
            <span id="personalIncomeSpinner" class="spinner" style="display: none;" aria-hidden="true"></span>
          </p>
        </div>
        <div class="balance-item">
          <label>Gastos</label>
          <p class="balance-value">
            <span id="personalExpenses">$0.00</span>
            <span id="personalExpensesSpinner" class="spinner" style="display: none;" aria-hidden="true"></span>
          </p>
        </div>
        <div class="balance-item">
          <label>Balance</label>
          <p class="balance-value" id="personalBalance" data-balance>
            <span class="balance-amount">$0.00</span>
            <span id="personalBalanceSpinner" class="spinner" style="display: none;" aria-hidden="true"></span>
          </p>
        </div>
      </div>
    </div>
  </div>

  <!-- Add Transaction Button -->
  <button class="btn btn-primary btn-block" id="addTransactionBtn">+ Agregar Transacción</button>

  <!-- Latest Transactions -->
  <div class="card">
    <h2>Últimas Transacciones</h2>
    <div class="table-responsive">
      <table class="transactions-table">
        <thead>
          <tr>
            <th>Fecha</th>
            <th>Descripción</th>
            <th>Categoría</th>
            <th>Monto</th>
          </tr>
        </thead>
        <tbody id="transactionsBody">
          <tr>
            <td colspan="4" class="text-center" aria-live="polite">
              <span class="spinner" aria-hidden="true"></span>
              <p>Cargando transacciones...</p>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Goals in Progress -->
  <div class="card">
    <h2>Metas en Progreso</h2>
    <div id="metasContainer" aria-live="polite">
      <div class="text-center">
        <span class="spinner" aria-hidden="true"></span>
        <p>Cargando metas...</p>
      </div>
    </div>
  </div>

  <!-- Alerts Panel -->
  <div id="alertsPanel" class="alerts-panel"></div>
</div>

<style>
  /* Dashboard view — layout only; colors/components come from tokens */
  .dashboard-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: var(--space-lg);
  }

  .header {
    margin-bottom: var(--space-xl);
  }

  .header h1 {
    margin: 0 0 var(--space-sm);
    font-size: var(--font-size-2xl);
    color: var(--text-dark);
  }

  .header p {
    margin: 0;
    color: var(--text-secondary);
    font-size: var(--font-size-base);
  }

  .cards-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: var(--space-lg);
    margin-bottom: var(--space-lg);
  }

  @media (min-width: 768px) {
    .cards-grid {
      grid-template-columns: 1fr 1fr;
    }
  }

  /* Dashboard cards: no hover lift (they're informational, not clickable) */
  .dashboard-container .card:hover {
    transform: none;
    box-shadow: var(--shadow-md);
  }

  .dashboard-container .card h2 {
    margin: 0 0 var(--space-md);
    font-size: var(--font-size-lg);
    color: var(--text-dark);
    border-bottom: 1px solid var(--border-light);
    padding-bottom: var(--space-sm);
  }

  .balance-row {
    display: flex;
    justify-content: space-between;
    gap: var(--space-md);
  }

  .balance-item {
    flex: 1;
    text-align: center;
  }

  .balance-item label {
    display: block;
    font-size: var(--font-size-xs);
    color: var(--text-secondary);
    margin-bottom: var(--space-sm);
    text-transform: uppercase;
    font-weight: var(--font-weight-semibold);
    letter-spacing: 0.5px;
  }

  .balance-value {
    margin: 0;
    font-size: var(--font-size-xl);
    font-weight: var(--font-weight-bold);
    color: var(--text-dark);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-sm);
  }

  /* Balance sign — not color-only: prepend an arrow glyph (WCAG 1.4.1) */
  .balance-value--positive {
    color: var(--color-success);
  }

  .balance-value--negative {
    color: var(--color-danger);
  }

  .balance-value--positive .balance-amount::before {
    content: "▲ ";
    font-size: 0.7em;
  }

  .balance-value--negative .balance-amount::before {
    content: "▼ ";
    font-size: 0.7em;
  }

  /* Spinners scoped smaller than the global 40px default */
  .dashboard-container .spinner {
    width: 24px;
    height: 24px;
    border-width: 2px;
  }

  .balance-value .spinner {
    width: 16px;
    height: 16px;
  }

  .transactions-table {
    margin-top: var(--space-sm);
  }

  .alerts-panel {
    margin-top: var(--space-lg);
  }
</style>

<script>
  // IIFE runs immediately on injection (DOMContentLoaded already fired by now).
  (function () {
    try {
      const user = getCurrentUser();
      const profile = getCurrentProfile();
      const greeting = document.getElementById('userGreeting');
      const nombre = (profile && profile.nombre) || (user && user.email ? user.email.split('@')[0] : '');
      if (nombre) {
        greeting.textContent = `Bienvenido, ${nombre}`;
      }
    } catch (error) {
      console.error('Error loading profile:', error);
    }

    // setBalance(el, amount) — render a balance value with sign-aware styling.
    // Adds ▲/▼ glyph + color so meaning isn't conveyed by color alone (WCAG 1.4.1).
    // Phase 2 data loaders should call this instead of writing textContent directly.
    window.setBalance = function (elId, amount) {
      const el = document.getElementById(elId);
      if (!el) return;
      const amountEl = el.querySelector('.balance-amount') || el;
      const formatted = (typeof formatCurrency === 'function')
        ? formatCurrency(amount)
        : `$${Number(amount).toFixed(2)}`;
      amountEl.textContent = formatted;
      el.classList.remove('balance-value--positive', 'balance-value--negative');
      if (amount > 0) {
        el.classList.add('balance-value--positive');
        el.setAttribute('aria-label', `Balance positivo: ${formatted}`);
      } else if (amount < 0) {
        el.classList.add('balance-value--negative');
        el.setAttribute('aria-label', `Balance negativo: ${formatted}`);
      } else {
        el.removeAttribute('aria-label');
      }
    };

    // Aquí irá la lógica de carga de datos en Fase 2
    // - Cargar balance del hogar  -> setBalance('householdBalance', monto)
    // - Cargar tu balance         -> setBalance('personalBalance', monto)
    // - Cargar últimas transacciones
    // - Cargar metas en progreso
    // - Mostrar alertas dinámicas
  })();
</script>
