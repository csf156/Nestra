<div class="container dashboard-container">
  <div class="header">
    <h1>Dashboard</h1>
    <p id="userGreeting">Bienvenido</p>
  </div>

  <!-- Balance Cards Grid -->
  <div class="cards-grid">
    <!-- Card 1: Balance del Hogar -->
    <div class="card">
      <h2>Balance del Hogar</h2>
      <div class="balance-row">
        <div class="balance-item">
          <label>Ingresos</label>
          <p class="balance-value">
            <span id="householdIncome">$0.00</span>
            <span id="householdIncomeSpinner" class="spinner" style="display: none;" aria-hidden="true"></span>
          </p>
        </div>
        <div class="balance-item">
          <label>Gastos</label>
          <p class="balance-value">
            <span id="householdExpenses">$0.00</span>
            <span id="householdExpensesSpinner" class="spinner" style="display: none;" aria-hidden="true"></span>
          </p>
        </div>
        <div class="balance-item">
          <label>Balance</label>
          <p class="balance-value" id="householdBalance" data-balance>
            <span class="balance-amount">$0.00</span>
            <span id="householdBalanceSpinner" class="spinner" style="display: none;" aria-hidden="true"></span>
          </p>
        </div>
      </div>
    </div>

    <!-- Card 2: Tu Balance -->
    <div class="card">
      <h2>Tu Balance</h2>
      <div class="balance-row">
        <div class="balance-item">
          <label>Ingresos</label>
          <p class="balance-value">
            <span id="personalIncome">$0.00</span>
            <span id="personalIncomeSpinner" class="spinner" style="display: none;" aria-hidden="true"></span>
          </p>
        </div>
        <div class="balance-item">
          <label>Gastos</label>
          <p class="balance-value">
            <span id="personalExpenses">$0.00</span>
            <span id="personalExpensesSpinner" class="spinner" style="display: none;" aria-hidden="true"></span>
          </p>
        </div>
        <div class="balance-item">
          <label>Balance</label>
          <p class="balance-value" id="personalBalance" data-balance>
            <span class="balance-amount">$0.00</span>
            <span id="personalBalanceSpinner" class="spinner" style="display: none;" aria-hidden="true"></span>
          </p>
        </div>
      </div>
    </div>
  </div>

  <!-- Add Transaction Button -->
  <button class="btn btn-primary btn-block" id="addTransactionBtn">+ Agregar Transacción</button>

  <!-- Latest Transactions -->
  <div class="card">
    <h2>Últimas Transacciones</h2>
    <div class="table-responsive">
      <table class="transactions-table">
        <thead>
          <tr>
            <th>Fecha</th>
            <th>Descripción</th>
            <th>Categoría</th>
            <th>Monto</th>
          </tr>
        </thead>
        <tbody id="transactionsBody">
          <tr>
            <td colspan="4" class="text-center" aria-live="polite">
              <span class="spinner" aria-hidden="true"></span>
              <p>Cargando transacciones...</p>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Goals in Progress -->
  <div class="card">
    <h2>Metas en Progreso</h2>
    <div id="metasContainer" aria-live="polite">
      <div class="text-center">
        <span class="spinner" aria-hidden="true"></span>
        <p>Cargando metas...</p>
      </div>
    </div>
  </div>

  <!-- Alerts Panel -->
  <div id="alertsPanel" class="alerts-panel"></div>
</div>

<style>
  /* Dashboard view — layout only; colors/components come from tokens */
  .dashboard-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: var(--space-lg);
  }

  .header {
    margin-bottom: var(--space-xl);
  }

  .header h1 {
    margin: 0 0 var(--space-sm);
    font-size: var(--font-size-2xl);
    color: var(--text-dark);
  }

  .header p {
    margin: 0;
    color: var(--text-secondary);
    font-size: var(--font-size-base);
  }

  .cards-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: var(--space-lg);
    margin-bottom: var(--space-lg);
  }

  @media (min-width: 768px) {
    .cards-grid {
      grid-template-columns: 1fr 1fr;
    }
  }

  /* Dashboard cards: no hover lift (they're informational, not clickable) */
  .dashboard-container .card:hover {
    transform: none;
    box-shadow: var(--shadow-md);
  }

  .dashboard-container .card h2 {
    margin: 0 0 var(--space-md);
    font-size: var(--font-size-lg);
    color: var(--text-dark);
    border-bottom: 1px solid var(--border-light);
    padding-bottom: var(--space-sm);
  }

  .balance-row {
    display: flex;
    justify-content: space-between;
    gap: var(--space-md);
  }

  .balance-item {
    flex: 1;
    text-align: center;
  }

  .balance-item label {
    display: block;
    font-size: var(--font-size-xs);
    color: var(--text-secondary);
    margin-bottom: var(--space-sm);
    text-transform: uppercase;
    font-weight: var(--font-weight-semibold);
    letter-spacing: 0.5px;
  }

  .balance-value {
    margin: 0;
    font-size: var(--font-size-xl);
    font-weight: var(--font-weight-bold);
    color: var(--text-dark);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-sm);
  }

  /* Balance sign — not color-only: prepend an arrow glyph (WCAG 1.4.1) */
  .balance-value--positive {
    color: var(--color-success);
  }

  .balance-value--negative {
    color: var(--color-danger);
  }

  .balance-value--positive .balance-amount::before {
    content: "▲ ";
    font-size: 0.7em;
  }

  .balance-value--negative .balance-amount::before {
    content: "▼ ";
    font-size: 0.7em;
  }

  /* Spinners scoped smaller than the global 40px default */
  .dashboard-container .spinner {
    width: 24px;
    height: 24px;
    border-width: 2px;
  }

  .balance-value .spinner {
    width: 16px;
    height: 16px;
  }

  .transactions-table {
    margin-top: var(--space-sm);
  }

  .alerts-panel {
    margin-top: var(--space-lg);
  }
</style>

<style>
  /* Panel de alertas — variantes por nivel */
  .alert-item {
    display: flex;
    align-items: flex-start;
    gap: var(--space-sm);
    padding: var(--space-md);
    border-radius: var(--radius-md);
    margin-bottom: var(--space-sm);
    border-left: 4px solid var(--border-light);
    background: var(--bg-light-secondary);
    color: var(--text-dark);
  }
  .alert-item--critica { border-left-color: var(--color-danger); }
  .alert-item--suave   { border-left-color: var(--color-warning); }
  .alert-item--positiva { border-left-color: var(--color-success); }
  .alert-item .alert-icon { flex-shrink: 0; }

  /* Metas — barra de progreso */
  .meta-item { margin-bottom: var(--space-md); }
  .meta-item:last-child { margin-bottom: 0; }
  .meta-head {
    display: flex;
    justify-content: space-between;
    gap: var(--space-sm);
    margin-bottom: var(--space-xs);
    font-size: var(--font-size-sm);
  }
  .meta-nombre { font-weight: var(--font-weight-semibold); color: var(--text-dark); }
  .meta-cifras { color: var(--text-secondary); white-space: nowrap; }
  .meta-bar {
    height: 8px;
    background: var(--border-light);
    border-radius: var(--radius-sm);
    overflow: hidden;
  }
  .meta-bar-fill {
    height: 100%;
    background: var(--color-primary);
    border-radius: var(--radius-sm);
    transition: width 0.3s;
  }
  .meta-bar-fill--lograda { background: var(--color-success); }

  /* Montos en tabla con signo */
  .monto-ingreso { color: var(--color-success); }
  .monto-gasto   { color: var(--color-danger); }
  .text-muted { color: var(--text-secondary); }
</style>

<script>
  // IIFE runs immediately on injection (DOMContentLoaded already fired by now).
  (function () {
    // ── Saludo ──────────────────────────────────────────────────
    try {
      const user = getCurrentUser();
      const profile = getCurrentProfile();
      const greeting = document.getElementById('userGreeting');
      const nombre = (profile && profile.nombre) || (user && user.email ? user.email.split('@')[0] : '');
      if (nombre) greeting.textContent = `Bienvenido, ${nombre}`;
    } catch (error) {
      console.error('Error loading profile:', error);
    }

    // ── Botón "Agregar Transacción" ─────────────────────────────
    const addBtn = document.getElementById('addTransactionBtn');
    if (addBtn) addBtn.addEventListener('click', () => {
      if (typeof abrirModalTransaccion === 'function') {
        abrirModalTransaccion();
      } else {
        window.location.hash = '#transaccion';
      }
    });

    // setBalance(elId, amount) — balance con signo accesible (▲/▼ + color).
    // El glifo evita transmitir el significado solo por color (WCAG 1.4.1).
    function setBalance(elId, amount) {
      const el = document.getElementById(elId);
      if (!el) return;
      const amountEl = el.querySelector('.balance-amount') || el;
      const formatted = formatMonto(amount);
      amountEl.textContent = formatted;
      el.classList.remove('balance-value--positive', 'balance-value--negative');
      if (amount > 0) {
        el.classList.add('balance-value--positive');
        el.setAttribute('aria-label', `Balance positivo: ${formatted}`);
      } else if (amount < 0) {
        el.classList.add('balance-value--negative');
        el.setAttribute('aria-label', `Balance negativo: ${formatted}`);
      } else {
        el.removeAttribute('aria-label');
      }
    }

    // setText(id, valor) — escribe texto plano en un elemento por id.
    function setText(id, valor) {
      const el = document.getElementById(id);
      if (el) el.textContent = valor;
    }

    // esc(s) — escapa texto para inyección segura en innerHTML.
    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // ── Balances del mes actual ─────────────────────────────────
    async function cargarBalances() {
      const { mes, anio } = mesActual();
      try {
        const [hogar, personal] = await Promise.all([
          getBalanceHogar(mes, anio),
          getBalancePersonal(mes, anio),
        ]);
        setText('householdIncome', formatMonto(hogar.ingresos));
        setText('householdExpenses', formatMonto(hogar.gastos));
        setBalance('householdBalance', hogar.balance);
        setText('personalIncome', formatMonto(personal.ingresos));
        setText('personalExpenses', formatMonto(personal.gastos));
        setBalance('personalBalance', personal.balance);
      } catch (err) {
        console.error('Error cargando balances:', err);
      }
    }

    // ── Últimas transacciones ───────────────────────────────────
    async function cargarUltimas() {
      const tbody = document.getElementById('transactionsBody');
      try {
        const txs = await getUltimasTransacciones(5);
        if (!txs.length) {
          tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted">Sin transacciones aún.</td></tr>';
          return;
        }
        tbody.innerHTML = txs.map((t) => {
          const cat = t.categorias ? t.categorias.nombre : '—';
          const signo = t.tipo === 'ingreso' ? '+' : '−';
          const cls = t.tipo === 'ingreso' ? 'monto-ingreso' : 'monto-gasto';
          return `<tr>
            <td>${esc(formatFecha(t.fecha))}</td>
            <td>${esc(t.nota || '—')}</td>
            <td>${esc(cat)}</td>
            <td class="${cls}">${signo} ${esc(formatMonto(t.monto))}</td>
          </tr>`;
        }).join('');
      } catch (err) {
        console.error('Error cargando transacciones:', err);
        tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted">Error al cargar transacciones.</td></tr>';
      }
    }

    // ── Metas en progreso ───────────────────────────────────────
    async function cargarMetas() {
      const cont = document.getElementById('metasContainer');
      try {
        const metas = (await getMetas()).filter((m) => m.estado === 'en_curso');
        if (!metas.length) {
          cont.innerHTML = '<p class="text-muted text-center">No hay metas en progreso.</p>';
          return;
        }
        cont.innerHTML = metas.map((m) => {
          const obj = Number(m.monto_objetivo) || 0;
          const act = Number(m.monto_actual) || 0;
          const pct = obj > 0 ? Math.min(100, Math.round((act / obj) * 100)) : 0;
          const lograda = pct >= 100 ? ' meta-bar-fill--lograda' : '';
          return `<div class="meta-item">
            <div class="meta-head">
              <span class="meta-nombre">${esc(m.nombre)}</span>
              <span class="meta-cifras">${esc(formatMonto(act))} / ${esc(formatMonto(obj))} (${pct}%)</span>
            </div>
            <div class="meta-bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100">
              <div class="meta-bar-fill${lograda}" style="width: ${pct}%;"></div>
            </div>
          </div>`;
        }).join('');
      } catch (err) {
        console.error('Error cargando metas:', err);
        cont.innerHTML = '<p class="text-muted text-center">Error al cargar metas.</p>';
      }
    }

    // ── Panel de alertas ────────────────────────────────────────
    async function cargarAlertas() {
      const panel = document.getElementById('alertsPanel');
      try {
        const alertas = await evaluarAlertas();
        if (!alertas.length) { panel.innerHTML = ''; return; }
        panel.innerHTML = alertas.map((a) => `
          <div class="alert-item alert-item--${esc(a.nivel)}" role="status">
            <span class="alert-icon" aria-hidden="true">${esc(a.icono)}</span>
            <span>${esc(a.mensaje)}</span>
          </div>`).join('');
      } catch (err) {
        console.error('Error cargando alertas:', err);
      }
    }

    // Carga en paralelo (cada loader maneja su propio error).
    cargarBalances();
    cargarUltimas();
    cargarMetas();
    cargarAlertas();
  })();
</script>
