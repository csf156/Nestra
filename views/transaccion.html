<div class="container tx-container">
  <div class="tx-header">
    <div class="tx-header-row">
      <div>
        <h1 id="transaccionModalTitle">Nueva transacción</h1>
        <p>Registra un ingreso, gasto o ahorro</p>
      </div>
      <!-- Botón X: solo visible en modo modal; siempre accesible aunque el
           teclado virtual reduzca el viewport y el Cancel inferior quede bajo el fold -->
      <button type="button" id="txCloseBtn" class="tx-close-btn"
              aria-label="Cerrar" style="display:none">
        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor"
             stroke-width="2.5" stroke-linecap="round" fill="none" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="card tx-card">

    <!-- ── Panel rápido (entrada principal) ───────────────────────── -->
    <div id="txQuickPanel" class="tx-quick" style="display:none;">
      <label for="txQuickInput" class="tx-quick-label">Registro rápido</label>
      <div class="tx-quick-row">
        <input type="text" id="txQuickInput" class="tx-quick-input" autocomplete="off"
               inputmode="text" placeholder='Ej: "Uber 15", "ahorro hogar 50", "ingreso trabajo 100"'
               aria-label="Registro rápido de transacción" />
        <button type="button" id="txQuickAdd" class="btn btn-primary tx-quick-add">Agregar</button>
      </div>
      <div id="txQuickChips" class="tx-plantillas" aria-label="Plantillas"></div>
      <p id="txQuickError" class="form-error" role="alert" style="display:none;"></p>
      <button type="button" id="txQuickMas" class="tx-quick-mas">Más opciones (formulario completo)</button>
    </div>
    <div id="txQuickConfirm" class="tx-quick-confirm" style="display:none;" aria-live="polite">
      <div class="tx-quick-confirm-check" aria-hidden="true"><svg class="cat-icono"><use href="assets/tabler-sprite.svg#tabler-circle-check"></use></svg></div>
      <p id="txQuickConfirmMsg" class="tx-quick-confirm-msg"></p>
      <div id="txQuickEditCat" style="display:none; margin:var(--space-sm) 0;">
        <select id="txQuickEditSelect" class="cfg-select"></select>
      </div>
      <div class="tx-quick-confirm-actions">
        <button type="button" id="txQuickUndo" class="btn btn-secondary btn-sm">Deshacer</button>
        <button type="button" id="txQuickEditBtn" class="btn btn-secondary btn-sm">Editar categoría</button>
        <button type="button" id="txQuickDone" class="btn btn-primary btn-sm">Listo</button>
      </div>
    </div>

    <!-- ── Pantalla de éxito (oculta hasta guardar) ─────────────── -->
    <div id="txExito" class="tx-exito" style="display:none;" aria-live="polite">
      <div class="tx-exito-icon" aria-hidden="true"><svg class="cat-icono"><use href="assets/tabler-sprite.svg#tabler-circle-check"></use></svg></div>
      <p class="tx-exito-msg">Transacción guardada</p>
      <div id="txAlertaPost" style="display:none; margin-top: var(--space-md);"></div>
      <button type="button" class="btn btn-primary" id="txExitoContinuar"
              style="margin-top: var(--space-lg); min-width: 140px;">Continuar</button>
    </div>

    <!-- ── Formulario ────────────────────────────────────────────── -->
    <form id="transaccionForm" novalidate>
      <!-- Preview de captura compartida (Web Share Target) -->
      <div id="txSharePreview" class="tx-share-preview" style="display:none;">
        <img id="txShareImg" alt="Captura compartida" />
        <p class="form-hint">Captura recibida. Verifica el monto detectado o ingrésalo manualmente.</p>
      </div>

      <!-- Tipo -->
      <div class="form-group tx-toggle-group">
        <label>Tipo</label>
        <div class="tx-toggle" role="group" aria-label="Tipo de transacción">
          <button type="button" class="tx-toggle-btn tx-toggle-btn--gasto tx-active"
                  id="btnTipoGasto" aria-pressed="true">
            <span class="tx-toggle-icon" aria-hidden="true">↑</span> Gasto
          </button>
          <button type="button" class="tx-toggle-btn tx-toggle-btn--ingreso"
                  id="btnTipoIngreso" aria-pressed="false">
            <span class="tx-toggle-icon" aria-hidden="true">↓</span> Ingreso
          </button>
          <button type="button" class="tx-toggle-btn tx-toggle-btn--ahorro"
                  id="btnTipoAhorro" aria-pressed="false">
            <span class="tx-toggle-icon" aria-hidden="true"><svg class="cat-icono"><use href="assets/tabler-sprite.svg#tabler-pig-money"></use></svg></span> Ahorro
          </button>
        </div>
        <input type="hidden" id="tipo" value="gasto">
      </div>

      <!-- Plantillas de 1 toque -->
      <div id="txPlantillas" class="tx-plantillas" aria-label="Plantillas"></div>

      <!-- Ámbito -->
      <div class="form-group tx-toggle-group">
        <label>Ámbito</label>
        <div class="tx-toggle" role="group" aria-label="Ámbito de la transacción">
          <button type="button" class="tx-toggle-btn tx-active"
                  id="btnAmbitoPersonal" aria-pressed="true">Personal</button>
          <button type="button" class="tx-toggle-btn"
                  id="btnAmbitoHogar" aria-pressed="false">Hogar</button>
        </div>
        <input type="hidden" id="ambito" value="personal">
      </div>

      <!-- Categoría -->
      <div class="form-group" id="categoriaGroup">
        <label for="categoria">Categoría</label>
        <select id="categoria" name="categoria" required>
          <option value="">Cargando categorías...</option>
        </select>
        <span id="categoriaIcono" class="tx-cat-icono" aria-hidden="true"></span>
        <span id="categoriaError" class="form-error" role="alert" style="display:none;"></span>
      </div>

      <!-- Mini-form: nueva categoría al vuelo -->
      <div id="nuevaCatGroup" class="form-group nueva-cat-group"
           style="display:none;" role="group" aria-label="Nueva categoría">
        <label for="nuevaCatNombre">Nombre de la nueva categoría</label>
        <div class="nueva-cat-row">
          <input type="text" id="nuevaCatNombre" name="nuevaCatNombre"
                 placeholder="Ej: Suscripciones" maxlength="60"
                 autocomplete="off" aria-required="true" />
          <button type="button" class="btn btn-primary btn-small"
                  id="nuevaCatGuardar">Crear</button>
          <button type="button" class="btn btn-secondary btn-small"
                  id="nuevaCatCancelar" aria-label="Cancelar nueva categoría"><svg class="cat-icono"><use href="assets/tabler-sprite.svg#tabler-x"></use></svg></button>
        </div>
        <span id="nuevaCatError" class="form-error" role="alert" style="display:none;"></span>
      </div>

      <!-- Monto + Fecha -->
      <div class="tx-row">
        <div class="form-group">
          <label for="monto">Monto</label>
          <div class="tx-monto-wrap">
            <span class="tx-currency" aria-hidden="true">S/</span>
            <input type="number" id="monto" name="monto" step="0.01" min="0.01"
                   inputmode="decimal" placeholder="0.00" required />
          </div>
          <span id="montoError" class="form-error" role="alert" style="display:none;"></span>
        </div>

        <div class="form-group">
          <label for="fecha">Fecha</label>
          <input type="date" id="fecha" name="fecha" required />
        </div>
      </div>

      <!-- Split: dividir en varias categorías -->
      <div class="form-group tx-split-toggle">
        <label><input type="checkbox" id="txSplitOn"> Dividir en varias categorías</label>
      </div>
      <div id="txSplitBox" class="tx-split-box" style="display:none;">
        <div id="txSplitLineas"></div>
        <button type="button" class="btn btn-secondary btn-small" id="txSplitAdd">+ Línea</button>
        <p class="form-hint">Suma líneas: <span id="txSplitSuma">0.00</span> / <span id="txSplitTotal">0.00</span></p>
        <span id="txSplitError" class="form-error" role="alert" style="display:none;"></span>
      </div>

      <!-- Préstamo: deudor + estado (condicional) -->
      <div id="prestamoGroup" class="form-group tx-prestamo-group"
           style="display:none;" aria-live="polite">
        <div class="tx-section-label">Datos del préstamo</div>
        <div class="tx-row">
          <div class="form-group" style="margin-bottom:0;">
            <label for="deudor">¿A quién le prestas?</label>
            <input type="text" id="deudor" name="deudor" maxlength="120"
                   placeholder="Nombre del deudor" autocomplete="off" />
            <span id="deudorError" class="form-error" role="alert" style="display:none;"></span>
          </div>
          <div class="form-group" style="margin-bottom:0;">
            <label for="estadoPrestamo">Estado</label>
            <select id="estadoPrestamo" name="estadoPrestamo">
              <option value="pendiente">Pendiente</option>
              <option value="devuelto">Devuelto</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Aporte al hogar (condicional) -->
      <div id="aporteHogarGroup" class="form-group aporte-hogar-group"
           style="display:none;" aria-live="polite">
        <label class="checkbox-label">
          <input type="checkbox" id="aporteHogar" name="aporteHogar" />
          <span>Registrar como aporte al hogar</span>
        </label>
        <p class="form-hint">Crea dos transacciones vinculadas: tu gasto y el ingreso del hogar.</p>
      </div>

      <!-- Nota -->
      <div class="form-group">
        <label for="nota">Nota <span class="label-opcional">(opcional)</span></label>
        <textarea id="nota" name="nota" rows="2" placeholder="Descripción libre..."></textarea>
      </div>

      <!-- Recibo -->
      <div class="form-group">
        <label for="reciboFile">Recibo <span class="label-opcional">(opcional)</span></label>
        <input type="file" id="reciboFile" accept="image/*" capture="environment">
        <img id="reciboPreview" class="recibo-preview" alt="Vista previa del recibo" style="display:none;">
      </div>

      <!-- Error general -->
      <div id="formError" class="alert error" role="alert"
           aria-live="assertive" style="display:none;"></div>

      <!-- Acciones -->
      <div class="transaccion-actions">
        <button type="button" class="btn btn-secondary" id="cancelarBtn">Cancelar</button>
        <button type="submit" class="btn btn-primary" id="guardarBtn">
          <span id="guardarText">Guardar</span>
          <span id="guardarSpinner" class="spinner" role="status"
                aria-label="Guardando" style="display:none;"></span>
        </button>
      </div>
    </form>
  </div>
</div>

<style>
  /* mobile-first: padding compacto, se expande en pantallas mayores */
  .tx-container {
    max-width: 560px;
    margin: 0 auto;
    padding: var(--space-md);
  }
  @media (min-width: 480px) {
    .tx-container { padding: var(--space-lg); }
  }

  .tx-header {
    margin-bottom: var(--space-lg);
  }
  .tx-header-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: var(--space-sm);
  }
  .tx-header h1 {
    margin: 0 0 var(--space-xs);
    font-size: var(--font-size-2xl);
    font-weight: var(--font-weight-bold);
    color: var(--text-dark);
  }
  .tx-header p {
    margin: 0;
    color: var(--text-secondary);
    font-size: var(--font-size-sm);
  }
  .tx-close-btn {
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    background: var(--bg-light-secondary);
    color: var(--text-secondary);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, color 0.15s;
  }
  .tx-close-btn:hover {
    background: var(--border-light);
    color: var(--text-dark);
  }

  .tx-card:hover {
    transform: none;
    box-shadow: var(--shadow-md);
  }

  /* ── Pill toggles ────────────────────────────────────────── */
  .tx-toggle-group label {
    display: block;
    font-size: var(--font-size-sm);
    font-weight: var(--font-weight-semibold);
    color: var(--text-secondary);
    margin-bottom: var(--space-sm);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  /* mobile: ocupa todo el ancho, botones iguales */
  .tx-toggle {
    display: flex;
    gap: 0;
    border: 1px solid var(--border-light);
    border-radius: var(--radius-md);
    overflow: hidden;
    width: 100%;
  }
  @media (min-width: 480px) {
    .tx-toggle { width: fit-content; }
  }
  .tx-toggle-btn {
    flex: 1;
    min-width: 0;
    padding: var(--space-sm) var(--space-xs);
    font-size: var(--font-size-sm);
    font-weight: var(--font-weight-semibold);
    background: var(--bg-light);
    color: var(--text-secondary);
    border: none;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-xs);
    white-space: nowrap;
  }
  @media (min-width: 480px) {
    .tx-toggle-btn {
      flex: none;
      padding: var(--space-sm) var(--space-lg);
    }
  }
  .tx-toggle-btn + .tx-toggle-btn {
    border-left: 1px solid var(--border-light);
  }
  .tx-toggle-btn.tx-active {
    background: var(--color-primary);
    color: var(--bg-light);
  }
  .tx-toggle-btn--gasto.tx-active {
    background: var(--color-danger);
  }
  .tx-toggle-btn--ingreso.tx-active {
    background: var(--color-success);
  }
  .tx-toggle-btn--ahorro.tx-active {
    background: var(--color-info);
  }
  .tx-toggle-btn:focus-visible {
    outline: 2px solid var(--color-primary);
    outline-offset: 2px;
    z-index: 1;
    position: relative;
  }
  .tx-toggle-icon {
    font-size: 1.1em;
    line-height: 1;
  }

  /* ── Monto con prefijo ───────────────────────────────────── */
  .tx-monto-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }
  .tx-currency {
    position: absolute;
    left: var(--space-md);
    color: var(--text-secondary);
    font-weight: var(--font-weight-semibold);
    font-size: var(--font-size-base);
    pointer-events: none;
    user-select: none;
  }
  .tx-monto-wrap input {
    padding-left: 2.75rem;
    width: 100%;
  }

  /* mobile-first: 1 columna por defecto, 2 en pantallas ≥ 480px */
  .tx-row {
    display: grid;
    grid-template-columns: 1fr;
    gap: var(--space-md);
  }
  @media (min-width: 480px) {
    .tx-row { grid-template-columns: 1fr 1fr; }
  }

  /* ── Sección préstamo ────────────────────────────────────── */
  .tx-prestamo-group {
    background: var(--bg-light-secondary);
    border: 1px solid var(--border-light);
    border-left: 3px solid var(--color-warning);
    border-radius: var(--radius-md);
    padding: var(--space-md);
    animation: txSlideDown 0.2s ease-out;
  }
  .tx-section-label {
    font-size: var(--font-size-xs);
    font-weight: var(--font-weight-semibold);
    color: var(--color-warning);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: var(--space-md);
  }

  /* ── Aporte hogar ────────────────────────────────────────── */
  .aporte-hogar-group {
    background: var(--bg-light-secondary);
    border: 1px solid var(--border-light);
    border-left: 3px solid var(--color-primary);
    border-radius: var(--radius-md);
    padding: var(--space-md);
    animation: txSlideDown 0.2s ease-out;
  }
  .checkbox-label {
    display: flex;
    align-items: center;
    gap: var(--space-sm);
    cursor: pointer;
    font-weight: var(--font-weight-semibold);
    color: var(--text-dark);
  }
  .checkbox-label input[type="checkbox"] {
    width: 18px;
    height: 18px;
    accent-color: var(--color-primary);
    cursor: pointer;
    flex-shrink: 0;
  }
  .form-hint {
    margin: var(--space-xs) 0 0;
    font-size: var(--font-size-xs);
    color: var(--text-secondary);
  }
  .nueva-cat-group .form-hint { font-size: var(--font-size-xs); }

  /* ── Nueva categoría ─────────────────────────────────────── */
  .nueva-cat-group {
    background: var(--bg-light-secondary);
    border: 1px solid var(--color-primary);
    border-radius: var(--radius-md);
    padding: var(--space-md);
  }
  .nueva-cat-group label {
    display: block;
    font-size: var(--font-size-sm);
    font-weight: var(--font-weight-semibold);
    color: var(--text-dark);
    margin-bottom: var(--space-sm);
  }
  /* nueva-cat-row: input ocupa toda la línea en móvil muy angosto */
  .nueva-cat-row {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-sm);
    align-items: center;
  }
  .nueva-cat-row input { flex: 1; min-width: 120px; }
  .nueva-cat-row .btn-small { white-space: nowrap; flex-shrink: 0; }

  /* ── Pantalla de éxito ───────────────────────────────────── */
  .tx-exito {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: var(--space-xl) var(--space-lg);
    text-align: center;
    animation: txFadeIn 0.3s ease-out;
  }
  .tx-exito-icon {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: var(--color-success);
    color: var(--bg-light);
    font-size: 2rem;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: var(--space-md);
    animation: txPop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .tx-exito-msg {
    margin: 0;
    font-size: var(--font-size-xl);
    font-weight: var(--font-weight-bold);
    color: var(--text-dark);
  }

  /* ── Misc ────────────────────────────────────────────────── */
  .label-opcional {
    color: var(--text-secondary);
    font-weight: var(--font-weight-normal);
    font-size: var(--font-size-xs);
  }
  .transaccion-actions {
    display: flex;
    gap: var(--space-md);
    margin-top: var(--space-lg);
  }
  .transaccion-actions .btn { flex: 1; }

  /* ── Animaciones ─────────────────────────────────────────── */
  @keyframes txSlideDown {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes txFadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  @keyframes txPop {
    from { opacity: 0; transform: scale(0.5); }
    to   { opacity: 1; transform: scale(1); }
  }
  .tx-cat-icono { display: inline-flex; align-items: center; margin-left: var(--space-xs); }
  .tx-cat-icono .cat-icono { width: 18px; height: 18px; color: var(--text-secondary); }
  .tx-share-preview {
    margin-bottom: var(--space-md);
    padding: var(--space-sm);
    background: var(--bg-light-secondary);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-md);
  }
  .tx-share-preview img {
    max-width: 100%;
    max-height: 180px;
    border-radius: var(--radius-sm);
    display: block;
    margin: 0 auto var(--space-xs);
  }

  /* ── Quick-add prefill: highlight categoria faltante ────── */
  .tx-cat-needed select { outline: 2px solid var(--color-warning); outline-offset: 2px; }

  /* ── Split multi-categoría ───────────────────────────────── */
  .tx-split-box { border:1px solid var(--color-border, var(--border-light)); border-radius:var(--radius-sm); padding:var(--space-sm); margin-bottom:var(--space-md); }
  .tx-split-linea { display:flex; gap:var(--space-xs); margin-bottom:var(--space-xs); align-items:center; }
  .tx-split-linea .sp-cat { flex:1; }
  .tx-split-linea .sp-monto { width:90px; }
  .tx-split-linea .sp-del { background:none; border:none; font-size:1.3rem; cursor:pointer; color:var(--color-text-muted, var(--text-secondary)); }

  /* ── Recibo preview ─────────────────────────────────────── */
  .recibo-preview { max-width: 120px; border-radius: var(--radius-sm); margin-top: var(--space-sm); display:block; }

  /* ── Quick-add panel ────────────────────────────────────── */
  .tx-quick {
    padding: var(--space-sm) 0 var(--space-md);
  }
  .tx-quick-label {
    display: block;
    font-size: var(--font-size-xs);
    font-weight: var(--font-weight-semibold);
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: var(--space-sm);
  }
  .tx-quick-row {
    display: flex;
    gap: var(--space-sm);
    margin-bottom: var(--space-sm);
  }
  .tx-quick-input {
    flex: 1;
    min-width: 0;
    font-size: var(--font-size-lg);
    font-weight: var(--font-weight-medium);
    padding: var(--space-sm) var(--space-md);
    min-height: 48px;
    border: 1px solid var(--border-light);
    border-radius: var(--radius-md);
    background: var(--bg-light);
    color: var(--text-dark);
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .tx-quick-input::placeholder { color: var(--text-secondary); opacity: 0.7; font-weight: var(--font-weight-normal); }
  .tx-quick-input:focus {
    outline: none;
    border-color: var(--color-primary);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--color-primary) 22%, transparent);
  }
  .tx-quick-add {
    flex-shrink: 0;
    white-space: nowrap;
    min-height: 48px;
    padding-inline: var(--space-lg);
    font-weight: var(--font-weight-semibold);
  }
  .tx-quick-mas {
    display: block;
    margin-top: var(--space-sm);
    background: none;
    border: none;
    color: var(--text-secondary);
    font-size: var(--font-size-sm);
    cursor: pointer;
    padding: var(--space-xs) 0;
    text-decoration: underline;
    text-underline-offset: 3px;
    text-decoration-thickness: 1px;
  }
  .tx-quick-mas:hover { color: var(--color-primary); }

  /* ── Quick-add confirmation ──────────────────────────────── */
  .tx-quick-confirm {
    padding: var(--space-lg) var(--space-md);
    text-align: center;
    animation: txFadeIn 0.25s ease-out;
  }
  .tx-quick-confirm-check {
    width: 48px;
    height: 48px;
    margin: 0 auto var(--space-md);
    color: var(--color-success);
    animation: txPop 0.3s ease-out;
  }
  .tx-quick-confirm-check svg { width: 100%; height: 100%; }
  .tx-quick-confirm-msg {
    font-size: var(--font-size-lg);
    font-weight: var(--font-weight-normal);
    color: var(--text-secondary);
    margin: 0 auto var(--space-lg);
    line-height: 1.5;
    max-width: 28ch;
  }
  .tx-quick-confirm-msg .qc-em {
    color: var(--color-primary);
    font-weight: var(--font-weight-bold);
  }
  .tx-quick-confirm-actions {
    display: flex;
    gap: var(--space-sm);
    flex-wrap: wrap;
    justify-content: center;
  }
  .btn-sm {
    padding: var(--space-xs) var(--space-md);
    font-size: var(--font-size-sm);
    min-height: 40px;
  }

  @media (max-width: 480px) {
    .tx-quick-row { flex-direction: column; }
    .tx-quick-add { width: 100%; }
    .tx-quick-confirm-actions { flex-direction: column; }
    .tx-quick-confirm-actions .btn { width: 100%; }
  }

  /* ── Plantilla chips ─────────────────────────────────────── */
  .tx-plantillas { display:flex; flex-wrap:wrap; gap:var(--space-xs); margin-bottom:var(--space-md); }
  .chip {
    display: inline-flex;
    align-items: center;
    padding: var(--space-xs) var(--space-sm);
    border-radius: var(--radius-full, 9999px);
    border: 1px solid var(--border-light);
    background: var(--bg-light-secondary);
    color: var(--text-dark);
    font-size: var(--font-size-sm);
    font-weight: var(--font-weight-semibold);
    line-height: 1.2;
    white-space: nowrap;
    transition: background 0.15s, border-color 0.15s;
  }
  .chip:hover { background: var(--border-light); border-color: var(--color-primary); }
  .chip:disabled { opacity: 0.5; cursor: not-allowed; }
  .chip-plantilla { cursor: pointer; }
</style>

<script>
  (function () {
    const form           = document.getElementById('transaccionForm');
    const tipoEl         = document.getElementById('tipo');
    const ambitoEl       = document.getElementById('ambito');
    const categoriaEl    = document.getElementById('categoria');
    const montoEl        = document.getElementById('monto');
    const fechaEl        = document.getElementById('fecha');
    const notaEl         = document.getElementById('nota');

    const btnTipoGasto    = document.getElementById('btnTipoGasto');
    const btnTipoIngreso  = document.getElementById('btnTipoIngreso');
    const btnTipoAhorro   = document.getElementById('btnTipoAhorro');
    const btnAmbitoPersonal = document.getElementById('btnAmbitoPersonal');
    const btnAmbitoHogar    = document.getElementById('btnAmbitoHogar');

    const aporteHogarGroup = document.getElementById('aporteHogarGroup');
    const aporteHogarEl    = document.getElementById('aporteHogar');

    const prestamoGroup    = document.getElementById('prestamoGroup');
    const deudorEl         = document.getElementById('deudor');
    const estadoPrestamoEl = document.getElementById('estadoPrestamo');
    const deudorError      = document.getElementById('deudorError');

    const nuevaCatGroup    = document.getElementById('nuevaCatGroup');
    const nuevaCatNombre   = document.getElementById('nuevaCatNombre');
    const nuevaCatGuardar  = document.getElementById('nuevaCatGuardar');
    const nuevaCatCancelar = document.getElementById('nuevaCatCancelar');
    const nuevaCatError    = document.getElementById('nuevaCatError');

    const categoriaError = document.getElementById('categoriaError');
    const montoError     = document.getElementById('montoError');
    const formError      = document.getElementById('formError');
    const guardarBtn     = document.getElementById('guardarBtn');
    const guardarText    = document.getElementById('guardarText');
    const guardarSpinner = document.getElementById('guardarSpinner');
    const cancelarBtn    = document.getElementById('cancelarBtn');

    const txExito          = document.getElementById('txExito');
    const txAlertaPost     = document.getElementById('txAlertaPost');
    const txExitoContinuar = document.getElementById('txExitoContinuar');

    // ── Panel rápido: modo helpers ────────────────────────────
    const elQuickPanel = document.getElementById('txQuickPanel');
    const elHeader = document.querySelector('.tx-header');
    function _modoRapido() {
      elQuickPanel.style.display = 'block';
      form.style.display = 'none';
      if (elHeader) elHeader.style.display = 'none';
      document.getElementById('txQuickConfirm').style.display = 'none';
      setTimeout(() => { document.getElementById('txQuickInput').focus(); }, 50);
    }
    function _modoForm() {
      elQuickPanel.style.display = 'none';
      document.getElementById('txQuickConfirm').style.display = 'none';
      if (elHeader) elHeader.style.display = '';
      form.style.display = '';
    }

    const CAT_PRESTAMO = 'Dinero que prestamos';

    // Modo edición: si el historial dejó window._editTx, precargamos los
    // campos y al guardar usamos updateTransaccion en vez de insertar. Se
    // consume una sola vez (null inmediato) para no contaminar un alta nueva.
    const editTx = window._editTx || null;
    window._editTx = null;

    // ── Fecha por defecto: hoy ────────────────────────────────
    const hoy = new Date();
    fechaEl.value = `${hoy.getFullYear()}-${String(hoy.getMonth() + 1).padStart(2, '0')}-${String(hoy.getDate()).padStart(2, '0')}`;

    // ── Helpers ───────────────────────────────────────────────
    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function mostrar(el, msg) { el.textContent = msg; el.style.display = 'block'; }
    function ocultar(el)      { el.style.display = 'none'; el.textContent = ''; }

    function _salir() {
      _reciboBlob = null;
      var prev = document.getElementById('reciboPreview');
      if (prev) { prev.src = ''; prev.style.display = 'none'; }
      if (window._modalMode && typeof cerrarModal === 'function') {
        cerrarModal();
      } else {
        window.location.hash = '#dashboard';
      }
    }

    // ── Pill toggles ──────────────────────────────────────────
    function _setTipo(val) {
      tipoEl.value = val;
      btnTipoGasto.classList.toggle('tx-active', val === 'gasto');
      btnTipoGasto.setAttribute('aria-pressed', String(val === 'gasto'));
      btnTipoIngreso.classList.toggle('tx-active', val === 'ingreso');
      btnTipoIngreso.setAttribute('aria-pressed', String(val === 'ingreso'));
      btnTipoAhorro.classList.toggle('tx-active', val === 'ahorro');
      btnTipoAhorro.setAttribute('aria-pressed', String(val === 'ahorro'));
      var esAhorro = (val === 'ahorro');
      document.getElementById('categoriaGroup').style.display = esAhorro ? 'none' : '';
      if (esAhorro) { _ocultarNuevaCat(); _ocultarPrestamo(); }
      else cargarCategorias();
      _mostrarAporteHogar();
    }
    function _setAmbito(val) {
      ambitoEl.value = val;
      btnAmbitoPersonal.classList.toggle('tx-active', val === 'personal');
      btnAmbitoPersonal.setAttribute('aria-pressed', String(val === 'personal'));
      btnAmbitoHogar.classList.toggle('tx-active', val === 'hogar');
      btnAmbitoHogar.setAttribute('aria-pressed', String(val === 'hogar'));
      _mostrarAporteHogar();
    }

    btnTipoGasto.addEventListener('click',   () => _setTipo('gasto'));
    btnTipoIngreso.addEventListener('click',  () => _setTipo('ingreso'));
    btnTipoAhorro.addEventListener('click',   () => _setTipo('ahorro'));
    btnAmbitoPersonal.addEventListener('click', () => _setAmbito('personal'));
    btnAmbitoHogar.addEventListener('click',    () => _setAmbito('hogar'));

    // ── Aporte al hogar ───────────────────────────────────────
    function _mostrarAporteHogar() {
      // En edición no ofrecemos convertir en aporte (rompería la mitad ya existente).
      if (editTx) { aporteHogarGroup.style.display = 'none'; aporteHogarEl.checked = false; return; }
      const esHogarGasto = ambitoEl.value === 'hogar' && tipoEl.value === 'gasto';
      aporteHogarGroup.style.display = esHogarGasto ? 'block' : 'none';
      if (!esHogarGasto) aporteHogarEl.checked = false;
    }

    // ── Préstamo ──────────────────────────────────────────────
    function _esPrestamo() {
      const opt = categoriaEl.selectedOptions[0];
      return opt && opt.text === CAT_PRESTAMO;
    }
    function _mostrarPrestamo()  { prestamoGroup.style.display = 'block'; }
    function _ocultarPrestamo()  {
      prestamoGroup.style.display = 'none';
      deudorEl.value = '';
      estadoPrestamoEl.value = 'pendiente';
      ocultar(deudorError);
    }

    // ── Categorías ────────────────────────────────────────────
    async function cargarCategorias(autoSelectId) {
      const tipo = tipoEl.value;
      categoriaEl.disabled = true;
      categoriaEl.innerHTML = '<option value="">Cargando...</option>';
      _ocultarNuevaCat();
      _ocultarPrestamo();
      try {
        const cats = await getCategorias(tipo);
        if (!cats.length) {
          categoriaEl.innerHTML = '<option value="">Sin categorías</option>';
          return;
        }
        categoriaEl.innerHTML =
          '<option value="">Selecciona una categoría</option>' +
          cats.map((c) => `<option value="${c.id}" data-icono="${esc(c.icono || '')}">${esc(c.nombre)}</option>`).join('') +
          '<option value="__nueva__">+ Nueva categoría</option>';
        if (autoSelectId) categoriaEl.value = autoSelectId;
        if (_esPrestamo() && !editTx) _mostrarPrestamo();
      } catch (err) {
        console.error('Error cargando categorías:', err);
        categoriaEl.innerHTML = '<option value="">Error al cargar</option>';
      } finally {
        categoriaEl.disabled = false;
      }
    }

    categoriaEl.addEventListener('change', () => {
      ocultar(categoriaError);
      if (categoriaEl.value === '__nueva__') {
        categoriaEl.value = '';
        _ocultarPrestamo();
        _mostrarNuevaCat();
      } else {
        _ocultarNuevaCat();
        if (_esPrestamo() && !editTx) { _mostrarPrestamo(); } else { _ocultarPrestamo(); }
      }
      (function () {
        var icoEl = document.getElementById('categoriaIcono');
        if (!icoEl) return;
        var opt = categoriaEl.selectedOptions[0];
        var icono = opt ? opt.getAttribute('data-icono') : null;
        icoEl.innerHTML = (categoriaEl.value && typeof iconoCategoria === 'function') ? iconoCategoria(icono) : '';
      })();
    });

    // ── Nueva categoría al vuelo ──────────────────────────────
    function _mostrarNuevaCat() {
      nuevaCatGroup.style.display = 'block';
      nuevaCatNombre.value = '';
      nuevaCatGuardar.disabled = false;
      nuevaCatCancelar.disabled = false;
      ocultar(nuevaCatError);
      nuevaCatNombre.focus();
    }
    function _ocultarNuevaCat() {
      nuevaCatGroup.style.display = 'none';
      nuevaCatNombre.value = '';
      ocultar(nuevaCatError);
    }

    nuevaCatGuardar.addEventListener('click', async () => {
      const nombre = nuevaCatNombre.value.trim();
      if (!nombre) {
        mostrar(nuevaCatError, 'Escribe un nombre para la categoría.');
        nuevaCatNombre.focus();
        return;
      }
      nuevaCatGuardar.disabled = true;
      nuevaCatCancelar.disabled = true;
      ocultar(nuevaCatError);
      try {
        const cat = await insertCategoria({ nombre, tipo: tipoEl.value === 'ahorro' ? 'gasto' : tipoEl.value });
        await cargarCategorias(cat.id);
        if (categoriaEl.value !== cat.id) {
          mostrar(nuevaCatError, 'Categoría creada, pero no se pudo recargar la lista. Recarga la página.');
          nuevaCatGuardar.disabled = false;
          nuevaCatCancelar.disabled = false;
        }
      } catch (err) {
        mostrar(nuevaCatError, err.message || 'No se pudo crear la categoría.');
        nuevaCatGuardar.disabled = false;
        nuevaCatCancelar.disabled = false;
      }
    });

    nuevaCatNombre.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); nuevaCatGuardar.click(); }
    });
    nuevaCatCancelar.addEventListener('click', () => {
      _ocultarNuevaCat();
      categoriaEl.value = '';
    });

    montoEl.addEventListener('input', () => ocultar(montoError));

    // ── Recibo: compresión y previsualización ─────────────────
    function comprimirImagen(file, maxLado, calidad) {
      return new Promise(function (resolve, reject) {
        var img = new Image();
        img.onload = function () {
          var w = img.width, h = img.height;
          if (w > h && w > maxLado) { h = Math.round(h * maxLado / w); w = maxLado; }
          else if (h > maxLado) { w = Math.round(w * maxLado / h); h = maxLado; }
          var canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          canvas.toBlob(function (blob) { blob ? resolve(blob) : reject(new Error('toBlob null')); }, 'image/webp', calidad);
        };
        img.onerror = reject;
        img.src = URL.createObjectURL(file);
      });
    }
    var _reciboBlob = null;
    document.getElementById('reciboFile').addEventListener('change', async function (e) {
      var file = e.target.files[0]; if (!file) { _reciboBlob = null; return; }
      try {
        _reciboBlob = await comprimirImagen(file, 1280, 0.7);
        var prev = document.getElementById('reciboPreview');
        prev.src = URL.createObjectURL(_reciboBlob); prev.style.display = 'block';
      } catch (_) { _reciboBlob = null; }
    });

    // ── Split multi-categoría ─────────────────────────────────
    (function initSplit() {
      const on = document.getElementById('txSplitOn');
      const box = document.getElementById('txSplitBox');
      const lineasEl = document.getElementById('txSplitLineas');
      const sumaEl = document.getElementById('txSplitSuma');
      const totalEl = document.getElementById('txSplitTotal');
      if (!on) return;
      window._splitActivo = false;
      const catOptions = () => categoriaEl.innerHTML;
      function addLinea() {
        const div = document.createElement('div');
        div.className = 'tx-split-linea';
        div.innerHTML = `<select class="sp-cat">${catOptions()}</select>` +
          `<input type="number" class="sp-monto" step="0.01" min="0.01" inputmode="decimal" placeholder="0.00">` +
          `<button type="button" class="sp-del" aria-label="Quitar">×</button>`;
        lineasEl.appendChild(div);
        div.querySelector('.sp-del').onclick = () => { div.remove(); recalc(); };
        div.querySelector('.sp-monto').addEventListener('input', recalc);
        recalc();
      }
      function recalc() {
        let s = 0;
        lineasEl.querySelectorAll('.sp-monto').forEach((i) => { s += parseFloat(i.value) || 0; });
        sumaEl.textContent = s.toFixed(2);
        totalEl.textContent = (parseFloat(montoEl.value) || 0).toFixed(2);
      }
      on.addEventListener('change', () => {
        window._splitActivo = on.checked;
        box.style.display = on.checked ? '' : 'none';
        document.getElementById('categoriaGroup').style.display = on.checked ? 'none' : '';
        if (on.checked && !lineasEl.children.length) { addLinea(); addLinea(); }
        recalc();
      });
      document.getElementById('txSplitAdd').onclick = addLinea;
      montoEl.addEventListener('input', recalc);
      window._leerSplit = function () {
        const lineas = [];
        lineasEl.querySelectorAll('.tx-split-linea').forEach((d) => {
          const cat = d.querySelector('.sp-cat').value;
          const m = parseFloat(d.querySelector('.sp-monto').value);
          if (cat && m > 0) lineas.push({ categoria_id: cat, monto: m });
        });
        return lineas;
      };
    })();

    // ── Validación ────────────────────────────────────────────
    function validar() {
      let ok = true;
      ocultar(categoriaError);
      ocultar(montoError);
      ocultar(deudorError);
      ocultar(formError);

      // En modo split, la categoría única no es requerida (está oculta).
      if (!window._splitActivo && tipoEl.value !== 'ahorro' && !categoriaEl.value) {
        const msg = nuevaCatGroup.style.display !== 'none'
          ? 'Completa o cancela la nueva categoría primero.'
          : 'Selecciona una categoría.';
        mostrar(categoriaError, msg);
        ok = false;
      }
      const monto = parseFloat(montoEl.value);
      if (isNaN(monto) || monto <= 0) {
        mostrar(montoError, 'El monto debe ser mayor que 0.');
        ok = false;
      }
      if (prestamoGroup.style.display !== 'none' && !deudorEl.value.trim()) {
        mostrar(deudorError, 'Indica a quién le prestas.');
        ok = false;
      }
      return ok;
    }

    function setCargando(cargando) {
      guardarBtn.disabled  = cargando;
      cancelarBtn.disabled = cargando;
      guardarBtn.setAttribute('aria-busy', String(cargando));
      guardarSpinner.style.display = cargando ? 'inline-block' : 'none';
      guardarText.style.display    = cargando ? 'none' : 'inline';
    }

    // ── Pantalla de éxito ─────────────────────────────────────
    async function mostrarExito(categoriaId) {
      form.style.display = 'none';
      txExito.style.display = 'flex';

      // Evaluar alerta de categoría de forma no bloqueante.
      const { mes, anio } = mesActual();
      let alerta = null;
      try {
        alerta = await evaluarAlertaCategoria(categoriaId, mes, anio);
      } catch (_) {}

      if (alerta) {
        txAlertaPost.innerHTML = `
          <div class="alert-item alert-item--${esc(alerta.nivel)}" role="status">
            <span class="alert-icon" aria-hidden="true">${esc(alerta.icono)}</span>
            <span>${esc(alerta.mensaje)}</span>
          </div>`;
        txAlertaPost.style.display = 'block';
        // Con alerta: espera que el usuario haga click.
      } else {
        // Sin alerta: navega automáticamente tras 1.8s.
        setTimeout(() => {
          if (window._modalMode) window._modalRefresh = true;
          _salir();
        }, 1800);
      }
    }

    txExitoContinuar.addEventListener('click', () => {
      if (window._modalMode) window._modalRefresh = true;
      _salir();
    });

    cancelarBtn.addEventListener('click', _salir);

    // Botón X en header — solo en modo modal (teclado virtual reduce viewport
    // y el Cancel inferior puede quedar bajo el fold inaccesible).
    var txCloseBtn = document.getElementById('txCloseBtn');
    if (window._modalMode && txCloseBtn) {
      txCloseBtn.style.display = 'flex';
      txCloseBtn.addEventListener('click', _salir);
    }

    // ── Submit ────────────────────────────────────────────────
    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      if (!validar()) return;

      // ── Split path ──
      if (window._splitActivo) {
        const lineas = window._leerSplit();
        const total = parseFloat(montoEl.value) || 0;
        const suma = lineas.reduce((a, l) => a + l.monto, 0);
        const err = document.getElementById('txSplitError');
        if (lineas.length < 2) { err.textContent = 'Agrega al menos 2 líneas.'; err.style.display='block'; return; }
        if (Math.abs(suma - total) > 0.001) { err.textContent = `La suma (${suma.toFixed(2)}) debe igualar el total (${total.toFixed(2)}).`; err.style.display='block'; return; }
        err.style.display = 'none';
        try {
          await insertSplit(
            { tipo: tipoEl.value, ambito: document.getElementById('ambito').value, fecha: document.getElementById('fecha').value, nota: notaEl.value.trim() || null },
            lineas
          );
          window._splitActivo = false;
          if (typeof mostrarExito === 'function') mostrarExito(lineas[0].categoria_id);
        } catch (e) { err.textContent = 'No se pudo guardar la división. Reintenta.'; err.style.display='block'; }
        return;
      }

      const monto           = parseFloat(montoEl.value);
      const fecha           = fechaEl.value;
      const nota            = notaEl.value.trim() || null;
      const savedCatId      = categoriaEl.value;

      setCargando(true);
      try {
        if (editTx) {
          // Edición: solo actualiza campos. No toca préstamos ni aportes
          // vinculados (esas filas no son editables desde el historial).
          await updateTransaccion(editTx.id, {
            tipo:         tipoEl.value,
            ambito:       ambitoEl.value,
            categoria_id: tipoEl.value === 'ahorro' ? null : savedCatId,
            monto,
            fecha,
            nota,
          });
          // Re-distribuir aportes a metas si la categoría es/era "Ahorro".
          // Best-effort: fallo no revierte la edición ya guardada.
          await _reDistribuirAhorro(editTx.id, tipoEl.value);
          await mostrarExito(savedCatId);
          return;
        }
        if (aporteHogarEl.checked) {
          await insertAporteHogar(monto, savedCatId, nota, fecha);
        } else {
          const tx = await insertTransaccion({
            tipo:         tipoEl.value,
            ambito:       ambitoEl.value,
            categoria_id: tipoEl.value === 'ahorro' ? null : savedCatId,
            monto,
            fecha,
            nota,
          });
          if (prestamoGroup.style.display !== 'none') {
            await insertPrestamo(tx.id, deudorEl.value.trim(), estadoPrestamoEl.value);
          }
          if (_reciboBlob && tx && tx.id && typeof subirRecibo === 'function') {
            try { await subirRecibo(tx.id, _reciboBlob); } catch (_) {}
            _reciboBlob = null;
          }
        }
        await mostrarExito(savedCatId);
      } catch (err) {
        mostrar(formError, err.message || 'No se pudo guardar la transacción.');
        formError.style.display = 'flex';
        setCargando(false);
      }
    });

    // ── Carga inicial ─────────────────────────────────────────
    if (editTx) {
      document.getElementById('transaccionModalTitle').textContent = 'Editar transacción';
      const sub = document.querySelector('.tx-header p');
      if (sub) sub.textContent = 'Modifica los datos y guarda';
      guardarText.textContent = 'Guardar cambios';

      // Toggles: solo UI (no recargar categorías dos veces).
      tipoEl.value = editTx.tipo;
      btnTipoGasto.classList.toggle('tx-active', editTx.tipo === 'gasto');
      btnTipoGasto.setAttribute('aria-pressed', String(editTx.tipo === 'gasto'));
      btnTipoIngreso.classList.toggle('tx-active', editTx.tipo === 'ingreso');
      btnTipoIngreso.setAttribute('aria-pressed', String(editTx.tipo === 'ingreso'));
      btnTipoAhorro.classList.toggle('tx-active', editTx.tipo === 'ahorro');
      btnTipoAhorro.setAttribute('aria-pressed', String(editTx.tipo === 'ahorro'));
      document.getElementById('categoriaGroup').style.display = (editTx.tipo === 'ahorro') ? 'none' : '';

      ambitoEl.value = editTx.ambito;
      btnAmbitoPersonal.classList.toggle('tx-active', editTx.ambito === 'personal');
      btnAmbitoPersonal.setAttribute('aria-pressed', String(editTx.ambito === 'personal'));
      btnAmbitoHogar.classList.toggle('tx-active', editTx.ambito === 'hogar');
      btnAmbitoHogar.setAttribute('aria-pressed', String(editTx.ambito === 'hogar'));

      montoEl.value = editTx.monto;
      fechaEl.value = String(editTx.fecha).split('T')[0];
      notaEl.value = editTx.nota || '';
      aporteHogarGroup.style.display = 'none';

      cargarCategorias(editTx.categoria_id);
    } else {
      // Prefill desde Quick-Add del dashboard. Tiene prioridad sobre share prefill.
      // Se resuelve DESPUÉS de cargarCategorias() porque categoria_id se pasa
      // como autoSelectId para que el <option> ya exista cuando se asigne.
      const qp = window._quickAddPrefill || null;
      window._quickAddPrefill = null;

      if (qp) {
        // Campos que no dependen de las opciones de categoría.
        _setTipo(qp.tipo || 'gasto');
        if (qp.monto) montoEl.value = qp.monto;
        if (qp.nota)  notaEl.value  = qp.nota;
        if (qp.fecha) fechaEl.value  = qp.fecha;
        // cargarCategorias pre-selecciona el id si se le pasa; si no hay id
        // se señala visualmente que hace falta elegir categoría.
        cargarCategorias(qp.categoria_id || null).then(() => {
          if (qp.categoria_id) {
            categoriaEl.dispatchEvent(new Event('change'));
          } else if (qp._forceCategoriaPick) {
            document.getElementById('categoriaGroup').classList.add('tx-cat-needed');
          }
        });
      } else {
        cargarCategorias();
      }

      _mostrarAporteHogar();

      // Prefill desde Web Share Target (captura de Yape, etc.). Se consume una vez.
      const sp = window._sharePrefill || null;
      window._sharePrefill = null;
      if (sp) {
        if (sp.monto != null) montoEl.value = sp.monto;
        if (sp.nota) notaEl.value = sp.nota;
        if (sp.imageURL) {
          const prev = document.getElementById('txSharePreview');
          const img = document.getElementById('txShareImg');
          if (prev && img) {
            img.onload = function () { URL.revokeObjectURL(sp.imageURL); };
            img.src = sp.imageURL;
            prev.style.display = 'block';
          }
        }
      }

      // Decidir modo inicial: panel rápido solo para altas nuevas sin prefill.
      const _esAltaNueva = !qp && !sp;
      if (_esAltaNueva) _modoRapido(); else _modoForm();
    }

    // ── Panel rápido: parse + guardado directo ────────────────
    function _hoyISO() {
      const d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    }
    async function _ctxPara(tipo) {
      const learned = (typeof autocatLearned === 'function') ? await autocatLearned() : {};
      const cats = await getCategorias(tipo === 'ahorro' ? 'gasto' : tipo);
      const seed = window.NESTRA_SEED || {};
      return { learned, categorias: cats.map((c) => ({ id: c.id, nombre: c.nombre })), seed };
    }
    let _quickTokens = [], _quickTxId = null, _quickTipo = 'gasto';

    function _prefillForm(r) {
      _setTipo(r.tipo); _setAmbito(r.ambito);
      montoEl.value = r.monto || '';
      notaEl.value = r.descripcion || '';
      if (r.fecha) fechaEl.value = r.fecha;
    }

    async function _quickAgregar() {
      const errEl = document.getElementById('txQuickError');
      errEl.style.display = 'none';
      // Guard de versión: si el SW del teléfono sirve JS viejo (sin estos globales)
      // mientras la vista es nueva, avisamos en vez de morir en silencio.
      if (typeof parseQuickAdd !== 'function' || typeof tokenize !== 'function' ||
          typeof matchCategoria !== 'function' || typeof insertTransaccion !== 'function') {
        errEl.textContent = 'Hay una versión nueva de la app. Ciérrala por completo y vuelve a abrirla.';
        errEl.style.display = 'block';
        return;
      }
      try {
        const txt = document.getElementById('txQuickInput').value.trim();
        if (!txt) return;
        const pre = parseQuickAdd(txt, { hoy: _hoyISO(), ctx: {} });
        const ctx = await _ctxPara(pre.tipo);
        const r = parseQuickAdd(txt, { hoy: _hoyISO(), ctx });
        if (r.monto == null) { errEl.textContent = 'No detecté un monto. Ej: "Uber 15".'; errEl.style.display = 'block'; return; }
        _quickTokens = tokenize(r.descripcion || '');
        _quickTipo = r.tipo;
        if (r.tipo !== 'ahorro' && !r.categoria_id) {
          _prefillForm(r);
          _modoForm();
          document.getElementById('categoriaGroup').classList.add('tx-cat-needed');
          return;
        }
        const tx = await insertTransaccion({
          tipo: r.tipo, ambito: r.ambito,
          categoria_id: r.tipo === 'ahorro' ? null : r.categoria_id,
          monto: r.monto, fecha: r.fecha, nota: r.descripcion,
        });
        _quickTxId = tx && tx.id;
        await _mostrarConfirm(r);
      } catch (e) {
        console.error('quickAgregar falló:', e);
        errEl.textContent = 'No se pudo guardar. Reintenta.';
        errEl.style.display = 'block';
      }
    }

    // ── Panel rápido: confirmación + deshacer + editar cat ────
    function _fmtMonto(m) { return 'S/' + Number(m).toFixed(2); }
    function _nombreCat(id, cats) { const c = cats.find((x) => x.id === id); return c ? c.nombre : ''; }
    async function _mostrarConfirm(r) {
      const msg = document.getElementById('txQuickConfirmMsg');
      const cats = r.tipo === 'ahorro' ? [] : await getCategorias(r.tipo);
      const tipoTxt = r.tipo === 'gasto' ? 'gasto' : (r.tipo === 'ingreso' ? 'ingreso' : 'ahorro');
      const hogar = r.ambito === 'hogar' ? ' (hogar)' : '';
      if (r.tipo === 'ahorro') {
        msg.innerHTML = 'Registré un <b class="qc-em">' + tipoTxt + '</b> de <b class="qc-em">' + esc(_fmtMonto(r.monto)) + '</b>' + esc(hogar);
      } else {
        const cn = _nombreCat(r.categoria_id, cats);
        msg.innerHTML = 'Registré un <b class="qc-em">' + tipoTxt + '</b> por <b class="qc-em">' + esc(_fmtMonto(r.monto)) +
          '</b> en <b class="qc-em">' + esc(cn) + '</b>' + esc(hogar);
      }
      const editWrap = document.getElementById('txQuickEditCat');
      const sel = document.getElementById('txQuickEditSelect');
      const editBtn = document.getElementById('txQuickEditBtn');
      editWrap.style.display = 'none';
      if (r.tipo === 'ahorro') { editBtn.style.display = 'none'; }
      else {
        editBtn.style.display = '';
        sel.innerHTML = cats.map((c) => '<option value="' + c.id + '"' + (c.id === r.categoria_id ? ' selected' : '') + '>' + esc(c.nombre) + '</option>').join('');
      }
      elQuickPanel.style.display = 'none';
      document.getElementById('txQuickConfirm').style.display = 'block';
      if (window._modalMode) window._modalRefresh = true;
    }
    document.getElementById('txQuickAdd').addEventListener('click', _quickAgregar);
    document.getElementById('txQuickInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); _quickAgregar(); } });
    document.getElementById('txQuickMas').addEventListener('click', () => { _modoForm(); });
    document.getElementById('txQuickDone').addEventListener('click', () => { _salir(); });
    document.getElementById('txQuickUndo').addEventListener('click', async () => {
      if (_quickTxId) { try { await deleteTransaccion(_quickTxId); } catch (_) {} }
      _quickTxId = null; window._modalRefresh = true; _salir();
    });
    document.getElementById('txQuickEditBtn').addEventListener('click', () => {
      document.getElementById('txQuickEditCat').style.display = 'block';
    });
    document.getElementById('txQuickEditSelect').addEventListener('change', async (e) => {
      const nuevo = e.target.value;
      if (!_quickTxId || !nuevo) return;
      try {
        await updateTransaccion(_quickTxId, { categoria_id: nuevo });
        if (typeof autocatLearnTokens === 'function') await autocatLearnTokens(_quickTokens, nuevo);
        const cats = await getCategorias(_quickTipo);
        document.getElementById('txQuickConfirmMsg').innerHTML =
          'Actualicé la categoría a <b class="qc-em">' + esc(_nombreCat(nuevo, cats)) + '</b>';
        document.getElementById('txQuickEditCat').style.display = 'none';
      } catch (_) {}
    });

    // ── B) Autocat prefill al salir del campo nota ────────────
    notaEl.addEventListener('blur', async () => {
      if (categoriaEl.value) return;
      if (typeof matchCategoria !== 'function' || typeof tokenize !== 'function' || typeof autocatLearned !== 'function') return;
      if (tipoEl.value === 'ahorro') return;
      const cats = await getCategorias(tipoEl.value);
      const ctx = { learned: await autocatLearned(), categorias: cats.map((c) => ({ id: c.id, nombre: c.nombre })), seed: window.NESTRA_SEED || {} };
      const catId = matchCategoria(tokenize(notaEl.value), ctx);
      if (catId) { categoriaEl.value = catId; categoriaEl.dispatchEvent(new Event('change')); }
    });

    // ── C) Plantillas de 1 toque ──────────────────────────────
    (async function pintarPlantillas() {
      const cont = document.getElementById('txPlantillas');
      const contQ = document.getElementById('txQuickChips');
      if (typeof getPlantillas !== 'function') return;
      const ps = await getPlantillas();
      if (!ps || !ps.length) return;
      const chipsHtml = ps.map((p) =>
        `<button type="button" class="chip chip-plantilla" data-id="${esc(String(p.id))}">${esc(p.nombre)} · S/${esc(String(p.monto))}</button>`
      ).join('');
      // Chips en el formulario clásico
      if (cont) {
        cont.innerHTML = chipsHtml;
        cont.querySelectorAll('[data-id]').forEach(function (btn) {
          btn.addEventListener('click', async function () {
            const p = ps.find((x) => String(x.id) === btn.dataset.id);
            if (!p) return;
            btn.disabled = true;
            try {
              await insertTransaccion({ tipo: p.tipo, ambito: p.ambito, categoria_id: p.categoria_id, monto: p.monto, nota: p.nombre });
              if (typeof mostrarExito === 'function') mostrarExito(p.categoria_id);
            } catch (_) { btn.disabled = false; }
          });
        });
      }
      // Chips en el panel rápido — guardado directo + confirmación
      if (contQ) {
        contQ.innerHTML = chipsHtml;
        contQ.querySelectorAll('[data-id]').forEach(function (btn) {
          btn.addEventListener('click', async function () {
            const p = ps.find((x) => String(x.id) === btn.dataset.id);
            if (!p) return;
            btn.disabled = true;
            try {
              const tx = await insertTransaccion({ tipo: p.tipo, ambito: p.ambito, categoria_id: p.categoria_id, monto: p.monto, nota: p.nombre });
              _quickTxId = tx && tx.id;
              _quickTipo = p.tipo;
              _quickTokens = (typeof tokenize === 'function') ? tokenize(p.nombre) : [];
              await _mostrarConfirm({ tipo: p.tipo, ambito: p.ambito, monto: p.monto, categoria_id: p.categoria_id });
            } catch (_) { btn.disabled = false; }
          });
        });
      }
    })();
  })();
</script>
