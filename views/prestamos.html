<div class="prest">

  <!-- ── Header ──────────────────────────────────────────────── -->
  <header class="prest-header">
    <h1 class="prest-title">Préstamos</h1>
    <p class="prest-sub">Dinero prestado pendiente de devolución</p>
  </header>

  <!-- ── Loading ─────────────────────────────────────────────── -->
  <div id="prestLoading" class="prest-loading" role="status" aria-label="Cargando">
    <div class="prest-spinner-big"></div>
  </div>

  <!-- ── Sección: Total pendiente (card resumen, arriba de lista) -->
  <section id="prestTotalSection" style="display:none;">
    <div class="prest-total-card">
      <p class="prest-total-label">Total pendiente</p>
      <p class="prest-total-monto signature-num" id="prestTotalMonto">S/ 0.00</p>
      <div class="prest-total-desglose" id="prestTotalDesglose"></div>
    </div>
  </section>

  <!-- ── Sección 1: Préstamos pendientes ─────────────────────── -->
  <section id="prestPendientesSection" style="display:none;">
    <h2 class="prest-section-title">Pendientes</h2>
    <ul class="prest-lista" id="prestLista" role="list" tabindex="-1"></ul>
    <p class="prest-vacio" id="prestVacio" style="display:none;">
      No tienes préstamos pendientes.
      <span class="prest-vacio-hint">Toca el botón + Nuevo préstamo para registrar uno.</span>
    </p>
  </section>

  <!-- ── Sección 3: Historial de devueltos (colapsado) ────────── -->
  <section class="prest-devueltos-section">
    <button type="button" class="prest-dev-toggle" id="prestDevToggle"
            aria-expanded="false" aria-controls="prestDevPanel">
      <span id="prestDevLabel">Historial de devueltos</span>
      <span class="prest-dev-caret" aria-hidden="true">⌄</span>
    </button>
    <div class="prest-dev-panel" id="prestDevPanel" style="display:none;">
      <ul class="prest-lista prest-lista--devueltos" id="prestDevLista" role="list"></ul>
      <p class="prest-vacio" id="prestDevVacio" style="display:none;">
        Sin préstamos devueltos aún.
      </p>
    </div>
  </section>

  <!-- ── Modal: confirmar devolución ─────────────────────────── -->
  <div class="prest-modal-overlay" id="prestConfirmModal"
       role="dialog" aria-modal="true" aria-labelledby="prestConfirmTitle" hidden>
    <div class="prest-modal">
      <h2 class="prest-modal-title" id="prestConfirmTitle">Confirmar devolución</h2>
      <p class="prest-confirm-body" id="prestConfirmBody"></p>
      <div class="prest-modal-actions">
        <button type="button" class="btn btn-secondary" id="prestConfirmCancelar">Cancelar</button>
        <button type="button" class="btn btn-primary" id="prestConfirmOk">
          <span id="prestConfirmText">Marcar devuelto</span>
          <span id="prestConfirmSpinner" class="spinner" role="status"
                aria-label="Procesando" style="display:none;"></span>
        </button>
      </div>
    </div>
  </div>

  <!-- ── Modal: nuevo préstamo ───────────────────────────────── -->
  <div class="prest-modal-overlay prest-nuevo-overlay" id="prestNuevoModal"
       role="dialog" aria-modal="true" aria-labelledby="prestNuevoTitle" hidden>
    <div class="prest-modal prest-nuevo-modal">

      <!-- Header row: title + close -->
      <div class="prest-nuevo-header">
        <h2 class="prest-modal-title" id="prestNuevoTitle">Nuevo préstamo</h2>
        <button type="button" class="prest-nuevo-close" id="prestNuevoClose"
                aria-label="Cerrar">
          <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor"
               stroke-width="2.5" stroke-linecap="round" fill="none" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <!-- Direction toggle -->
      <div class="prest-dir-toggle" role="group" aria-label="Dirección del préstamo">
        <button type="button" class="prest-dir-btn prest-dir-btn--active"
                id="prestDirPreste" data-dir="preste">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
               fill="none" aria-hidden="true">
            <path d="M12 19V5M5 12l7-7 7 7"/>
          </svg>
          Presté
        </button>
        <button type="button" class="prest-dir-btn"
                id="prestDirRecibido" data-dir="recibido">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
               fill="none" aria-hidden="true">
            <path d="M12 5v14M19 12l-7 7-7-7"/>
          </svg>
          Me prestaron
        </button>
      </div>

      <!-- Form -->
      <form id="prestNuevoForm" class="prest-nuevo-form" novalidate>

        <!-- Persona -->
        <div class="prest-field">
          <label class="prest-label" for="prestPersona" id="prestPersonaLabel">
            Persona (a quien presté)
          </label>
          <input class="prest-input" id="prestPersona" type="text"
                 placeholder="Nombre del deudor" autocomplete="off"
                 maxlength="100" required>
          <p class="prest-field-error" id="prestPersonaErr" role="alert"></p>
        </div>

        <!-- Monto -->
        <div class="prest-field">
          <label class="prest-label" for="prestMonto">Monto</label>
          <div class="prest-input-prefix-wrap">
            <span class="prest-input-prefix">S/</span>
            <input class="prest-input prest-input--prefixed" id="prestMonto"
                   type="number" inputmode="decimal" min="0.01" step="0.01"
                   placeholder="0.00" required>
          </div>
          <p class="prest-field-error" id="prestMontoErr" role="alert"></p>
        </div>

        <!-- Fecha -->
        <div class="prest-field">
          <label class="prest-label" for="prestFecha">Fecha</label>
          <input class="prest-input" id="prestFecha" type="date" required>
        </div>

        <!-- Ámbito -->
        <div class="prest-field">
          <span class="prest-label">Ámbito</span>
          <div class="prest-ambito-toggle" role="group" aria-label="Ámbito">
            <button type="button" class="prest-ambito-btn prest-ambito-btn--active"
                    id="prestAmbitoPersonal" data-ambito="personal">Personal</button>
            <button type="button" class="prest-ambito-btn"
                    id="prestAmbitoHogar" data-ambito="hogar">Hogar</button>
          </div>
        </div>

        <!-- Nota (optional) -->
        <div class="prest-field">
          <label class="prest-label" for="prestNota">
            Nota <span class="prest-label-opt">(opcional)</span>
          </label>
          <textarea class="prest-input prest-input--textarea" id="prestNota"
                    rows="2" maxlength="300"
                    placeholder="Motivo o descripción…"></textarea>
        </div>

        <!-- Error global -->
        <p class="prest-form-error" id="prestFormError" role="alert" style="display:none;"></p>

        <!-- Actions -->
        <div class="prest-nuevo-actions">
          <button type="button" class="btn btn-secondary" id="prestNuevoCancelar">
            Cancelar
          </button>
          <button type="submit" class="btn btn-primary prest-nuevo-submit" id="prestNuevoSubmit">
            <span id="prestNuevoText">Guardar préstamo</span>
            <span id="prestNuevoSpinner" class="spinner" role="status"
                  aria-label="Guardando" style="display:none;"></span>
          </button>
        </div>
      </form>

    </div>
  </div>

  <!-- ── Toast ───────────────────────────────────────────────── -->
  <div class="prest-toast" id="prestToast"
       role="status" aria-live="polite" style="display:none;">
    <span id="prestToastMsg"></span>
  </div>

  <!-- ── Estilos ─────────────────────────────────────────────── -->
  <style>
    /* Layout */
    .prest {
      padding: var(--space-lg) var(--space-md);
      max-width: 700px;
      margin: 0 auto;
    }

    /* Header */
    .prest-header { margin-bottom: var(--space-xl); }
    .prest-title {
      font-size: var(--font-size-xl);
      font-weight: var(--font-weight-bold);
      margin: 0;
    }
    .prest-sub {
      color: var(--text-secondary);
      font-size: var(--font-size-sm);
      margin: var(--space-xs) 0 0;
    }

    /* Loading */
    .prest-loading {
      display: flex;
      justify-content: center;
      padding: var(--space-xl) 0;
    }
    .prest-spinner-big {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border-light);
      border-top-color: var(--color-primary);
      border-radius: 50%;
      animation: prest-spin 0.8s linear infinite;
    }
    @keyframes prest-spin { to { transform: rotate(360deg); } }

    /* Total card */
    .prest-total-card {
      background: var(--bg-light-secondary);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: var(--space-lg);
      margin-bottom: var(--space-xl);
      text-align: center;
    }
    .prest-total-label {
      font-size: var(--font-size-sm);
      color: var(--text-secondary);
      margin: 0 0 var(--space-xs);
    }
    .prest-total-monto {
      font-size: 1.75rem;
      font-weight: var(--font-weight-bold);
      color: var(--color-primary);
      margin: 0 0 var(--space-sm);
    }
    .prest-total-desglose {
      display: flex;
      justify-content: center;
      gap: var(--space-md);
      font-size: var(--font-size-sm);
      color: var(--text-secondary);
      flex-wrap: wrap;
    }
    .prest-desglose-sep { opacity: 0.4; }

    /* Section title */
    .prest-section-title {
      font-size: var(--font-size-lg);
      font-weight: var(--font-weight-semibold);
      margin: 0 0 var(--space-md);
    }

    /* Cards list */
    .prest-lista {
      list-style: none;
      padding: 0;
      margin: 0 0 var(--space-xl);
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }
    .prest-lista--devueltos { margin-top: var(--space-md); }

    /* Card */
    .prest-card {
      background: var(--bg-light-secondary);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: var(--space-lg);
    }
    .prest-card--alerta {
      border-color: var(--color-warning);
      background: color-mix(in srgb, var(--color-warning) 5%, var(--bg-light-secondary));
    }
    .prest-card--devuelto { opacity: 0.7; }

    .prest-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: var(--space-sm);
      margin-bottom: var(--space-sm);
    }
    .prest-card-deudor {
      font-weight: var(--font-weight-semibold);
      font-size: var(--font-size-base);
    }
    .prest-card-monto {
      font-weight: var(--font-weight-bold);
      color: var(--color-primary);
      white-space: nowrap;
    }
    .prest-card-meta {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-sm);
      align-items: center;
      font-size: var(--font-size-sm);
      color: var(--text-secondary);
      margin-bottom: var(--space-sm);
    }
    .prest-card-nota {
      font-size: var(--font-size-sm);
      color: var(--text-secondary);
      font-style: italic;
      margin: var(--space-xs) 0 var(--space-sm);
    }
    .prest-card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: var(--space-sm);
      flex-wrap: wrap;
      margin-top: var(--space-sm);
    }
    .prest-card-dias { font-size: var(--font-size-sm); color: var(--text-secondary); }
    .prest-card-dias--alerta {
      color: var(--color-warning);
      font-weight: var(--font-weight-medium);
    }

    /* Badge ámbito */
    .prest-badge {
      display: inline-flex;
      align-items: center;
      padding: 2px var(--space-sm);
      border-radius: 9999px;
      font-size: var(--font-size-xs);
      font-weight: var(--font-weight-medium);
    }
    .prest-badge--ambito {
      background: color-mix(in srgb, var(--color-primary) 10%, transparent);
      color: var(--color-primary);
    }

    /* Button devolver — full-width on mobile */
    .prest-btn-devolver { width: 100%; }

    /* Empty state */
    .prest-vacio {
      text-align: center;
      color: var(--text-secondary);
      padding: var(--space-xl) var(--space-md);
      margin: 0;
    }
    .prest-vacio-hint {
      display: block;
      font-size: var(--font-size-sm);
      margin-top: var(--space-xs);
      opacity: 0.7;
    }

    /* Devueltos toggle */
    .prest-devueltos-section { margin-bottom: var(--space-xl); }
    .prest-dev-toggle {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: none;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: var(--space-md);
      font-size: var(--font-size-base);
      font-weight: var(--font-weight-medium);
      cursor: pointer;
      color: inherit;
      transition: background 0.2s;
    }
    .prest-dev-toggle:hover { background: var(--bg-light-secondary); }
    .prest-dev-caret { font-size: 1.2rem; color: var(--text-secondary); }
    .prest-dev-panel { padding-top: var(--space-md); }

    /* Modal */
    .prest-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-md);
      z-index: 200;
    }
    .prest-modal-overlay[hidden] { display: none; }
    .prest-modal {
      background: var(--bg-light);
      border-radius: var(--radius-lg);
      padding: var(--space-xl);
      max-width: 420px;
      width: 100%;
    }
    .prest-modal-title {
      font-size: var(--font-size-lg);
      font-weight: var(--font-weight-semibold);
      margin: 0 0 var(--space-md);
    }
    .prest-confirm-body {
      color: var(--text-secondary);
      margin: 0 0 var(--space-lg);
      line-height: 1.5;
    }
    .prest-modal-actions {
      display: flex;
      gap: var(--space-sm);
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    /* Toast — above mobile bottom nav */
    .prest-toast {
      position: fixed;
      bottom: calc(var(--space-md) + 68px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-light-secondary);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: var(--space-sm) var(--space-md);
      font-size: var(--font-size-sm);
      box-shadow: var(--shadow-md);
      z-index: 300;
      max-width: 90vw;
      white-space: nowrap;
    }

    /* Desktop adjustments */
    @media (min-width: 768px) {
      .prest-btn-devolver { width: auto; min-width: 180px; }
      .prest-total-monto { font-size: 2rem; }
      .prest-toast { bottom: var(--space-lg); }
    }

    /* ── Dirección badge en cards ────────────────────────────── */
    .prest-badge--preste {
      background: color-mix(in srgb, var(--color-warning) 16%, transparent);
      color: var(--color-warning);
    }
    .prest-badge--recibido {
      background: color-mix(in srgb, var(--color-success) 16%, transparent);
      color: var(--color-success);
    }

    /* ── Nuevo préstamo modal ────────────────────────────────── */
    .prest-nuevo-overlay {
      align-items: flex-end;
    }
    @media (min-width: 600px) {
      .prest-nuevo-overlay { align-items: center; }
    }
    .prest-nuevo-modal {
      max-width: 480px;
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      padding: var(--space-lg) var(--space-lg) calc(var(--space-lg) + env(safe-area-inset-bottom));
      max-height: 92vh;
      overflow-y: auto;
    }
    @media (min-width: 600px) {
      .prest-nuevo-modal {
        border-radius: var(--radius-lg);
        padding: var(--space-xl);
        max-height: 85vh;
      }
    }
    .prest-nuevo-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--space-lg);
    }
    .prest-nuevo-header .prest-modal-title { margin: 0; }
    .prest-nuevo-close {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: var(--bg-light-secondary);
      cursor: pointer;
      color: var(--text-secondary);
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .prest-nuevo-close:hover { background: var(--border-light); }
    .prest-dir-toggle {
      display: flex;
      background: var(--bg-light-secondary);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: 3px;
      gap: 3px;
      margin-bottom: var(--space-lg);
    }
    .prest-dir-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-xs);
      padding: var(--space-sm) var(--space-md);
      border: none;
      border-radius: calc(var(--radius-md) - 2px);
      background: transparent;
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-medium);
      color: var(--text-secondary);
      cursor: pointer;
      transition: background 0.18s, color 0.18s, box-shadow 0.18s;
    }
    .prest-dir-btn--active {
      background: var(--bg-light);
      color: var(--text-primary);
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }
    html.dark .prest-dir-btn--active {
      box-shadow: 0 1px 4px rgba(0,0,0,0.35);
    }
    .prest-nuevo-form { display: flex; flex-direction: column; gap: var(--space-md); }
    .prest-field { display: flex; flex-direction: column; gap: var(--space-xs); }
    .prest-label {
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-medium);
      color: var(--text-primary);
    }
    .prest-label-opt { font-weight: var(--font-weight-normal); color: var(--text-secondary); }
    .prest-input {
      background: var(--bg-light-secondary);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: var(--space-sm) var(--space-md);
      font-size: var(--font-size-base);
      color: var(--text-primary);
      width: 100%;
      box-sizing: border-box;
      transition: border-color 0.15s;
      font-family: inherit;
    }
    .prest-input:focus {
      outline: none;
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--color-primary) 15%, transparent);
    }
    .prest-input--textarea { resize: vertical; min-height: 64px; }
    .prest-input-prefix-wrap { position: relative; display: flex; align-items: center; }
    .prest-input-prefix {
      position: absolute;
      left: var(--space-md);
      font-size: var(--font-size-base);
      color: var(--text-secondary);
      pointer-events: none;
      user-select: none;
    }
    .prest-input--prefixed { padding-left: 2.2rem; }
    .prest-field-error {
      font-size: var(--font-size-xs);
      color: var(--color-danger);
      margin: 0;
      min-height: 1em;
    }
    .prest-form-error {
      font-size: var(--font-size-sm);
      color: var(--color-danger);
      background: color-mix(in srgb, var(--color-danger) 8%, transparent);
      border: 1px solid color-mix(in srgb, var(--color-danger) 20%, transparent);
      border-radius: var(--radius-sm);
      padding: var(--space-sm) var(--space-md);
      margin: 0;
    }
    .prest-ambito-toggle {
      display: flex;
      background: var(--bg-light-secondary);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: 3px;
      gap: 3px;
      width: fit-content;
    }
    .prest-ambito-btn {
      padding: var(--space-xs) var(--space-md);
      border: none;
      border-radius: calc(var(--radius-md) - 2px);
      background: transparent;
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-medium);
      color: var(--text-secondary);
      cursor: pointer;
      transition: background 0.18s, color 0.18s, box-shadow 0.18s;
    }
    .prest-ambito-btn--active {
      background: var(--bg-light);
      color: var(--text-primary);
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }
    html.dark .prest-ambito-btn--active { box-shadow: 0 1px 4px rgba(0,0,0,0.35); }
    .prest-nuevo-actions {
      display: flex;
      gap: var(--space-sm);
      justify-content: flex-end;
      padding-top: var(--space-sm);
    }
    .prest-nuevo-submit { min-width: 160px; }
  </style>

  <!-- ── Script ──────────────────────────────────────────────── -->
  <script>
    (function () {
      'use strict';

      function $(id) { return document.getElementById(id); }

      var _devueltoId = null;
      var _devueltoTxId = null;
      var _toastTimer = null;
      var _dirActual   = 'preste';
      var _ambitoNuevo = 'personal';
      var _catCache    = null;

      /* ── Helpers ──────────────────────────────────────────── */

      function escHtml(str) {
        return String(str == null ? '' : str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function diasDesde(fechaIso) {
        var p = String(fechaIso).split('T')[0].split('-');
        var fechaMs = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2])).getTime();
        var hoy = new Date();
        hoy.setHours(0, 0, 0, 0);
        return Math.floor((hoy.getTime() - fechaMs) / 86400000);
      }

      function nombrePor(userId, perfiles) {
        var p = (perfiles || []).find(function (x) { return x.user_id === userId; });
        return p && p.nombre ? p.nombre : '—';
      }

      function mostrarToast(msg, ms) {
        var toast = $('prestToast');
        $('prestToastMsg').textContent = msg;
        clearTimeout(_toastTimer);
        toast.style.display = 'flex';
        _toastTimer = setTimeout(function () { toast.style.display = 'none'; }, ms || 4000);
      }

      /* ── Lookup categorías (cached) ──────────────────────── */

      async function getCatIds() {
        if (_catCache) return _catCache;
        var gastoCats   = await getCategorias('gasto');
        var ingresoCats = await getCategorias('ingreso');
        var catPrestamo = gastoCats.find(function (c) { return c.nombre === 'Dinero que prestamos'; });
        var catRecibido = ingresoCats.find(function (c) { return c.nombre === 'Préstamo recibido'; });
        _catCache = {
          prestamo: catPrestamo ? catPrestamo.id : null,
          recibido: catRecibido ? catRecibido.id : null,
        };
        return _catCache;
      }

      /* ── Modal nuevo préstamo ────────────────────────────── */

      function abrirNuevo() {
        document.getElementById('prestNuevoForm').reset();
        document.getElementById('prestPersonaErr').textContent = '';
        document.getElementById('prestMontoErr').textContent = '';
        document.getElementById('prestFormError').style.display = 'none';
        document.getElementById('prestNuevoSubmit').disabled = false;
        document.getElementById('prestNuevoCancelar').disabled = false;
        document.getElementById('prestNuevoText').style.display = 'inline';
        document.getElementById('prestNuevoSpinner').style.display = 'none';

        var hoy = new Date();
        var mm = hoy.getMonth() + 1;
        var dd = hoy.getDate();
        document.getElementById('prestFecha').value =
          hoy.getFullYear() + '-' + (mm < 10 ? '0' + mm : mm) + '-' + (dd < 10 ? '0' + dd : dd);

        _dirActual   = 'preste';
        _ambitoNuevo = 'personal';
        document.getElementById('prestDirPreste').classList.add('prest-dir-btn--active');
        document.getElementById('prestDirRecibido').classList.remove('prest-dir-btn--active');
        document.getElementById('prestAmbitoPersonal').classList.add('prest-ambito-btn--active');
        document.getElementById('prestAmbitoHogar').classList.remove('prest-ambito-btn--active');
        _actualizarLabelPersona();

        document.getElementById('prestNuevoModal').removeAttribute('hidden');
        setTimeout(function () { document.getElementById('prestPersona').focus(); }, 80);
      }

      function cerrarNuevo() {
        document.getElementById('prestNuevoModal').setAttribute('hidden', '');
      }

      function _actualizarLabelPersona() {
        var label = document.getElementById('prestPersonaLabel');
        label.textContent = _dirActual === 'preste' ? 'Persona (a quien presté)' : 'Persona (quien me prestó)';
        document.getElementById('prestPersona').placeholder =
          _dirActual === 'preste' ? 'Nombre del deudor' : 'Nombre del prestamista';
      }

      document.getElementById('prestDirPreste').addEventListener('click', function () {
        if (_dirActual === 'preste') return;
        _dirActual = 'preste';
        document.getElementById('prestDirPreste').classList.add('prest-dir-btn--active');
        document.getElementById('prestDirRecibido').classList.remove('prest-dir-btn--active');
        _actualizarLabelPersona();
      });
      document.getElementById('prestDirRecibido').addEventListener('click', function () {
        if (_dirActual === 'recibido') return;
        _dirActual = 'recibido';
        document.getElementById('prestDirRecibido').classList.add('prest-dir-btn--active');
        document.getElementById('prestDirPreste').classList.remove('prest-dir-btn--active');
        _actualizarLabelPersona();
      });

      document.getElementById('prestAmbitoPersonal').addEventListener('click', function () {
        _ambitoNuevo = 'personal';
        document.getElementById('prestAmbitoPersonal').classList.add('prest-ambito-btn--active');
        document.getElementById('prestAmbitoHogar').classList.remove('prest-ambito-btn--active');
      });
      document.getElementById('prestAmbitoHogar').addEventListener('click', function () {
        _ambitoNuevo = 'hogar';
        document.getElementById('prestAmbitoHogar').classList.add('prest-ambito-btn--active');
        document.getElementById('prestAmbitoPersonal').classList.remove('prest-ambito-btn--active');
      });

      window._abrirNuevoPrestamo = abrirNuevo;
      document.getElementById('prestNuevoClose').addEventListener('click', cerrarNuevo);
      document.getElementById('prestNuevoCancelar').addEventListener('click', cerrarNuevo);

      document.getElementById('prestNuevoModal').addEventListener('click', function (e) {
        if (e.target === e.currentTarget) cerrarNuevo();
      });

      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && !document.getElementById('prestNuevoModal').hasAttribute('hidden')) {
          cerrarNuevo();
        }
      });

      document.getElementById('prestNuevoForm').addEventListener('submit', async function (e) {
        e.preventDefault();

        var persona = document.getElementById('prestPersona').value.trim();
        var monto   = parseFloat(document.getElementById('prestMonto').value);
        var fecha   = document.getElementById('prestFecha').value;
        var nota    = document.getElementById('prestNota').value.trim();

        var valido = true;
        document.getElementById('prestPersonaErr').textContent = '';
        document.getElementById('prestMontoErr').textContent = '';
        document.getElementById('prestFormError').style.display = 'none';

        if (!persona) {
          document.getElementById('prestPersonaErr').textContent = 'Ingresa el nombre de la persona.';
          valido = false;
        }
        if (!monto || monto <= 0 || isNaN(monto)) {
          document.getElementById('prestMontoErr').textContent = 'Ingresa un monto válido mayor a 0.';
          valido = false;
        }
        if (!valido) return;

        var submitBtn  = document.getElementById('prestNuevoSubmit');
        var cancelBtn  = document.getElementById('prestNuevoCancelar');
        submitBtn.disabled  = true;
        cancelBtn.disabled  = true;
        document.getElementById('prestNuevoText').style.display    = 'none';
        document.getElementById('prestNuevoSpinner').style.display = 'inline-block';

        try {
          var cats = await getCatIds();
          var catId = _dirActual === 'preste' ? cats.prestamo : cats.recibido;
          if (!catId) throw new Error('No se encontró la categoría de préstamo. Contacta soporte.');

          var tx = await insertTransaccion({
            tipo:         _dirActual === 'preste' ? 'gasto' : 'ingreso',
            ambito:       _ambitoNuevo,
            categoria_id: catId,
            monto:        monto,
            fecha:        fecha || (function () { var d = new Date(); var p = function (n) { return n < 10 ? '0' + n : '' + n; }; return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()); })(),
            nota:         nota || null,
          });

          await insertPrestamo(tx.id, persona, 'pendiente');

          cerrarNuevo();
          var dirLabel = _dirActual === 'preste' ? 'Préstamo registrado.' : 'Préstamo recibido registrado.';
          mostrarToast(dirLabel, 4000);
          await cargar();
          if (typeof pushOfrecerContextual === 'function') {
            pushOfrecerContextual('prestamo',
              '¿Quieres que te avise de préstamos pendientes desde hace tiempo?');
          }

        } catch (err) {
          submitBtn.disabled  = false;
          cancelBtn.disabled  = false;
          document.getElementById('prestNuevoText').style.display    = 'inline';
          document.getElementById('prestNuevoSpinner').style.display = 'none';
          var errMsg = document.getElementById('prestFormError');
          errMsg.textContent = 'No se pudo guardar el préstamo. ' + (err.message || 'Reintenta.');
          errMsg.style.display = 'block';
        }
      });

      /* ── Render pendientes ────────────────────────────────── */

      function renderPendientes(lista, perfiles) {
        var ul = $('prestLista');
        var seccion = $('prestPendientesSection');
        var vacio = $('prestVacio');

        seccion.style.display = 'block';

        if (!lista.length) {
          ul.innerHTML = '';
          vacio.style.display = 'block';
          return;
        }

        vacio.style.display = 'none';

        var ordenados = lista.slice().sort(function (a, b) {
          return diasDesde(b.transacciones.fecha) - diasDesde(a.transacciones.fecha);
        });

        ul.innerHTML = ordenados.map(function (p) {
          var tx = p.transacciones;
          var dias = diasDesde(tx.fecha);
          var alerta = dias > 30;
          var ambitoLabel = tx.ambito === 'hogar' ? 'Hogar' : 'Personal';
          var quien = nombrePor(tx.user_id, perfiles);
          var esPrestado = !tx.tipo || tx.tipo === 'gasto';

          return '<li class="prest-card' + (alerta ? ' prest-card--alerta' : '') + '">' +
            '<div class="prest-card-header">' +
              '<span class="prest-card-deudor">' + escHtml(p.deudor) + '</span>' +
              '<span class="prest-card-monto">' + escHtml(formatMonto(tx.monto)) + '</span>' +
            '</div>' +
            '<div class="prest-card-meta">' +
              '<span class="prest-badge ' + (esPrestado ? 'prest-badge--preste' : 'prest-badge--recibido') + '">' +
                (esPrestado ? '↑ Presté' : '↓ Me prestaron') +
              '</span>' +
              '<span class="prest-badge prest-badge--ambito">' + ambitoLabel + '</span>' +
              '<span class="prest-card-fecha">' + escHtml(formatFecha(tx.fecha)) + '</span>' +
              (esPrestado
                ? '<span class="prest-card-quien">Por: ' + escHtml(quien) + '</span>'
                : '') +
            '</div>' +
            (tx.nota ? '<p class="prest-card-nota">' + escHtml(tx.nota) + '</p>' : '') +
            '<div class="prest-card-footer">' +
              (alerta
                ? '<span class="prest-card-dias prest-card-dias--alerta"><svg class="cat-icono" aria-hidden="true"><use href="assets/tabler-sprite.svg#tabler-alert-triangle"></use></svg> Vencido (' + dias + ' días)</span>'
                : '<span class="prest-card-dias">Hace ' + dias + ' día' + (dias === 1 ? '' : 's') + '</span>') +
              '<button type="button" class="btn btn-secondary btn-sm prest-btn-devolver"' +
                ' data-act="devolver"' +
                ' data-id="' + p.id + '"' +
                ' data-tx="' + p.transaccion_id + '"' +
                ' data-deudor="' + escHtml(p.deudor) + '"' +
                ' data-monto="' + escHtml(formatMonto(tx.monto)) + '">' +
                (esPrestado ? 'Marcar como devuelto' : 'Marcar como pagado') +
              '</button>' +
            '</div>' +
          '</li>';
        }).join('');
      }

      /* ── Render total ─────────────────────────────────────── */

      function renderTotal(lista) {
        var totalHogar = 0;
        var totalPersonal = 0;

        lista.forEach(function (p) {
          var m = Number(p.transacciones.monto) || 0;
          if (p.transacciones.ambito === 'hogar') {
            totalHogar += m;
          } else {
            totalPersonal += m;
          }
        });

        $('prestTotalMonto').textContent = formatMonto(totalHogar + totalPersonal);
        $('prestTotalDesglose').innerHTML =
          '<span>Hogar: ' + escHtml(formatMonto(totalHogar)) + '</span>' +
          '<span class="prest-desglose-sep">·</span>' +
          '<span>Personal: ' + escHtml(formatMonto(totalPersonal)) + '</span>';
        $('prestTotalSection').style.display = 'block';
      }

      /* ── Render devueltos ─────────────────────────────────── */

      function renderDevueltos(lista) {
        var ul = $('prestDevLista');
        var vacio = $('prestDevVacio');
        var label = $('prestDevLabel');

        label.textContent = 'Historial de devueltos (' + lista.length + ')';

        if (!lista.length) {
          ul.innerHTML = '';
          vacio.style.display = 'block';
          return;
        }

        vacio.style.display = 'none';

        var ordenados = lista.slice().sort(function (a, b) {
          var fa = a.fecha_devolucion || a.transacciones.fecha;
          var fb = b.fecha_devolucion || b.transacciones.fecha;
          return fb > fa ? 1 : fb < fa ? -1 : 0;
        });

        ul.innerHTML = ordenados.map(function (p) {
          var tx = p.transacciones;
          var fechaDev = p.fecha_devolucion ? escHtml(formatFecha(p.fecha_devolucion)) : '—';
          return '<li class="prest-card prest-card--devuelto">' +
            '<div class="prest-card-header">' +
              '<span class="prest-card-deudor">' + escHtml(p.deudor) + '</span>' +
              '<span class="prest-card-monto">' + escHtml(formatMonto(tx.monto)) + '</span>' +
            '</div>' +
            '<div class="prest-card-meta">' +
              '<span>Prestado: ' + escHtml(formatFecha(tx.fecha)) + '</span>' +
              '<span class="prest-desglose-sep">·</span>' +
              '<span>Devuelto: ' + fechaDev + '</span>' +
            '</div>' +
          '</li>';
        }).join('');
      }

      /* ── Cargar datos ─────────────────────────────────────── */

      async function cargar() {
        $('prestLoading').style.display = 'flex';
        $('prestTotalSection').style.display = 'none';
        $('prestPendientesSection').style.display = 'none';

        try {
          var res = await Promise.all([
            getPrestamos('pendiente'),
            getPrestamos('devuelto'),
            getProfiles(),
          ]);
          var pendientes = res[0];
          var devueltos  = res[1];
          var perfiles   = res[2];

          renderTotal(pendientes);
          renderPendientes(pendientes, perfiles);
          renderDevueltos(devueltos);
        } catch (err) {
          console.error('prestamos cargar:', err);
          mostrarToast('No se pudieron cargar los préstamos.', 5000);
        } finally {
          $('prestLoading').style.display = 'none';
        }
      }

      /* ── Delegación: botón "Marcar como devuelto" ─────────── */

      $('prestLista').addEventListener('click', function (e) {
        var btn = e.target.closest('[data-act="devolver"]');
        if (!btn) return;
        _devueltoId   = btn.dataset.id;
        _devueltoTxId = btn.dataset.tx;
        $('prestConfirmBody').textContent =
          '¿Confirmar que ' + btn.dataset.deudor + ' devolvió ' + btn.dataset.monto + '? ' +
          'Se registrará un ingreso de devolución automáticamente.';
        $('prestConfirmModal').removeAttribute('hidden');
        setTimeout(function () { $('prestConfirmCancelar').focus(); }, 50);
      });

      /* ── Modal: cerrar ────────────────────────────────────── */

      function cerrarConfirm() {
        $('prestConfirmModal').setAttribute('hidden', '');
        $('prestConfirmOk').disabled = false;
        $('prestConfirmCancelar').disabled = false;
        $('prestConfirmText').style.display = 'inline';
        $('prestConfirmSpinner').style.display = 'none';
        _devueltoId   = null;
        _devueltoTxId = null;
      }

      $('prestConfirmCancelar').addEventListener('click', cerrarConfirm);

      $('prestConfirmModal').addEventListener('click', function (e) {
        if (e.target === e.currentTarget) cerrarConfirm();
      });

      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && !$('prestConfirmModal').hasAttribute('hidden')) {
          cerrarConfirm();
        }
      });

      /* ── Modal: confirmar devolución ──────────────────────── */

      $('prestConfirmOk').addEventListener('click', async function () {
        if (!_devueltoId) return;
        var okBtn     = $('prestConfirmOk');
        var cancelBtn = $('prestConfirmCancelar');
        okBtn.disabled     = true;
        cancelBtn.disabled = true;
        $('prestConfirmText').style.display    = 'none';
        $('prestConfirmSpinner').style.display = 'inline-block';

        try {
          await marcarDevuelto(_devueltoId, _devueltoTxId);
          cerrarConfirm();
          mostrarToast('Préstamo marcado como devuelto.', 4000);
          await cargar();
          var listaEl = $('prestLista');
          if (listaEl) { listaEl.focus(); }
        } catch (err) {
          okBtn.disabled     = false;
          cancelBtn.disabled = false;
          $('prestConfirmText').style.display    = 'inline';
          $('prestConfirmSpinner').style.display = 'none';
          mostrarToast('No se pudo marcar como devuelto. Reintenta.', 5000);
        }
      });

      /* ── Toggle sección historial ─────────────────────────── */

      $('prestDevToggle').addEventListener('click', function () {
        var panel    = $('prestDevPanel');
        var expanded = $('prestDevToggle').getAttribute('aria-expanded') === 'true';
        $('prestDevToggle').setAttribute('aria-expanded', expanded ? 'false' : 'true');
        panel.style.display = expanded ? 'none' : 'block';
        $('prestDevToggle').querySelector('.prest-dev-caret').textContent = expanded ? '⌄' : '⌃';
      });

      /* ── Init ─────────────────────────────────────────────── */
      cargar();

    })();
  </script>

</div>
