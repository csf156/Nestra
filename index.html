<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nestra - Gestor de Finanzas Personales</title>
    <link rel="icon" type="image/png" href="assets/nestra_logo.png">
    <link rel="apple-touch-icon" href="assets/nestra_logo.png">

    <!-- CSS Files -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body class="no-chrome">
    <!-- Navigation Bar -->
    <nav id="navbar" class="navbar">
        <div class="navbar-container">
            <div class="navbar-brand">
                <img src="assets/nestra_logo.png?v=2" alt="Nestra" class="navbar-logo brand-logo--light" />
                <img src="assets/nestra_logo_dark.png?v=2" alt="Nestra" class="navbar-logo brand-logo--dark" />
            </div>

            <!-- Chip de usuario — solo desktop con sesión activa -->
            <div class="user-chip" id="userChip">
                <div class="user-avatar" id="userAvatar">?</div>
                <div class="user-info">
                    <span class="user-name" id="userChipName"></span>
                    <button class="logout-btn" data-logout-trigger type="button">
                        <span aria-hidden="true">🔓</span> Cerrar sesión
                    </button>
                </div>
            </div>
            <ul class="navbar-links">
                <li>
                    <a href="#dashboard" class="nav-link">
                        <span class="nav-icon">📊</span>
                        <span class="nav-label">Dashboard</span>
                    </a>
                </li>
                <li>
                    <a href="#transaccion" class="nav-link">
                        <span class="nav-icon">💳</span>
                        <span class="nav-label">Transacción</span>
                    </a>
                </li>
                <li>
                    <a href="#historial" class="nav-link">
                        <span class="nav-icon">📜</span>
                        <span class="nav-label">Historial</span>
                    </a>
                </li>
                <li>
                    <a href="#graficos" class="nav-link">
                        <span class="nav-icon">📊</span>
                        <span class="nav-label">Gráficos</span>
                    </a>
                </li>
                <li>
                    <a href="#metas" class="nav-link">
                        <span class="nav-icon">🎯</span>
                        <span class="nav-label">Metas</span>
                    </a>
                </li>
                <li>
                    <a href="#configuracion" class="nav-link">
                        <span class="nav-icon">⚙️</span>
                        <span class="nav-label">Configuración</span>
                    </a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Main App Container -->
    <main id="app" class="app-container">
        <!-- Router injects vistas here -->
    </main>

    <!-- Supabase SDK (jsDelivr CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Application Scripts (in order) -->
    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/format.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
    <script src="js/export.js"></script>
    <script src="js/db.js"></script>
    <script src="js/alerts.js"></script>
    <script src="js/router.js"></script>

    <!-- Modal de confirmación de logout -->
    <div class="modal-overlay" id="logoutModal" role="dialog" aria-modal="true"
         aria-labelledby="logoutModalTitle">
        <div class="logout-modal-content" id="logoutModalDialog">
            <p class="logout-modal-icon" aria-hidden="true">⚠️</p>
            <h2 class="logout-modal-title" id="logoutModalTitle">¿Cerrar sesión?</h2>
            <p class="logout-modal-body">Serás redirigido al inicio de sesión.</p>
            <p class="logout-modal-error" id="logoutModalError" role="alert" aria-live="assertive" style="display:none;"></p>
            <div class="logout-modal-actions">
                <button class="btn btn-secondary" id="logoutCancelBtn">Cancelar</button>
                <button class="btn btn-danger" id="logoutConfirmBtn">
                    <span id="logoutConfirmText">Salir</span>
                    <span id="logoutConfirmSpinner" class="spinner" role="status" aria-label="Cerrando sesión" style="display:none;"></span>
                </button>
            </div>
        </div>
    </div>

    <!-- Modal de transacción — overlay reutilizado desde dashboard -->
    <div class="modal-overlay" id="transaccionModal" role="dialog" aria-modal="true"
         aria-labelledby="transaccionModalTitle" style="align-items: flex-start; padding-top: 5vh;">
      <div class="modal-content" id="transaccionModalContent"
           style="max-width: 580px; width: 95%; max-height: 90vh; overflow-y: auto;">
        <!-- transaccion.html se inyecta aquí -->
      </div>
    </div>

    <!-- Lógica de chip de usuario y logout -->
    <script>
      // updateUserChip() — rellena el chip del sidebar con datos del usuario
      // Llamada desde: initAuth() al restaurar sesión, router al cargar vistas protegidas
      function updateUserChip() {
        const profile = window.currentProfile;
        const user = window.currentUser;
        if (!user && !profile) return;
        const nombre = ((profile && profile.nombre) || (user && user.email ? user.email.split('@')[0] : '') || '').trim();
        // Array.from() maneja correctamente caracteres no-ASCII (ñ, é, á...)
        const initial = nombre ? Array.from(nombre)[0].toUpperCase() : '?';
        const avatarEl = document.getElementById('userAvatar');
        const nameEl   = document.getElementById('userChipName');
        if (avatarEl) avatarEl.textContent = initial;
        if (nameEl)   nameEl.textContent   = nombre || '—';
      }

      // ── Modal de transacción ──────────────────────────────────────
      // _lastFocusedEl — elemento que tenía el foco antes de abrir el modal,
      // para restaurarlo al cerrar (WCAG 2.4.3).
      var _lastFocusedEl = null;

      async function abrirModalTransaccion() {
        try {
          var overlay = document.getElementById('transaccionModal');
          var container = document.getElementById('transaccionModalContent');

          // Marcar modo modal ANTES de ejecutar el script de la vista.
          window._modalMode = true;
          window._modalRefresh = false;

          var response = await fetch('views/transaccion.html');
          if (!response.ok) throw new Error('HTTP ' + response.status);
          container.innerHTML = await response.text();
          executeScripts(container);

          // Guardar foco actual y mostrar overlay.
          _lastFocusedEl = document.activeElement;
          overlay.classList.add('active');
          overlay.setAttribute('aria-hidden', 'false');

          // Foco al primer campo del form.
          var firstInput = container.querySelector('select, input, textarea, button');
          if (firstInput) setTimeout(function () { firstInput.focus(); }, 50);
        } catch (err) {
          window._modalMode = false;
          console.error('Error abriendo modal de transacción:', err.message);
        }
      }

      function cerrarModal() {
        var overlay = document.getElementById('transaccionModal');
        var container = document.getElementById('transaccionModalContent');
        window._modalMode = false;
        overlay.classList.remove('active');
        overlay.setAttribute('aria-hidden', 'true');
        // Limpiar después de la transición (300ms).
        setTimeout(function () { container.innerHTML = ''; }, 300);
        // Restaurar foco.
        if (_lastFocusedEl) { _lastFocusedEl.focus(); _lastFocusedEl = null; }
        // Si la transacción se guardó con éxito, recargar la vista actual.
        if (window._modalRefresh) {
          window._modalRefresh = false;
          if (typeof loadView === 'function' && window.routerContext && window.routerContext.currentView) {
            loadView(window.routerContext.currentView);
          }
        }
      }

      // ESC cierra el modal de transacción.
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && document.getElementById('transaccionModal').classList.contains('active')) {
          cerrarModal();
        }
      });

      // Clic en el backdrop (fuera del dialog) cierra el modal.
      document.getElementById('transaccionModal').addEventListener('click', function (e) {
        if (e.target === e.currentTarget) cerrarModal();
      });

      // ── Modal helpers ─────────────────────────────────────────────
      function showLogoutModal() {
        const modal = document.getElementById('logoutModal');
        document.getElementById('logoutModalError').style.display = 'none';
        modal.classList.add('active');
        // Foco al botón seguro por defecto
        setTimeout(function () { document.getElementById('logoutCancelBtn').focus(); }, 50);
      }

      function hideLogoutModal() {
        document.getElementById('logoutModal').classList.remove('active');
      }

      // Focus trap — Tab / Shift+Tab entre los dos botones del modal
      document.getElementById('logoutModal').addEventListener('keydown', function (e) {
        if (e.key === 'Escape') { hideLogoutModal(); return; }
        if (e.key !== 'Tab') return;
        var cancel  = document.getElementById('logoutCancelBtn');
        var confirm = document.getElementById('logoutConfirmBtn');
        if (e.shiftKey && document.activeElement === cancel) {
          e.preventDefault(); confirm.focus();
        } else if (!e.shiftKey && document.activeElement === confirm) {
          e.preventDefault(); cancel.focus();
        }
      });

      // Clic fuera del dialog → cerrar
      document.getElementById('logoutModal').addEventListener('click', function (e) {
        if (e.target === e.currentTarget) hideLogoutModal();
      });

      // Delegación: cualquier elemento con data-logout-trigger abre el modal
      // Cubre sidebar (static) y vistas inyectadas dinámicamente (configuracion)
      document.addEventListener('click', function (e) {
        if (e.target.closest('[data-logout-trigger]')) showLogoutModal();
      });

      // Cancelar
      document.getElementById('logoutCancelBtn').addEventListener('click', hideLogoutModal);

      // Confirmar logout
      document.getElementById('logoutConfirmBtn').addEventListener('click', async function () {
        var confirmBtn = document.getElementById('logoutConfirmBtn');
        var cancelBtn  = document.getElementById('logoutCancelBtn');
        var errorEl    = document.getElementById('logoutModalError');
        var spinner    = document.getElementById('logoutConfirmSpinner');
        var text       = document.getElementById('logoutConfirmText');

        // Estado de carga
        confirmBtn.disabled = true;
        cancelBtn.disabled  = true;
        confirmBtn.setAttribute('aria-busy', 'true');
        spinner.style.display = 'inline-block';
        text.style.display    = 'none';
        errorEl.style.display = 'none';

        try {
          await logout(); // redirige a #login — el código siguiente no se ejecuta
        } catch (err) {
          // Error al cerrar sesión — mostrar feedback y restaurar UI
          errorEl.textContent   = 'Error al cerrar sesión. Intenta de nuevo.';
          errorEl.style.display = 'block';
          confirmBtn.disabled   = false;
          cancelBtn.disabled    = false;
          confirmBtn.removeAttribute('aria-busy');
          spinner.style.display = 'none';
          text.style.display    = 'inline';
        }
      });
    </script>
</body>
</html>
